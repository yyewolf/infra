# The password CNPG sets on the `dawarich` role, and the same one the
# PushSecret beside this copies into the dawarich namespace. Both ends read this
# file, so the role and the application cannot drift apart.
#
# Alphanumeric only. Nothing here URL-encodes it — Dawarich takes the password
# as its own env var rather than inside a DSN — but its entrypoint will happily
# parse a DATABASE_URL with shell expansion if one is ever set, and a password
# containing `@` or `/` would be silently truncated there.
apiVersion: v1
kind: Secret
metadata:
    name: dawarich-db-credentials
    namespace: postgres
type: Opaque
stringData:
    username: ENC[AES256_GCM,data:mCeyUysaVSo=,iv:nsAMc2nZTl7EJ4Qw6+NAICVYqTdFgOSk3kFmdspIF7c=,tag:mVSnVwl6757PY0EXTN0RJA==,type:str]
