apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: rustfs
  namespace: flux-system
spec:
  decryption:
    provider: sops
    secretRef:
      name: sops-gpg
  dependsOn:
  - name: envoy-proxy
  interval: 10m
  path: ./flux/apps/rustfs
  prune: false
  retryInterval: 1m
  sourceRef:
    kind: GitRepository
    name: flux-system
