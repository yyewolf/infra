# The identity the SecretStore authenticates as when it writes the rendered
# DATABASE_URL into the umami namespace.
#
# Its own ServiceAccount rather than reusing `eso-push-writer` from the
# vaultwarden directory: that one is created by a different Flux Kustomization,
# and sharing it would make this directory silently depend on that one applying
# first. One SA per app keeps each directory self-contained, and the SA has no
# permissions beyond the RoleBinding below.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: eso-push-writer-umami
  namespace: postgres
---
# In the umami namespace, not this one: this is what the SA is allowed to do at
# the far end of the push. Secrets only, and only the verbs a PushSecret needs
# to create and keep one up to date.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: eso-push-writer
  namespace: umami
rules:
- apiGroups: [""]
  resources: [secrets]
  verbs: [get, list, watch, create, update, patch]
- apiGroups: [authorization.k8s.io]
  resources: [selfsubjectrulesreviews]
  verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: eso-push-writer
  namespace: umami
subjects:
- kind: ServiceAccount
  name: eso-push-writer-umami
  namespace: postgres
roleRef:
  kind: Role
  name: eso-push-writer
  apiGroup: rbac.authorization.k8s.io
