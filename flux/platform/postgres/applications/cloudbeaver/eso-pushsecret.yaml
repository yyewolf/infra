# This directory is the odd one out among platform/postgres/applications: every
# other one declares a `Database` and a `DatabaseRole` and pushes that role's
# credentials to its app. CloudBeaver gets no database and no role of its own —
# the whole point of it is to reach the ones that already exist — so all that is
# left is the push.
#
# The source is `postgres-superuser`, generated by CNPG because
# `enableSuperuserAccess: true` is set on the Cluster. It is not in git and it
# is not a SOPS file; the operator owns it, and the refresh below is what keeps
# the copy in the cloudbeaver namespace current if it is ever regenerated.
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: cloudbeaver-postgres
  namespace: postgres
spec:
  refreshInterval: 1h
  # The copy at the far end outlives this object on purpose. Deleting it on a
  # reconcile blip would take a running CloudBeaver's connection with it.
  deletionPolicy: None
  secretStoreRefs:
  - name: cloudbeaver
    kind: SecretStore
  selector:
    secret:
      name: postgres-superuser
  # Only the two keys the init container reads. The CNPG secret also carries
  # `uri`, `pgpass` and a jdbc URL with the password inline; there is no reason
  # for another namespace to hold four copies of the same password.
  data:
  - match:
      secretKey: username
      remoteRef:
        remoteKey: cloudbeaver-postgres
        property: username
  - match:
      secretKey: password
      remoteRef:
        remoteKey: cloudbeaver-postgres
        property: password
