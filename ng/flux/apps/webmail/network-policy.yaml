apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: webmail
spec:
  endpointSelector:
    matchLabels:
      app: webmail
  ingress:
  - fromEndpoints:
    - matchLabels:
        io.kubernetes.pod.namespace: envoy-gateway-system
        app.kubernetes.io/name: envoy
        app.kubernetes.io/component: proxy
    toPorts:
    - ports:
      - port: "3000"
        protocol: TCP
  - fromEndpoints:
    - matchLabels:
        io.kubernetes.pod.namespace: webmail
  - fromEntities:
    - host
    - remote-node
    - health
  egress:
  - toEndpoints:
    - matchLabels:
        io.kubernetes.pod.namespace: kube-system
        k8s-app: kube-dns
    toPorts:
    - ports:
      - port: "53"
        protocol: UDP
      - port: "53"
        protocol: TCP
  - toEndpoints:
    - matchLabels:
        io.kubernetes.pod.namespace: stalwart
        app: stalwart
    toPorts:
    - ports:
      - port: "8080"
        protocol: TCP
