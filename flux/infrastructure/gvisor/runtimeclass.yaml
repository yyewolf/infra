# gVisor runtime class.
#
# The containerd runtime handler comes from the siderolabs/gvisor system
# extension plus talos/patches/gvisor.yaml, which registers 'runsc-netraw'
# — stock runsc with --net-raw and --allow-packet-socket-write. The extension's
# own flagless 'runsc' handler is also present on the node but deliberately has
# no RuntimeClass here: nothing should reach it by accident.
#
# All three LAN hosts carry it, so the selector matches the control-plane role,
# same as kata. edge-0 does not have the extension — a pod that landed there
# would be admitted and then fail at the kubelet with an unknown runtime
# handler, which is exactly what the selector prevents. Any node added to the
# extension list in talos/cluster.yaml is covered automatically as long as
# it is a control-plane node; anything else needs this selector revisited.
---
apiVersion: node.k8s.io/v1
kind: RuntimeClass
metadata:
  name: gvisor
handler: runsc-netraw
overhead:
  # The sentry and gofer are ordinary host processes sitting beside the
  # container. Cheaper than kata's VM, but not free.
  podFixed:
    cpu: 100m
    memory: 64Mi
scheduling:
  nodeSelector:
    yewolf.fr/gvisor: "true"
