apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: cloudbeaver
  namespace: postgres
spec:
  provider:
    kubernetes:
      remoteNamespace: cloudbeaver
      server:
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
      auth:
        # Must match the ServiceAccount in eso-writer.yaml, which is the one
        # the RoleBinding in the cloudbeaver namespace grants. Pointing this at
        # another directory's writer authenticates as an identity with no
        # rights there, and the store fails validation with the unhelpful
        # "client is not allowed to get secrets".
        serviceAccount:
          name: eso-push-writer-cloudbeaver
