# The identity the SecretStore authenticates as when it writes the database
# credentials into the nounoursdestavernes namespace.
#
# Its own ServiceAccount, one per app, for the same reason the postgres
# tenants each have one: sharing an SA created by a different Flux
# Kustomization would make this directory silently depend on that one applying
# first. The SA has no permissions beyond the RoleBinding below.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: eso-push-writer-uptime-kuma
  namespace: mysql
---
# In the tenant's namespace, not this one: this is what the SA is allowed to do
# at the far end of the push. Secrets only, and only the verbs a PushSecret
# needs to create one and keep it up to date.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: eso-push-writer
  namespace: nounoursdestavernes
rules:
- apiGroups: [""]
  resources: [secrets]
  verbs: [get, list, watch, create, update, patch]
- apiGroups: [authorization.k8s.io]
  resources: [selfsubjectrulesreviews]
  verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: eso-push-writer
  namespace: nounoursdestavernes
subjects:
- kind: ServiceAccount
  name: eso-push-writer-uptime-kuma
  namespace: mysql
roleRef:
  kind: Role
  name: eso-push-writer
  apiGroup: rbac.authorization.k8s.io
