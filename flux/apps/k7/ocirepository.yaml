# The chart is published to GHCR only — there is no HTTP Helm repository. Same
# shape as platform/cnmsql for the same reason.
#
# It is the upstream chart from the K7 repo itself (charts/k7), stamped with the
# release tag by their helm-release workflow, so chart version == appVersion ==
# the image tag. That coupling is why `image.tag` is left empty in the
# HelmRelease: the chart defaults it to .Chart.AppVersion, and pinning it here
# separately would be a second version to keep in step for no gain.
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: k7
spec:
  interval: 1h
  url: oci://ghcr.io/kaybi-gh/charts/k7
  layerSelector:
    mediaType: "application/vnd.cncf.helm.chart.content.v1.tar+gzip"
    operation: copy
  ref:
    tag: 1.13.0
    digest: sha256:f04b8d183501249c89a51732747823bbc8274352f1261ce3e082c7df2f5f5393
