apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: envoy-gateway
spec:
  gatewayClassName: eg
  # Apps do not get to bolt listeners onto this Gateway by default — the
  # Gateway API default is to allow no ListenerSets at all, and it stays that
  # way for everything not named here. `portfoliosh` is the exception: its SSH
  # listener is useful to that one app, so it declares it in its own directory
  # (apps/portfoliosh/listenerset.yaml) and this is the consent half.
  #
  # Selector rather than `All`, so a new namespace cannot open a port on the
  # public edge by creating an object in its own directory. The label is the
  # one the kubelet stamps on every namespace.
  allowedListeners:
    namespaces:
      from: Selector
      selector:
        matchLabels:
          kubernetes.io/metadata.name: portfoliosh
  listeners:
  - protocol: HTTP
    port: 80
    name: http
    allowedRoutes:
      namespaces:
        from: All
  - protocol: HTTPS
    port: 443
    name: https
    tls:
      mode: Terminate
      certificateRefs:
      - kind: Secret
        group: ""
        name: hackcorp-host-secret
        namespace: cert-manager
      - kind: Secret
        group: ""
        name: yewolf.fr
        namespace: cert-manager
    allowedRoutes:
      namespaces:
        from: All
