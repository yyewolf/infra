# The three classes are declared here rather than through the chart's
# `persistence.*` values (which is set to createStorageClass: false), so that
# all three read side by side and a diff between them is the whole story. They
# reproduce the chart's own parameter set — only replica count, locality and
# which disk pool they land on differ.
#
# Every class carries a `diskSelector`, because there are two pools and they are
# not interchangeable (see talos/patches/longhorn.yaml):
#
#   nvme  100 GiB/node on the system disk — fast, but shares a device with
#         etcd's write path
#   sata  ~238 GiB/node on a disk that is Longhorn's alone — slower, entirely
#         uncontended
#
# `longhorn-yolo` takes `nvme`: it is what the databases use, one replica,
# strict-local, and low latency is the entire reason that class exists. Its
# working set is small and bounded — four 20 GiB instances today against a
# 300 GiB raw pool. Everything else takes `sata`, so bulk data and CI churn
# never land next to etcd.
#
# `diskSelector` is stamped onto a Volume when it is provisioned, like
# reclaimPolicy: changing it here steers new volumes only. Existing volumes stay
# on whichever disk holds them until someone requests eviction of that disk.
#
# Every class is WaitForFirstConsumer. That is the half of "schedule the
# workload where its data is" that Kubernetes can actually enforce: binding and
# provisioning are held until a pod using the claim is scheduled, so the
# replicas get placed around the node the scheduler picked instead of the pod
# being pulled toward a volume that was provisioned somewhere arbitrary at
# `kubectl apply` time. With Immediate it is a coin flip.
#
# The other half is dataLocality, and what it can promise differs per class —
# see each one. Note that a Longhorn v1 volume is reachable over the network
# from any node, so apart from strict-local no PV here carries nodeAffinity: a
# rescheduled pod is never *prevented* from moving, Longhorn just moves a
# replica to follow it. `longhorn-ci` is now the only class that pins, and it
# pins something that lives and dies inside one pipeline; the four database
# volumes still carry a nodeAffinity from when `longhorn-yolo` was strict-local,
# because a PV's is immutable once written.
#
# Every class is reclaimPolicy: Retain, including yolo. Deleting a PVC — by
# hand, or by Flux pruning a Kustomization, or by a chart being uninstalled —
# then leaves the PV and the Longhorn volume behind instead of taking the data
# with it. The chart's default is Delete, which makes `kubectl delete pvc` an
# unrecoverable operation with no confirmation step.
#
# Two consequences that are not obvious, and are the price of this:
#
#   - Retained volumes are not garbage. A deleted PVC leaves its PV in
#     `Released` and the Longhorn volume still occupying the per-node budget
#     forever. Nothing reclaims it, so `kubectl get pv | grep Released` is
#     housekeeping someone has to actually do, and running out of space will
#     look like a provisioning failure rather than a pile of orphans.
#   - Retain does not mean "reattaches next time". A `Released` PV keeps a
#     claimRef pointing at the PVC that is gone, and Kubernetes will not bind
#     it to a new one; recreating the app gets a *fresh empty volume* and the
#     old data sits there unreferenced. Getting it back means clearing
#     `.spec.claimRef` on the PV by hand. Retain buys recoverability, not
#     continuity.
#
# reclaimPolicy is stamped onto each PV when it is provisioned, so changing it
# here never affects volumes that already exist — only newly created ones.
---
# Default. Three replicas across three nodes, so the cluster survives losing
# any one node with the volume still attached.
#
# dataLocality is deliberately 'disabled' and not 'best-effort': with three
# replicas, `replicaSoftAntiAffinity: false` (release.yaml) and exactly three
# storage nodes, every node already holds a replica. Locality is satisfied by
# construction and best-effort would have nothing left to do — setting it would
# only imply a guarantee that isn't coming from this knob.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: longhorn
  annotations:
    storageclass.kubernetes.io/is-default-class: "true"
provisioner: driver.longhorn.io
allowVolumeExpansion: true
reclaimPolicy: Retain
volumeBindingMode: WaitForFirstConsumer
parameters:
  numberOfReplicas: "3"
  dataLocality: "disabled"
  diskSelector: "sata"
  staleReplicaTimeout: "30"
  fromBackup: ""
  fsType: "ext4"
  unmapMarkSnapChainRemoved: "ignored"
  disableRevisionCounter: "true"
  dataEngine: "v1"
  backupTargetName: "default"
---
# Two replicas: still survives one node failure, at two thirds the disk cost
# and one less replica to keep in sync on every write.
#
# This is where best-effort locality earns its keep. Two replicas over three
# nodes means one node has none, so which nodes hold them is a real choice —
# Longhorn keeps one on the node the workload is attached to, giving local-disk
# reads, and rebuilds a local replica if the pod is later rescheduled
# elsewhere. Best-effort, not strict: if the local node is out of space or
# unschedulable, the volume stays up with both replicas remote rather than
# failing.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: longhorn-ha
provisioner: driver.longhorn.io
allowVolumeExpansion: true
reclaimPolicy: Retain
volumeBindingMode: WaitForFirstConsumer
parameters:
  numberOfReplicas: "2"
  dataLocality: "best-effort"
  diskSelector: "sata"
  staleReplicaTimeout: "30"
  fromBackup: ""
  fsType: "ext4"
  unmapMarkSnapChainRemoved: "ignored"
  disableRevisionCounter: "true"
  dataEngine: "v1"
  backupTargetName: "default"
---
# One replica, no redundancy — losing the node that holds it means the volume
# is unavailable until that node returns, and losing its disk means the data is
# gone. Hence the name. For scratch space, caches, and anything that replicates
# at the application layer instead (a CNPG or CNMSQL cluster, where three
# Postgres instances each on a 1-replica volume beats three instances on
# 3-replica volumes writing nine copies).
#
# best-effort rather than strict-local, and the difference is what happens on a
# cordoned node. strict-local puts a hard nodeAffinity on the PV, so when
# `talos.sh upgrade` drains a node the database pod on it is evicted and then
# sits Pending — it is only allowed to run on the node that was just cordoned,
# and that instance is down for the whole maintenance window. best-effort writes
# no nodeAffinity: the pod reschedules elsewhere, attaches over the network to
# the replica on the (cordoned, still running) node, and Longhorn rebuilds a
# local replica behind it. For CNPG that turns a stall into a failover.
#
# The price is that a pod which moves drags a full replica rebuild across the
# LAN with it, and serves its reads remotely until that finishes. Nothing
# routine should move one: the descheduler refuses to evict PVC-backed pods
# (platform/descheduler), which is the protection that makes this affordable —
# under strict-local it was merely pointless, here it is load-bearing.
#
# What this does *not* change is the drain block itself. Longhorn's
# node-drain-policy is block-if-contains-last-replica and there is exactly one
# replica, so the node always holds the last one and the instance-manager
# eviction is still refused — see the comment in talos/talos.sh.
#
# Only the locality is best-effort, not the redundancy: one replica still means
# losing the node's disk loses the data.
#
# Do not add allowedTopologies to this class. The PV nodeAffinity it produces is
# immutable, which is the whole reason the four volumes provisioned under
# strict-local are still pinned to their original nodes — changing this
# parameter steers new volumes only, and cannot unpin an existing PV.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: longhorn-yolo
provisioner: driver.longhorn.io
allowVolumeExpansion: true
reclaimPolicy: Retain
volumeBindingMode: WaitForFirstConsumer
parameters:
  numberOfReplicas: "1"
  dataLocality: "best-effort"
  diskSelector: "nvme"
  staleReplicaTimeout: "30"
  fromBackup: ""
  fsType: "ext4"
  unmapMarkSnapChainRemoved: "ignored"
  disableRevisionCounter: "true"
  dataEngine: "v1"
  backupTargetName: "default"
---
# The one class that is reclaimPolicy: Delete, and the reason it exists is that
# "deleting a PVC must never lose data" is the wrong default for a volume whose
# entire contents are a git checkout and a build cache.
#
# The consumer is woodpecker: its Kubernetes backend provisions a workspace PVC
# per pipeline and deletes it when the pipeline ends. Under Retain each build
# would leave behind a Released PV and a Longhorn volume out of a finite
# per-node budget, forever, with nothing to reclaim it — a CI system is exactly the
# workload that turns "housekeeping someone has to do" into "the partition is
# full by Thursday". Here the delete is the point, and nothing of value is lost
# by it.
#
# This is the one class that keeps strict-local, and it is not an oversight.
# What best-effort buys longhorn-yolo is a pod surviving the node it is on being
# cordoned; a woodpecker workspace has nothing to survive with. It is created by
# the first step of a pipeline and deleted by the last, the step pods are bare
# pods with no owner, and an eviction is a failed build either way — so there is
# no rescheduling to enable, and pinning image builds to local I/O is worth more.
#
# Do not point a stateful app at this class because the name sounds fast. It is
# identical to longhorn-yolo apart from that, the reclaim policy and the pool —
# and it is on `sata`, the slower one, deliberately: a build cache is the last
# thing that should be sharing a device with etcd. The reclaim policy is stamped
# onto the PV at provisioning time, so a database moved onto this class is one
# `kubectl delete pvc` from gone, with no confirmation step.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: longhorn-ci
provisioner: driver.longhorn.io
allowVolumeExpansion: true
reclaimPolicy: Delete
volumeBindingMode: WaitForFirstConsumer
parameters:
  numberOfReplicas: "1"
  dataLocality: "strict-local"
  diskSelector: "sata"
  staleReplicaTimeout: "30"
  fromBackup: ""
  fsType: "ext4"
  unmapMarkSnapChainRemoved: "ignored"
  disableRevisionCounter: "true"
  dataEngine: "v1"
  backupTargetName: "default"
---
# Bulk capacity from the ZFS tank on w-1, attachable from any node.
#
# The fourth pool, and the only one that is not on every storage node: `bigpool`
# is a single 12 TiB-quota dataset on w-1's raidz1 (see
# talos/patches/zfs-tank.yaml). Everything above spreads across cp-0/1/2;
# this one exists on exactly one machine and is reachable from the others the
# way any Longhorn v1 volume is — the engine runs on the node the pod landed
# on and talks to the replica over TCP. Nothing here pins a workload to w-1.
#
# numberOfReplicas: 1 is not a durability choice, it is arithmetic — one node
# carries the tag, so a second replica has nowhere to go and asking for one
# leaves every volume permanently Degraded. The redundancy is real but it is
# underneath Longhorn, not in it: raidz1 survives a disk. It does not survive
# the machine, and it is not a backup.
#
# dataLocality is 'disabled', and this is the one parameter that must not be
# changed:
#
#   - strict-local writes a nodeAffinity onto every PV pinning its pod to
#     w-1, which destroys the only property this class exists to provide.
#     A PV's nodeAffinity is immutable, so that mistake is not repairable by
#     editing this file — it is repairable by recreating the volumes.
#   - best-effort would have Longhorn try to keep a replica on whichever node
#     the pod runs. No other disk carries `bigpool`, so it can never succeed;
#     setting it would imply a guarantee that is not coming from this knob.
#
# For the same reason, do not add allowedTopologies.
#
# Two consequences that are the price of a one-node pool, both deliberate:
#
#   - w-1 going down takes every big-pool volume with it, cluster-wide,
#     including on nodes that are perfectly healthy. Elsewhere a node failure
#     costs you the pods on that node; here it costs you the class.
#   - w-1 cannot be drained while any big-pool volume exists. Longhorn's
#     node-drain-policy is block-if-contains-last-replica and with one replica
#     w-1 always holds the last one, so `talos.sh upgrade w-1` hits the
#     same instance-manager eviction refusal documented for longhorn-yolo in
#     talos/talos.sh — but for every volume on this class at once.
#
# What this class is NOT for, and both are load-bearing:
#
#   - The data already on the tank. Longhorn owns its on-disk layout — volumes
#     are opaque sparse images under <disk>/replicas/ — so it cannot be pointed
#     at /var/mnt/tank/servarr and serve that. Existing bulk data stays as
#     hostPath PVs with `location: home1` nodeAffinity. The two mechanisms
#     share the pool and do different jobs.
#   - Multi-writer workloads. This is RWO. Longhorn implements RWX by spawning
#     a share-manager pod that re-exports the volume over NFS, which for
#     something like the servarr stack means NFS on top of sparse files on top
#     of ZFS to reach what is already a plain directory. Serve those from an
#     NFS pod with a hostPath instead — one layer rather than three.
#
# Reads and writes cross the LAN. On 1GbE that is a ~110 MB/s ceiling per
# volume, which is fine for media and wrong for anything latency-bound; the
# databases have longhorn-yolo for that reason.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: big-pool
provisioner: driver.longhorn.io
allowVolumeExpansion: true
reclaimPolicy: Retain
volumeBindingMode: WaitForFirstConsumer
parameters:
  numberOfReplicas: "1"
  dataLocality: "disabled"
  diskSelector: "bigpool"
  staleReplicaTimeout: "30"
  fromBackup: ""
  fsType: "ext4"
  unmapMarkSnapChainRemoved: "ignored"
  disableRevisionCounter: "true"
  dataEngine: "v1"
  backupTargetName: "default"
