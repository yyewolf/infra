apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: longhorn
spec:
  interval: 30m
  chart:
    spec:
      chart: longhorn
      version: "1.12.0"
      sourceRef:
        kind: HelmRepository
        name: longhorn
      interval: 12h
  install:
    crds: CreateReplace
    # The chart lays down CRDs, a webhook and three DaemonSets that all have to
    # settle before the driver deployer will register the CSI driver. The stock
    # 5m is not enough on a cold cluster that is still pulling the images.
    timeout: 10m
  upgrade:
    crds: CreateReplace
    timeout: 10m
  values:
    defaultSettings:
      # Only register disks on nodes carrying the
      # node.longhorn.io/create-default-disk label, and take the disk list from
      # the node.longhorn.io/default-disks-config annotation. Both are set by
      # ng/talos/patches/longhorn.yaml, which is also what mounts the two
      # volumes they name — so the disks a node offers and the disks Longhorn
      # registers are declared in one place, with the tags (`nvme`, `sata`)
      # that storageclasses.yaml selects on.
      #
      # This is the second half of "edge-0 is not a storage node", and the
      # stronger half: without the label a node gets no disks at all, so an
      # untainted worker added later cannot become one by accident. Registration
      # is one-shot — neither the label nor the annotation does anything to a
      # node Longhorn already knows about.
      createDefaultDiskLabeledNodes: true

      # Only reached for a node labelled `true` rather than `config`, i.e. never
      # here. Kept pointing at a real mount anyway: unset it and the fallback is
      # /var/lib/longhorn, a directory on EPHEMERAL, which is where replica data
      # would compete with container images and logs.
      defaultDataPath: /var/mnt/longhorn

      # Both disks are Longhorn's alone, so there is no host filesystem to leave
      # headroom for. The stock 30% would silently hand back 30 of every 100 GiB
      # given to it.
      storageReservedPercentageForDefaultDisk: 0

      # Phones home to Rancher's upgrade responder. The network policy denies
      # `world` outright, so leaving this on only buys a failing request every
      # hour and a misleading error in the manager log.
      upgradeChecker: false

      # Refuse to schedule a replica onto a node that already holds one of the
      # same volume. Default, spelled out because it is the whole reason three
      # replicas across three nodes is worth anything.
      replicaSoftAntiAffinity: false

    persistence:
      # All three StorageClasses are declared in storageclasses.yaml instead.
      # The chart can only express one, and it builds it through a ConfigMap
      # that longhorn-manager turns into the real object — which would leave
      # the default class described in a different form, and in a different
      # file, from the two beside it.
      createStorageClass: false

    # Pin every user-deployed component to the nodes that are deliberately part
    # of Longhorn. edge-0's `edge-0=true:NoSchedule` taint already keeps them off
    # it — nothing here tolerates it — but that is a property of the *node*, and
    # an untainted worker added later would silently become a storage node with
    # no partition carved for it. The selector is what actually states the intent.
    #
    # That intent used to be spelled `node-role.kubernetes.io/control-plane`,
    # which was the same set only while every storage node happened to also run
    # etcd. w-1 broke that: a worker holding the ZFS tank, and therefore the one
    # node in the cluster that most needs a manager. The role selector did not
    # merely fail to include it — it made Longhorn unaware the node existed at
    # all, since `nodes.longhorn.io` objects are created by the manager.
    #
    # A capability label keeps the guard the comment above describes while
    # letting a storage node be chosen on purpose: it is set by the same patches
    # that carve the disk (patches/longhorn.yaml for cp-0/1/2,
    # patches/zfs-tank-longhorn.yaml for w-1), so a node cannot advertise
    # Longhorn without also having been given somewhere to put the data. A
    # worker added later still gets nothing by default.
    #
    # CHANGING THIS IS ORDER-SENSITIVE. The label must exist on the nodes before
    # this selector reaches the cluster; reconcile it first and every manager is
    # evicted at once, taking the CSI plugin and every attached volume with it.
    #
    # System-managed components (instance managers, the CSI plugin) follow the
    # manager: Longhorn only places them on nodes where a manager is running.
    longhornManager:
      nodeSelector:
        yewolf.fr/longhorn: "true"
    longhornDriver:
      nodeSelector:
        yewolf.fr/longhorn: "true"
    longhornUI:
      nodeSelector:
        yewolf.fr/longhorn: "true"

    # Plain NetworkPolicy objects shaped for k3s/rke. This cluster expresses
    # policy as CiliumNetworkPolicy — see network-policy.yaml.
    networkPolicies:
      enabled: false

    # No prometheus-operator in this cluster yet; the ServiceMonitor CRD would
    # not resolve.
    metrics:
      serviceMonitor:
        enabled: false
