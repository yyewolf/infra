# The OAuth2 client credentials authentik issued for this application, from the
# provider named "Provider for Dawarich".
#
# Its own file rather than two more keys in dawarich-secrets: that one is
# already encrypted, so appending to it would mean decrypting it first. These
# are also the only values here that have to stay in step with something
# outside this repo, so a rotation is one file on this side and one provider on
# the other.
#
# Both are plain alphanumeric rather than authentik's generated form. Its
# default client secret is drawn from the full printable set and routinely
# contains a quote, which does not survive being written into YAML by hand.
#
# Consumed by both containers through envFrom in deployment.yaml. Everything
# non-secret about the OIDC setup — issuer, redirect URI, whether new accounts
# may be created — is in the ConfigMap there.
apiVersion: v1
kind: Secret
metadata:
    name: dawarich-oidc
type: Opaque
