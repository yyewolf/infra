# home-assistant is the one namespace where a policy per namespace is not
# possible, so this is a policy per workload and it deliberately covers only
# five of the seven.
#
# `home-assistant` and `esphome` run `hostNetwork: true`. A host-networked pod
# is not a Cilium endpoint — it shares the node's network namespace and carries
# the `host` identity — so no `endpointSelector` here can select it and no
# CiliumNetworkPolicy can constrain it. Policing those two
# needs Cilium's host firewall (`hostFirewall.enabled` in the Helm values, plus
# CiliumClusterwideNetworkPolicy with a `nodeSelector`), which is a cluster-wide
# change affecting every node and is not in scope here. Until then their network
# reach is unrestricted, which is the same exception HARDENING-EXCEPTIONS.md
# already records for their pod-level privileges.
#
# That also explains why so many rules below reach for `host`/`remote-node`
# rather than naming a peer: when Home Assistant itself calls mosquitto, piper
# or the speech-to-text service, the traffic arrives from the node identity.
# There is no way to distinguish it from any other host-network process on the
# node, and tightening these rules further is only possible once the host
# firewall covers the callers.

# ---------------------------------------------------------------- mosquitto
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: mqtt
spec:
  endpointSelector:
    matchLabels:
      app: mqtt
  ingress:
  # zigbee2mqtt publishing device state. The only in-cluster pod client that
  # publishes device topics.
  - fromEndpoints:
    - matchLabels:
        app: zigbee2mqtt
    toPorts:
    - ports:
      - port: "1883"
        protocol: TCP
  # Frigate publishing camera/discovery state to its own topic tree.
  - fromEndpoints:
    - matchLabels:
        app: frigate
    toPorts:
    - ports:
      - port: "1883"
        protocol: TCP
  # Home Assistant subscribing (host-networked, so it arrives as the node), and
  # LAN devices coming in through the `mosquitto` NodePort on 31883 — Cilium
  # rewrites that to 1883 before policy is evaluated, so 31883 never appears
  # here. Authentication is mosquitto's own, from the mosquitto-passwords
  # Secret; this rule is not what keeps strangers out.
  - fromEntities:
    - host
    - remote-node
    toPorts:
    - ports:
      - port: "1883"
        protocol: TCP
  egress:
  - toEndpoints:
    - matchLabels:
        io.kubernetes.pod.namespace: kube-system
        k8s-app: kube-dns
    toPorts:
    - ports:
      - port: "53"
        protocol: UDP
      - port: "53"
        protocol: TCP

# --------------------------------------------------------------- zigbee2mqtt
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: zigbee2mqtt
spec:
  endpointSelector:
    matchLabels:
      app: zigbee2mqtt
  ingress:
  # The UI is tailnet-only: ingress.yaml gives it an `ingressClassName:
  # tailscale` Ingress and no public HTTPRoute, so the operator's proxy pod is
  # the only thing that should reach it. Same shape as apps/scrutiny.
  - fromEndpoints:
    - matchLabels:
        io.kubernetes.pod.namespace: tailscale
    toPorts:
    - ports:
      - port: "8080"
        protocol: TCP
  # kubelet probes.
  - fromEntities:
    - host
    - remote-node
    - health
  egress:
  - toEndpoints:
    - matchLabels:
        io.kubernetes.pod.namespace: kube-system
        k8s-app: kube-dns
    toPorts:
    - ports:
      - port: "53"
        protocol: UDP
      - port: "53"
        protocol: TCP
  # Publishing to mosquitto. The Zigbee radio is a USB dongle on the node, not
  # something reached over the network, so this is its only peer — no egress to
  # `world` at all.
  - toEndpoints:
    - matchLabels:
        app: mqtt
    toPorts:
    - ports:
      - port: "1883"
        protocol: TCP

# ------------------------------------------------------------- piper (TTS)
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: piper
spec:
  endpointSelector:
    matchLabels:
      app: piper
  ingress:
  # Home Assistant's Wyoming integration, arriving as the node because it is
  # host-networked. Plus kubelet probes on the same rule.
  - fromEntities:
    - host
    - remote-node
    - health
    toPorts:
    - ports:
      - port: "10200"
        protocol: TCP
  egress:
  - toEndpoints:
    - matchLabels:
        io.kubernetes.pod.namespace: kube-system
        k8s-app: kube-dns
    toPorts:
    - ports:
      - port: "53"
        protocol: UDP
      - port: "53"
        protocol: TCP
  # Voice download on first run — the LSIO image fetches the model from GitHub
  # releases if the data volume is empty. Restricted to 443 rather than the
  # unrestricted `world` this namespace had before, and it stays because
  # wiping the PVC would otherwise leave the pod hanging at startup with no
  # obvious cause.
  - toEntities:
    - world
    toPorts:
    - ports:
      - port: "443"
        protocol: TCP

# --------------------------------------------------------------- stt (ASR)
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: stt
spec:
  endpointSelector:
    matchLabels:
      app: stt
  ingress:
  - fromEntities:
    - host
    - remote-node
    - health
    toPorts:
    - ports:
      - port: "10300"
        protocol: TCP
  egress:
  - toEndpoints:
    - matchLabels:
        io.kubernetes.pod.namespace: kube-system
        k8s-app: kube-dns
    toPorts:
    - ports:
      - port: "53"
        protocol: UDP
      - port: "53"
        protocol: TCP
  # Same reasoning as piper: the parakeet ONNX model is pulled from Hugging
  # Face on first start, not baked into the image.
  - toEntities:
    - world
    toPorts:
    - ports:
      - port: "443"
        protocol: TCP

# -------------------------------------------------------------- smart clock
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: smartclock
spec:
  endpointSelector:
    matchLabels:
      app: smartclock
  ingress:
  # The wall display reaching the `smartclock` NodePort 30080, which Cilium
  # rewrites to 8080 before policy runs.
  #
  # The display sits on the upstream 192.168.1.0/24 segment and arrives through
  # the router's `smartclock` port forward (see router/variables.tf,
  # wan_port_forwards). Both `world` and the node entities are listed because
  # which one Cilium sees depends on whether it SNATs the NodePort connection to
  # the node address: unSNATted the client is 192.168.1.x and reads as `world`,
  # SNATted it reads as `host`. The Service leaves externalTrafficPolicy at the
  # default, so do not assume either.
  #
  # Still not an internet exposure. That port forward is scoped to a source of
  # 192.168.1.0/24, and the router's WAN faces the home LAN rather than the
  # internet — reaching this from outside would need the upstream router to
  # forward a port as well.
  - fromEntities:
    - world
    - host
    - remote-node
    - health
    toPorts:
    - ports:
      - port: "8080"
        protocol: TCP
  egress:
  - toEndpoints:
    - matchLabels:
        io.kubernetes.pod.namespace: kube-system
        k8s-app: kube-dns
    toPorts:
    - ports:
      - port: "53"
        protocol: UDP
      - port: "53"
        protocol: TCP
  # No egress beyond DNS. It used to reach a snapcast server on 192.168.1.95 for
  # audio sync; snapcast is gone and that rule went with it, so serving the page
  # is all this pod does now.

# -------------------------------------------------------------------- frigate
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: frigate
spec:
  endpointSelector:
    matchLabels:
      app: frigate
  ingress:
  # The UI is tailnet-only: ingress.yaml gives it an `ingressClassName:
  # tailscale` Ingress and no public HTTPRoute, so the operator's proxy pod is
  # the only thing that should reach it. Same shape as zigbee2mqtt.
  - fromEndpoints:
    - matchLabels:
        io.kubernetes.pod.namespace: tailscale
    toPorts:
    - ports:
      - port: "5000"
        protocol: TCP
  # kubelet probes.
  - fromEntities:
    - host
    - remote-node
    - health
  egress:
  - toEndpoints:
    - matchLabels:
        io.kubernetes.pod.namespace: kube-system
        k8s-app: kube-dns
    toPorts:
    - ports:
      - port: "53"
        protocol: UDP
      - port: "53"
        protocol: TCP
  # Publishing camera state and discovery to Mosquitto.
  - toEndpoints:
    - matchLabels:
        app: mqtt
    toPorts:
    - ports:
      - port: "1883"
        protocol: TCP
  # RTSP to cameras on the home LAN. `toCIDRSet` rather than `toEntities: world`
  # — world would include the tailnet and the public internet, and a camera
  # feed is neither. Both ranges: the home LAN is 192.168.0.0/24 and the cluster
  # node network is 10.200.0.0/24 (inside 10.0.0.0/8). Tighten to exact camera
  # IPs once the camera list is final.
  - toCIDRSet:
    - cidr: 192.168.0.0/16
    - cidr: 10.0.0.0/8
    toPorts:
    - ports:
      - port: "554"
        protocol: TCP
