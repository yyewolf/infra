# Cilium for the ng cluster.
#
# Talos runs with cni: none and kube-proxy disabled (see
# ng/talos/patches/controlplane.yaml), so Cilium provides both the pod network
# and service load balancing. Nothing here is optional decoration — take a
# setting out and the cluster stops working in a specific way, noted per block.

ipam:
  mode: kubernetes

# Dual-stack. The CIDRs themselves come from Talos (ng/talos/cluster.yaml) via
# ipam.mode: kubernetes, which reads each node's podCIDRs — so there is nothing
# to keep in sync here beyond the on/off switch.
ipv4:
  enabled: true
ipv6:
  enabled: true

kubeProxyReplacement: true

# Talos exposes KubePrism, a node-local load balancer across every API server,
# on 127.0.0.1:7445. Pointing Cilium there rather than at the VIP solves a
# bootstrap ordering problem: the agent needs the API before it has set up the
# pod network that would let it reach a ClusterIP. It also means Cilium does not
# care which node currently holds the VIP.
k8sServiceHost: localhost
k8sServicePort: 7445

# Talos mounts cgroupv2 itself and runs an immutable root filesystem, so the
# chart must not try to mount cgroups, and the agent's capabilities have to be
# spelled out rather than inherited from a privileged container.
cgroup:
  autoMount:
    enabled: false
  hostRoot: /sys/fs/cgroup

securityContext:
  capabilities:
    ciliumAgent:
      - CHOWN
      - KILL
      - NET_ADMIN
      - NET_RAW
      - IPC_LOCK
      - SYS_ADMIN
      - SYS_RESOURCE
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    cleanCiliumState:
      - NET_ADMIN
      - SYS_ADMIN
      - SYS_RESOURCE

routingMode: tunnel
tunnelProtocol: vxlan

# This is the UNDERLAY MTU, not the pod MTU. Cilium subtracts the encapsulation
# overhead itself, so 1420 here produces pod interfaces at 1370. Setting the pod
# MTU you want directly is wrong in a way that happens to look right: Cilium
# would take 1370 as the underlay and the maths no longer describes the network.
#
# Verified end to end: cross-node iperf3 runs at line rate on both families
# (902 Mbit/s IPv4, 888 IPv6) with zero retransmits, which is the real proof the
# pod MTU matches the path. Do not use large ICMP echo to check this — Cilium
# drops it well below the true MTU and the numbers are misleading.
#
#     1420   WireGuard tunnel MTU, the narrowest underlay any node will use.
#            Measured, not assumed: `ping -M do` across the tunnel tops out at
#            a 1392-byte payload, +28 for the IPv4 and ICMP headers.
#   -   50   VXLAN: outer IPv4 20 + UDP 8 + VXLAN 8 + inner Ethernet 14.
#   ------
#     1370   resulting pod MTU
#
# Pinning it matters because Cilium otherwise auto-detects per node from the
# route to the default gateway: the three LAN nodes would see 1500 and the cloud
# edge worker, reaching the cluster through the router's WireGuard tunnel, would
# see 1420. Pod-to-pod traffic from a LAN node to the edge node would then be
# built for a 1500 underlay and silently dropped inside the tunnel.
#
# Cost is ~80 bytes of payload on LAN-only paths, roughly 5% of throughput.
# Changing this later restarts every pod, so it is set for the worst path now
# rather than re-cut when the edge node arrives.
MTU: 1420

operator:
  # Three nodes, so two replicas can actually land on different machines.
  replicas: 2
