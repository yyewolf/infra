# The namespace and the seven big-pool claims, separated from both the copy jobs
# and the apps so the three can be ordered:
#
#   home-assistant-storage  ->  home-assistant-migrate  ->  home-assistant
#        claims exist            data copied in             apps mount them
#
# They cannot be one Kustomization. The claims are ReadWriteOnce, so a copy job
# and a StatefulSet racing for the same volume leaves one of them Pending with
# a multi-attach error, and Flux has no way to sequence resources inside a
# single Kustomization.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: home-assistant-storage
  namespace: flux-system
spec:
  dependsOn:
  - name: longhorn
  interval: 10m
  path: ./ng/flux/apps/home-assistant/storage
  prune: false
  wait: true
  retryInterval: 1m
  sourceRef:
    kind: GitRepository
    name: flux-system
