apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cloudbeaver-postgres-creds
  namespace: flux-system
spec:
  dependsOn:
  - name: external-secrets
  - name: postgres
  interval: 10m
  path: ./flux/platform/postgres/applications/cloudbeaver
  prune: true
  retryInterval: 1m
  sourceRef:
    kind: GitRepository
    name: flux-system
