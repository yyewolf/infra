# Sysbox runtime class.
#
# Sysbox is a third sandbox, sitting between the two this cluster already has.
# kata gives a pod its own kernel in a VM; gvisor gives it a userspace kernel in
# a host process. Sysbox gives it neither — it is runc with the container placed
# in a user namespace and parts of procfs and sysfs emulated by sysbox-fs, so
# the workload keeps the host kernel and native performance but 'privileged'
# inside the container no longer means privileged on the host. What that buys
# in practice is running systemd, dockerd or kubelet inside an unprivileged pod.
#
# The containerd handler named below comes from the extension itself
# (/etc/cri/conf.d/10-sysbox.part), not from a Talos patch — see
# ng/talos/patches/sysbox.yaml for how the extension gets onto the node, which
# is not the usual Image Factory route.
#
# Not to be confused with the RuntimeClass *called* 'sysbox-runc' in
# ng/flux/infrastructure/gvisor/compat-sysbox-runc.yaml. That one is a migration
# shim pointing at gVisor for pipelines that inherited the old root-cluster
# default, and it keeps that meaning: a pipeline naming it is saying "sandbox
# me", not "give me the sysbox runtime". This class is the real thing and is
# opted into by name.
---
apiVersion: node.k8s.io/v1
kind: RuntimeClass
metadata:
  name: sysbox
handler: sysbox-runc
overhead:
  # sysbox-mgr and sysbox-fs are node-level daemons shared by every sandbox, so
  # the per-pod cost is only the extra bookkeeping and the FUSE round trips on
  # procfs reads — well under what a sentry or a VM costs.
  podFixed:
    cpu: 50m
    memory: 32Mi
scheduling:
  nodeSelector:
    # Set by ng/talos/patches/sysbox.yaml, so it is on exactly the nodes that
    # carry the extension — all three LAN hosts. Deliberately not the
    # control-plane role that kata and gvisor select on, even though it would
    # currently pick the same three: a label written by the same patch that
    # installs sysbox cannot disagree with reality, whereas a role selector
    # silently would during a rollout, or if a fourth control-plane node were
    # added without the extension. A pod admitted onto a node with no
    # sysbox-runc handler fails at the kubelet.
    yewolf.fr/sysbox: "true"
