apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: jellystat-db
  namespace: flux-system
spec:
  decryption:
    provider: sops
    secretRef:
      name: sops-gpg
  dependsOn:
  - name: external-secrets
  - name: postgres
  # Unlike the other *-db Kustomizations, this one writes its Role and
  # RoleBinding into a namespace it does not create — servarr comes from
  # servarr-storage. Without this the RoleBinding fails to apply on a cold
  # cluster and the push never authenticates.
  - name: servarr-storage
  interval: 10m
  path: ./flux/platform/postgres/applications/jellystat
  prune: true
  retryInterval: 1m
  sourceRef:
    kind: GitRepository
    name: flux-system
