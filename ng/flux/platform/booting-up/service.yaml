apiVersion: v1
kind: Service
metadata:
  name: caddy
spec:
  type: ClusterIP
  selector:
    app: caddy
  ports:
    - name: http
      protocol: TCP
      # The Service keeps port 80 so the KEDA interceptor's fallback target is
      # unchanged; only the container's listener moved (see deployment.yaml).
      port: 80
      targetPort: 8080
