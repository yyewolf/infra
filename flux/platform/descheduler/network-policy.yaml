# Cilium's default-deny is per-direction and per-endpoint: a rule with only
# `egress` leaves that endpoint's ingress wide open, so ingress is spelled out
# even though almost nothing calls in.
#
# The CronJob pod carries the chart's own labels, so this selects each run's
# pod without naming the Job.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: descheduler
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: descheduler
  ingress:
  # The chart attaches a liveness probe to the CronJob pod too, not just to the
  # Deployment form. That is the only inbound traffic: `service.enabled` and
  # `serviceMonitor.enabled` are both false, so nothing in the cluster can
  # reach 10258 and nothing tries.
  - fromEntities:
    - host
    toPorts:
    - ports:
      - port: "10258"
        protocol: TCP
  egress:
  # Everything this does is an API call: list nodes, pods, PDBs and PVCs, then
  # POST to pods/eviction. It never talks to a workload directly, and it does
  # not talk to metrics-server either — utilisation is read from pod requests,
  # which come off the pod objects. Switching LowNodeUtilization to real usage
  # keeps this rule as-is, since the metrics API is served through the
  # aggregation layer on the same endpoint.
  - toEntities:
    - kube-apiserver
    toPorts:
    - ports:
      - port: "6443"
        protocol: TCP
  - toEndpoints:
    - matchLabels:
        io.kubernetes.pod.namespace: kube-system
        k8s-app: kube-dns
    toPorts:
    - ports:
      - port: "53"
        protocol: UDP
      - port: "53"
        protocol: TCP
  # No `world`, and there is no plausible reason for that to change.
