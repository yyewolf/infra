# A StatefulSet at one replica rather than a Deployment, for the reason every
# workload in this directory is one: the volumes are RWO, so two pods must never
# exist at once. A Deployment can only promise that with `strategy: Recreate`,
# which is a rollout *policy* — one field away from a rolling update that
# deadlocks on Multi-Attach. A StatefulSet deletes the old pod and waits for it
# to actually go before creating its replacement, and there is no replicas > 1
# to reach for later because Jellyfin's sqlite library database cannot be shared.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: jellyfin
spec:
  replicas: 1
  serviceName: jellyfin
  selector:
    matchLabels:
      app: jellyfin
  template:
    metadata:
      labels:
        app: jellyfin
    spec:
      automountServiceAccountToken: false
      # Correctness, not preference — see storage/storage.yaml. servarr-media is
      # RWO and attached to w-1; a pod elsewhere cannot mount it.
      nodeSelector:
        kubernetes.io/hostname: w-1
      terminationGracePeriodSeconds: 1
      # runtimeClassName: nvidia
      containers:
      - name: jellyfin
        image: mirror.gcr.io/linuxserver/jellyfin:10.11.11@sha256:0dd18f8de37c7cfbe76877a8b928943b3588beb9678fb223121914ec9a3cdf7c
        securityContext:
          seccompProfile:
            type: RuntimeDefault
        ports:
        - containerPort: 8096
        env:
        - name: PUID
          value: "1000"
        - name: PGID
          value: "1000"
        - name: TZ
          value: "Europe/Paris"
        volumeMounts:
        - name: config
          mountPath: /config
        - name: data
          mountPath: /data
        resources:
          requests:
            cpu: 200m
            memory: 512Mi
          limits:
            cpu: 3000m
            memory: 5Gi
            # nvidia.com/gpu: 1
      volumes:
      - name: config
        persistentVolumeClaim:
          claimName: jellyfin-config
      - name: data
        persistentVolumeClaim:
          claimName: servarr-media
---
apiVersion: v1
kind: Service
metadata:
  name: jellyfin
spec:
  ports:
  - port: 80
    targetPort: 8096
  selector:
    app: jellyfin
