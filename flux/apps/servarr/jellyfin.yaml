# A StatefulSet at one replica rather than a Deployment, for the reason every
# workload in this directory is one: the volumes are RWO, so two pods must never
# exist at once. A Deployment can only promise that with `strategy: Recreate`,
# which is a rollout *policy* — one field away from a rolling update that
# deadlocks on Multi-Attach. A StatefulSet deletes the old pod and waits for it
# to actually go before creating its replacement, and there is no replicas > 1
# to reach for later because Jellyfin's sqlite library database cannot be shared.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: jellyfin
spec:
  replicas: 1
  serviceName: jellyfin
  selector:
    matchLabels:
      app: jellyfin
  template:
    metadata:
      labels:
        app: jellyfin
    spec:
      automountServiceAccountToken: false
      # Correctness, not preference — see storage/storage.yaml. servarr-media is
      # RWO and attached to w-1; a pod elsewhere cannot mount it.
      nodeSelector:
        kubernetes.io/hostname: w-1
      terminationGracePeriodSeconds: 1
      # Hardware transcoding on w-1's RTX 3060. This is not optional decoration
      # on top of the resource request below: on Talos the driver libraries live
      # in extension paths no generic volume mount covers, so only the
      # nvidia-container-runtime can put libnvidia-encode / libnvcuvid and
      # /dev/nvidia* inside the container. Same mechanism the device plugin
      # itself relies on — see flux/infrastructure/nvidia/device-plugin.yaml.
      runtimeClassName: nvidia
      containers:
      - name: jellyfin
        image: mirror.gcr.io/linuxserver/jellyfin:10.11.11@sha256:aef1046ab41bbd7b48e205e711aa31dfb1fa55a3fb8e22cbbb150a323c4a48c7
        securityContext:
          seccompProfile:
            type: RuntimeDefault
        ports:
        - containerPort: 8096
        env:
        - name: PUID
          value: "1000"
        - name: PGID
          value: "1000"
        - name: TZ
          value: "Europe/Paris"
        # The container runtime's default capability set is 'utility' alone,
        # which mounts nvidia-smi and nothing else — ffmpeg would find the GPU
        # via NVML, report it in the UI, and then fail to open an encoder. The
        # three that matter here:
        #   video    NVENC/NVDEC — libnvidia-encode, libnvcuvid. The whole point.
        #   compute  CUDA, for the tonemapping filters HDR->SDR needs.
        #   utility  nvidia-smi, so the GPU is inspectable from inside the pod.
        # Deliberately not 'all': that adds graphics/display, which pull in the
        # GL and DRM stack this workload never renders with.
        - name: NVIDIA_DRIVER_CAPABILITIES
          value: "compute,utility,video"
        volumeMounts:
        - name: config
          mountPath: /config
        - name: data
          mountPath: /data
        resources:
          requests:
            cpu: 200m
            memory: 512Mi
          limits:
            cpu: 3000m
            memory: 5Gi
            # Extended resources are integer-only and cannot be overcommitted:
            # Kubernetes copies this into requests, and w-1 advertises exactly 1,
            # so this pod holds the whole GPU. Nothing else on the node can be
            # granted nvidia.com/gpu while Jellyfin is running. That is fine
            # today because nothing else asks — frigate is deliberately CPU-only
            # — but it is the constraint to revisit before a second GPU
            # workload, which needs time-slicing on the device plugin rather
            # than a bigger number here.
            nvidia.com/gpu: 1
      volumes:
      - name: config
        persistentVolumeClaim:
          claimName: jellyfin-config
      - name: data
        persistentVolumeClaim:
          claimName: servarr-media
---
apiVersion: v1
kind: Service
metadata:
  name: jellyfin
spec:
  ports:
  - port: 80
    targetPort: 8096
  selector:
    app: jellyfin
