apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: uptime-kuma
  namespace: flux-system
spec:
  dependsOn:
  # envoy-proxy for the Gateway the route attaches to. Not uptime-kuma-db:
  # that Kustomization writes a Role into this namespace, so it is the one that
  # waits, and the pod simply stays pending on its missing secret until the
  # push lands.
  - name: envoy-proxy
  interval: 10m
  path: ./flux/apps/uptime-kuma
  prune: false
  retryInterval: 1m
  sourceRef:
    kind: GitRepository
    name: flux-system
