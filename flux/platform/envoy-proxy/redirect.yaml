# The only route allowed to attach to the plaintext listener, and it serves
# nothing — every request on :80 gets a 301 to the same URL over https.
#
# No `hostnames`, deliberately: an HTTPRoute with none matches every host the
# listener accepts, so this covers the three certificate domains and anything
# added later without needing to be edited. The redirect reuses the request's
# own host and path, so it does not need to know them either.
#
# Nothing here is on the ACME path. The ClusterIssuer solves DNS-01 through
# the Infomaniak webhook, so no HTTP-01 challenge is ever served on :80 and
# redirecting the whole listener cannot break certificate renewal.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: https-redirect
spec:
  parentRefs:
  - name: envoy-gateway
    namespace: envoy-gateway-system
    sectionName: http
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    filters:
    - type: RequestRedirect
      requestRedirect:
        scheme: https
        # 301 rather than 308: browsers cache it, and every route behind this
        # Gateway is a GET/POST web app where the method-preserving guarantee
        # of 308 buys nothing. Anything that must not be downgraded to GET on
        # redirect should not be speaking plaintext in the first place.
        statusCode: 301
