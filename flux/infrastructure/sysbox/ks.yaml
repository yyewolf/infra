apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: sysbox
  namespace: flux-system
spec:
  decryption:
    provider: sops
    secretRef:
      name: sops-gpg
  interval: 10m
  path: ./flux/infrastructure/sysbox
  prune: true
  retryInterval: 1m
  sourceRef:
    kind: GitRepository
    name: flux-system
