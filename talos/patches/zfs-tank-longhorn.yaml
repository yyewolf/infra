# Registers the tank's Longhorn dataset as a disk on this node. The second half
# of patches/zfs-tank.yaml, split out because the two cannot be applied at the
# same moment.
#
# ORDERING TRAP, and it is the reason this file exists separately:
#
# Longhorn reads node.longhorn.io/default-disks-config exactly ONCE, when it
# first registers the node. The upstream docs are explicit that the annotation
# "only takes effect when there are no existing disks or tags on the node", that
# Longhorn "will not keep the node disks in sync ... after the default disks
# have been created", and that a configuration failing validation is ignored
# whole rather than partially.
#
# The enclosure is unplugged during the Talos install (the installer must not be
# able to match a pool member), so on this node's first boot /var/mnt/tank does
# not exist and neither does the dataset under it. Registering then would point
# Longhorn at a path that is not there, and no amount of re-applying this file
# afterwards retries it — recovery is hand-editing the nodes.longhorn.io object
# on a node that has no shell.
#
# So this file joins the node's 'patches:' list only after:
#
#   1. the node has installed and joined with zfs-tank.yaml alone,
#   2. the enclosure is plugged back in and the node has been REBOOTED
#      (ext-zfs-service runs at boot; a pool that appears afterwards is not
#      imported until the next one), and
#   3. `talosctl -n <w-1> ls /var/mnt/tank` shows the datasets, and
#      /var/mnt/longhorn-zvol exists.
#
# See README.md, "Adding the tank node".

machine:
  # 'config' means "use the annotation" rather than defaultDataPath. Paired with
  # createDefaultDiskLabeledNodes in the Longhorn HelmRelease, a node without
  # this label gets no disks at all — which is precisely what keeps the first
  # boot above harmless.
  nodeLabels:
    node.longhorn.io/create-default-disk: config
    # Also required, and easy to miss: this is what the Longhorn chart's
    # nodeSelector matches. Without it no longhorn-manager runs here, and with
    # no manager Longhorn never creates a nodes.longhorn.io object for the node
    # — so the disk annotation above is read by nobody and `big-pool` resolves
    # to nothing. The symptom is `nodes.longhorn.io "w-1" not found`, which
    # looks like a disk problem and is not.
    yewolf.fr/longhorn: "true"

  # One disk, one tag. 'bigpool' is what the big-pool StorageClass selects on,
  # and no other node carries it — that is what makes the class resolve here and
  # nowhere else.
  #
  # storageReserved is 0 because the budget is the dataset's ZFS quota, not this
  # number. On a shared copy-on-write pool Longhorn's own accounting drifts: it
  # reads statfs, and free space moves with snapshots and compression of data
  # Longhorn knows nothing about. A quota is reported through statfs as the
  # filesystem size, so Longhorn sees a fixed disk and cannot miscount its way
  # into the media library. Resize with `zfs set quota=`, not by editing here —
  # this annotation is inert after registration.
  nodeAnnotations:
    node.longhorn.io/default-disks-config: |-
      [{"path":"/var/mnt/longhorn-zvol","allowScheduling":true,"storageReserved":0,"tags":["bigpool"]}]

  # Static pod that mounts the ext4 zvol at /var/mnt/longhorn-zvol. The zvol
  # device appears only after ext-zfs-service imports the pool, which happens
  # during boot — later than machine.disks processing — so a Talos-native
  # mount is not possible. A static pod bypasses the API server (no PSA, no
  # Kyverno) and retries via restartPolicy: OnFailure until the device exists.
  #
  # DELIBERATELY NOT UNDER /var/mnt/tank, and this is load-bearing. It lived at
  # /var/mnt/tank/longhorn until 2026-08-16, when a reboot mounted the tank
  # dataset at /var/mnt/tank *after* this pod had mounted the zvol beneath it.
  # The ext4 stayed in the mount table and became unreachable by path: every
  # reader — Longhorn included — resolved /var/mnt/tank/longhorn to the empty
  # ZFS directory instead. Longhorn concluded its disk had been replaced, wrote
  # a fresh longhorn-disk.cfg with a new diskUUID, created 16 empty replicas,
  # and faulted every volume on the pool while 2.7 TB sat intact and invisible
  # on the zvol. A sibling of /var/mnt/tank cannot be shadowed by it.
  #
  # Longhorn does not reach this path through a hostPath mount — longhorn-manager
  # only mounts /boot, /dev, /proc, /etc and /var/lib/longhorn, and inspects disk
  # paths by entering the host mount namespace via /host/proc. So what matters is
  # that the mount lands in the HOST namespace, which is what Bidirectional
  # propagation on the '/' hostPath below achieves. The kubelet's rshared bind of
  # /var/mnt/tank (zfs-tank.yaml) is for the tank's own hostPath PVs and has
  # nothing to do with this mount.
  pods:
  - apiVersion: v1
    kind: Pod
    metadata:
      name: mount-longhorn-zvol
      namespace: kube-system
    spec:
      hostPID: true
      hostNetwork: true
      restartPolicy: OnFailure
      priorityClassName: system-node-critical
      containers:
      - name: mount
        image: busybox:1.38@sha256:dc2d74b28e4cf8984fa52af1f39bc7c3d9c73760b41a74d629f5d11b1ab28616
        command: [ "sh", "-c" ]
        args:
        - |
          mkdir -p /host/var/mnt/longhorn-zvol

          # Whether the zvol is mounted is a question about what a reader
          # actually gets, so it is answered by comparing device numbers rather
          # than by grepping the mount table for the path. The old check was
          # `mount | grep -q <path>`, which matched the shadowed 2026-08-16
          # mount and printed "already mounted" while every reader saw the empty
          # directory underneath — the pod could never notice it had a problem,
          # let alone recover from it. /var/mnt/longhorn-zvol is a distinct
          # filesystem from /var/mnt only once the ext4 is really there.
          mounted() {
            [ "$(stat -c %d /host/var/mnt)" != "$(stat -c %d /host/var/mnt/longhorn-zvol)" ]
          }

          if mounted; then
            echo "already mounted"
          else
            until [ -b /host/dev/zvol/tank/longhorn ]; do
              echo "waiting for /dev/zvol/tank/longhorn..."
              sleep 5
            done
            mount -t ext4 -o noatime,discard /host/dev/zvol/tank/longhorn /host/var/mnt/longhorn-zvol

            # Confirm it is reachable and not merely in the mount table. Exiting
            # non-zero here is the recovery path: restartPolicy is OnFailure, so
            # the kubelet runs this again rather than leaving Longhorn to find a
            # bare directory and draw its own conclusions.
            if ! mounted; then
              echo "mount is in the table but the path does not resolve to it; failing for retry"
              exit 1
            fi
            echo "mounted ext4 zvol at /var/mnt/longhorn-zvol"
          fi
          echo "holding mount open — do not restart this container"
          exec sleep infinity
        securityContext:
          privileged: true
        volumeMounts:
        - name: root
          mountPath: /host
          mountPropagation: Bidirectional
      volumes:
      - name: root
        hostPath:
          path: /
