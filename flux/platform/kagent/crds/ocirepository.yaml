# GHCR-only, like cnmsql — there is no HTTP Helm repository for kagent, so this
# is an OCIRepository + chartRef rather than the HelmRepository + chart.spec
# form most of platform/ uses. Renovate's flux manager reads
# `OCIRepository.spec.ref.tag`, so it is still pinned and still bumped.
#
# Until 1.0.0-alpha13 the chart carried `substrate-crds` as a vendored
# subchart; that is now its own release in platform/substrate/crds. Until
# alpha14 it also carried `kmcp-crds` — see release.yaml for what dropping it
# deleted.
#
# Moves together with ../release.yaml's chart version and — because kagent pins
# one substrate version in its go.mod — with every substrate pin. renovate.json
# groups the kagent half and holds the substrate half back. The Harness images
# no longer move with it by hand: since alpha14 the chart supplies them (see
# ../harness.yaml).
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: kagent-crds
spec:
  interval: 1h
  url: oci://ghcr.io/kagent-dev/kagent/helm/kagent-crds
  layerSelector:
    mediaType: "application/vnd.cncf.helm.chart.content.v1.tar+gzip"
    operation: copy
  ref:
    tag: 1.0.0-alpha17
    digest: sha256:c0881dac83bc2a850e70c79d0b0f58f4ac438f8e0c7d8252ce39b5129505619e
