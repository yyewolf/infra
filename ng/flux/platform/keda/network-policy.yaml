# One policy per workload. Cilium's default-deny is per-direction and per-
# endpoint: a rule with only `egress` leaves that endpoint's ingress wide open,
# so ingress is spelled out wherever the set of callers is actually fixed.
#
# Nothing here may reach `world`. A trigger that talks to a cloud API (SQS,
# Azure Service Bus, ...) needs a toFQDNs rule added to keda-operator.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: keda-operator
spec:
  endpointSelector:
    matchLabels:
      app: keda-operator
  ingress:
  # The metrics adapter pulls metric values over gRPC.
  - fromEndpoints:
    - matchLabels:
        app: keda-operator-metrics-apiserver
    toPorts:
    - ports:
      - port: "9666"
        protocol: TCP
  egress:
  - toEntities:
    - kube-apiserver
    toPorts:
    - ports:
      - port: "6443"
        protocol: TCP
  - toEndpoints:
    - matchLabels:
        io.kubernetes.pod.namespace: kube-system
        k8s-app: kube-dns
    toPorts:
    - ports:
      - port: "53"
        protocol: UDP
      - port: "53"
        protocol: TCP
  # Trigger scalers dial whatever a ScaledObject points at — the HTTP add-on's
  # external scaler today, a Prometheus or a broker tomorrow. The target set is
  # user-defined, so it can only be bounded to the cluster.
  - toEntities:
    - cluster
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: keda-operator-metrics-apiserver
spec:
  endpointSelector:
    matchLabels:
      app: keda-operator-metrics-apiserver
  ingress:
  # Registered as an APIService, so the aggregation layer calls in.
  #
  # `kube-apiserver` is not sufficient and the resulting breakage is partial,
  # which is why it survived this long. The API server is host-networked on the
  # control planes and its connection enters the pod network via the calling
  # node's `cilium_host` router address, so the identity Cilium evaluates is
  # `host` when the API server and this pod share a node — which Cilium
  # auto-allows, hiding the bug — and `remote-node` for the other two, which a
  # `kube-apiserver`-only rule drops. `kubectl get --raw
  # /apis/external.metrics.k8s.io/v1beta1` therefore succeeds or hangs
  # depending on which API server answers, and the APIService can report
  # Available=True while two thirds of the calls are being dropped.
  - fromEntities:
    - kube-apiserver
    - remote-node
    - host
    toPorts:
    - ports:
      - port: "6443"
        protocol: TCP
  egress:
  - toEntities:
    - kube-apiserver
    toPorts:
    - ports:
      - port: "6443"
        protocol: TCP
  - toEndpoints:
    - matchLabels:
        io.kubernetes.pod.namespace: kube-system
        k8s-app: kube-dns
    toPorts:
    - ports:
      - port: "53"
        protocol: UDP
      - port: "53"
        protocol: TCP
  - toEndpoints:
    - matchLabels:
        app: keda-operator
    toPorts:
    - ports:
      - port: "9666"
        protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: keda-admission-webhooks
spec:
  endpointSelector:
    matchLabels:
      app: keda-admission-webhooks
  ingress:
  # Same correction as the metrics adapter above: the API server arrives as
  # `remote-node` (or `host` on a shared node), never `kube-apiserver`.
  #
  # This one failed *silently*, which is the worst version of it. KEDA's
  # ScaledObject webhook is registered `failurePolicy: Ignore`, so every write
  # blocked for the full 10s admission timeout and was then admitted with its
  # validation skipped entirely — a successful `kubectl apply` that took ten
  # seconds and checked nothing. If a ScaledObject write is ever mysteriously
  # slow, check Hubble for drops to :9443 before believing the object was
  # validated.
  - fromEntities:
    - kube-apiserver
    - remote-node
    - host
    toPorts:
    - ports:
      - port: "9443"
        protocol: TCP
  egress:
  - toEntities:
    - kube-apiserver
    toPorts:
    - ports:
      - port: "6443"
        protocol: TCP
  - toEndpoints:
    - matchLabels:
        io.kubernetes.pod.namespace: kube-system
        k8s-app: kube-dns
    toPorts:
    - ports:
      - port: "53"
        protocol: UDP
      - port: "53"
        protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: keda-add-ons-http-operator
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/part-of: keda-add-ons-http
      app.kubernetes.io/component: operator
  egress:
  - toEntities:
    - kube-apiserver
    toPorts:
    - ports:
      - port: "6443"
        protocol: TCP
  - toEndpoints:
    - matchLabels:
        io.kubernetes.pod.namespace: kube-system
        k8s-app: kube-dns
    toPorts:
    - ports:
      - port: "53"
        protocol: UDP
      - port: "53"
        protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: keda-add-ons-http-interceptor
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/part-of: keda-add-ons-http
      app.kubernetes.io/component: interceptor
  ingress:
  # Proxy port. Requests arrive from the Envoy proxy, because an HTTPRoute for
  # a scaled app names this Service as its backend. An in-cluster client
  # calling a scaled app directly would have to be added here.
  - fromEndpoints:
    - matchLabels:
        io.kubernetes.pod.namespace: envoy-gateway-system
        app.kubernetes.io/name: envoy
    toPorts:
    - ports:
      - port: "8080"
        protocol: TCP
  # Admin port. The external scaler polls it for the pending-request count.
  - fromEndpoints:
    - matchLabels:
        app.kubernetes.io/part-of: keda-add-ons-http
        app.kubernetes.io/component: scaler
    toPorts:
    - ports:
      - port: "9090"
        protocol: TCP
  egress:
  - toEntities:
    - kube-apiserver
    toPorts:
    - ports:
      - port: "6443"
        protocol: TCP
  - toEndpoints:
    - matchLabels:
        io.kubernetes.pod.namespace: kube-system
        k8s-app: kube-dns
    toPorts:
    - ports:
      - port: "53"
        protocol: UDP
      - port: "53"
        protocol: TCP
  # Forwards to the Service named by each HTTPScaledObject's scaleTargetRef,
  # in whatever namespace the app lives.
  - toEntities:
    - cluster
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: keda-add-ons-http-scaler
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/part-of: keda-add-ons-http
      app.kubernetes.io/component: scaler
  ingress:
  # KEDA's operator is the only gRPC client of an external scaler.
  - fromEndpoints:
    - matchLabels:
        app: keda-operator
    toPorts:
    - ports:
      - port: "9090"
        protocol: TCP
  egress:
  - toEntities:
    - kube-apiserver
    toPorts:
    - ports:
      - port: "6443"
        protocol: TCP
  - toEndpoints:
    - matchLabels:
        io.kubernetes.pod.namespace: kube-system
        k8s-app: kube-dns
    toPorts:
    - ports:
      - port: "53"
        protocol: UDP
      - port: "53"
        protocol: TCP
  - toEndpoints:
    - matchLabels:
        app.kubernetes.io/part-of: keda-add-ons-http
        app.kubernetes.io/component: interceptor
    toPorts:
    - ports:
      - port: "9090"
        protocol: TCP
