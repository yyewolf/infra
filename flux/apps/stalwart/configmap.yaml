# The entire config file, and it only names the datastore. This is not a
# stripped-down version of the old cluster's config.toml — in v0.16 the server's
# whole state (domains, accounts, listeners, TLS, directories, DKIM, queue and
# spam settings) lives as structured objects *in the database*, reached through
# the management API and the WebUI. config.json exists only to tell the binary
# how to open that database.
#
# The consequence worth internalising before touching this app: almost nothing
# about how this mail server behaves is in this git repo. Ports are database
# rows. That is why the Deployment carries NET_BIND_SERVICE it does not yet use
# and no readiness probe — see the comments there.
apiVersion: v1
kind: ConfigMap
metadata:
  name: stalwart-config
data:
  config.json: |
    {
      "@type": "RocksDb",
      "path": "/var/lib/stalwart"
    }
