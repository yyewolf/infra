apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# flux-system rather than ate-system: the CRDs are cluster-scoped, and the
# ate-system Namespace belongs to the `substrate` Kustomization, which depends
# on this one. Putting the release there would make this wait on its own
# dependant.
namespace: flux-system

resources:
  - ocirepository.yaml
  - release.yaml
