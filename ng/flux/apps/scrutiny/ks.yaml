apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: scrutiny
  namespace: flux-system
spec:
  decryption:
    provider: sops
    secretRef:
      name: sops-gpg
  dependsOn:
  - name: tailscale
  - name: longhorn
  interval: 10m
  path: ./ng/flux/apps/scrutiny
  prune: true
  retryInterval: 1m
  sourceRef:
    kind: GitRepository
    name: flux-system
