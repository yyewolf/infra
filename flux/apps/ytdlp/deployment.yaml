apiVersion: apps/v1
kind: Deployment
metadata:
  name: yt-dlp-webui
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
  selector:
    matchLabels:
      app: yt-dlp-webui
  template:
    metadata:
      labels:
        app: yt-dlp-webui
    spec:
      automountServiceAccountToken: false
      # MeTube's entrypoint only chowns and drops to PUID when started as root;
      # started as 1000 it skips that and runs directly, so ALL can stay dropped.
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: metube
        image: ghcr.io/alexta69/metube:2026.10.27@sha256:845a67373a9f9e62b88e5f9067867202200d63db3615a051acbd77b09e86b9ce
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          seccompProfile:
            type: RuntimeDefault
        ports:
        - containerPort: 8081
        readinessProbe:
          httpGet:
            path: /
            port: 8081
        volumeMounts:
        - name: downloads
          mountPath: /downloads
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 2000m
            memory: 2Gi
      # Downloads are deliberately throwaway: grab the file, and the next restart
      # clears it. The cap matters because this lives on the node's EPHEMERAL
      # partition, and filling that takes the kubelet with it; past it the pod is
      # evicted and comes back empty.
      volumes:
      - name: downloads
        emptyDir:
          sizeLimit: 20Gi
