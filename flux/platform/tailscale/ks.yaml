apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: tailscale
  namespace: flux-system
spec:
  # oauth-sops.yaml is reconciled from git, so Flux needs the PGP key to
  # decrypt it. Without this block the encrypted Secret is applied verbatim
  # and the operator crash-loops on an unusable client_id.
  decryption:
    provider: sops
    secretRef:
      name: sops-gpg
  dependsOn:
  - name: cilium
  interval: 10m
  path: ./flux/platform/tailscale
  prune: true
  retryInterval: 1m
  sourceRef:
    kind: GitRepository
    name: flux-system
