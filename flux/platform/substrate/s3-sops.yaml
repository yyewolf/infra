# The credential substrate uses to read and write actor snapshots in the
# existing rustfs (apps/rustfs), bucket `ate-snapshots`.
#
# Consumed twice, in two different ways, and both have to keep working:
#   - `atelet.extraEnv` in release.yaml, a values-level secretKeyRef
#   - the postRenderer patch in the same file, for ate-api-server, which has no
#     extraEnv hook
# and once more by bucket-init.yaml, the Job that creates the bucket.
#
# This is the rustfs ROOT credential's scope unless it was minted as a service
# account. If it is root, note what that means: rustfs also holds the
# `artifacts.yewolf.fr` bucket, and this policy-free key reaches it too. The
# ingress rule added to apps/rustfs/network-policy.yaml admits the whole
# ate-system namespace to port 9000 and cannot tell one bucket from another, so
# the credential is the only thing bounding this. To narrow it later:
#
#   kubectl -n rustfs port-forward svc/rustfs 9000:9000
#   mc alias set ng-rustfs http://127.0.0.1:9000 <root_user> <root_password>
#   mc admin user svcacct add ng-rustfs <root_user> --policy /dev/stdin <<'POLICY'
#   { "Version": "2012-10-17", "Statement": [
#     { "Effect": "Allow",
#       "Action": ["s3:GetObject","s3:PutObject","s3:DeleteObject","s3:ListBucket","s3:GetBucketLocation"],
#       "Resource": ["arn:aws:s3:::ate-snapshots","arn:aws:s3:::ate-snapshots/*"] } ] }
#   POLICY
#
# Snapshots are agent process memory, so this is worth doing even though it
# works as it stands.
