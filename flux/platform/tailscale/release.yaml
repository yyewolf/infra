apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tailscale-operator
spec:
  interval: 30m
  chart:
    spec:
      chart: tailscale-operator
      version: "1.98.9"
      sourceRef:
        kind: HelmRepository
        name: tailscale
      interval: 12h
  values:
    # The chart renders the tailscale.com CRDs as ordinary templates (not from
    # crds/), so Helm owns them and upgrades apply cleanly. Nothing to set on
    # install.crds here.
    installCRDs: true

    operatorConfig:
      # This tailnet already has an operator — the root cluster's, which takes
      # the default `tailscale-operator` hostname. Two nodes asking for the same
      # name get a silent `-1` suffix, so name this one after the cluster.
      hostname: ng-tailscale-operator
      logging: info
      defaultTags:
        - tag:k8s-operator
      resources:
        requests:
          cpu: 20m
          memory: 64Mi
        limits:
          memory: 256Mi

      # The chart ships this empty. The operator is a plain controller — it
      # talks to the API server and to the tailnet as a userspace node, with no
      # tun device and no netfilter rules of its own — so none of the
      # privileges a *proxy* needs apply to it. That distinction is the whole
      # point: see proxyConfig below for the pods that genuinely are
      # privileged.
      #
      # The image has no USER, so it defaults to root and the uid has to be
      # named here. 65532 is arbitrary — nothing in the pod is owned by a
      # specific uid; the only writable path is the emptyDir below, and
      # Kubernetes creates that world-writable.
      #
      # readOnlyRootFilesystem is deliberately left off: with the state dir
      # relocated the operator should not touch the rootfs, but "should not" is
      # an assumption about a library, and this pod is how the tailnet reaches
      # the cluster.
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault

      # The operator joins the tailnet through tsnet, which insists on a
      # writable directory even though the *node state* lives in the `operator`
      # Secret (it still puts its log config and log buffer on disk). With no
      # Dir set, tsnet falls back to os.UserConfigDir() — $XDG_CONFIG_HOME, or
      # $HOME/.config — and creates a `tsnet-operator` directory there. As root
      # that lands in /root/.config and nobody notices; as uid 65532 the
      # fallback is /.config, which is not writable, and the operator exits at
      # startup.
      #
      # So the state dir is pointed at a mount instead. The volume itself has
      # to come from the post-renderer below — the chart templates no
      # extraVolumes — and this env var is the half of the pair the chart can
      # express. They only work together.
      extraEnv:
        - name: XDG_CONFIG_HOME
          value: /tsnet

    proxyConfig:
      # Proxies the operator spins up for egress/ingress Services. Same tag the
      # root cluster's proxies use, so one ACL grant covers both clusters.
      defaultTags: tag:k8s

      # NOT hardened, and cannot be from here. The operator creates the
      # tailscale container and its init container `privileged: true` for every
      # ingress/egress proxy — they create /dev/net/tun and program netfilter,
      # which is what makes the proxy a proxy. `ts-radar` (the StatefulSet
      # behind apps/radar's tailscale Ingress) is one of these, so it will
      # always show up in a privilege-escalation scan. The kubelet forces
      # allowPrivilegeEscalation true on a privileged container anyway, so
      # setting it false via a ProxyClass would break the pod without even
      # clearing the finding.
      #
      # Getting down to cap NET_ADMIN means installing a tun device plugin so
      # the device is handed to the proxy instead of created by it
      # (tailscale/tailscale#10814), then a ProxyClass with
      # statefulSet.pod.tailscaleContainer.securityContext, wired in here as
      # defaultProxyClass. Not worth the machinery for one proxy that only
      # fronts radar and is fenced by apps/radar/network-policy.yaml.

    # No Kubernetes API server proxy. Cluster admin comes over WireGuard from
    # the LAN, and exposing the apiserver on the tailnet would be a second,
    # separately-authorized path into it.
    apiServerProxyConfig:
      mode: "false"
      allowImpersonation: "false"

  # oauth.clientId is deliberately left empty: setting it would make the chart
  # template the credentials into a Secret, which means they would have to live
  # in these plaintext values. The operator falls back to mounting a
  # precreated `operator-oauth` Secret, which is what oauth-sops.yaml is.

  # The writable state dir that operatorConfig.extraEnv points XDG_CONFIG_HOME
  # at. The chart has no extraVolumes, so it is patched in. Both lists merge by
  # name, so the chart's own `oauth` volume and mount are left alone.
  #
  # emptyDir, not a PVC: everything durable about this node — its key and its
  # tailnet identity — is in the `operator` Secret via tsnet's kube store. What
  # lands here is a log buffer the operator is free to lose on restart.
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: Deployment
              name: operator
            patch: |
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: operator
              spec:
                template:
                  spec:
                    volumes:
                      - name: tsnet-state
                        emptyDir: {}
                    containers:
                      - name: operator
                        volumeMounts:
                          - name: tsnet-state
                            mountPath: /tsnet
