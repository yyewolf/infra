apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: immich
  namespace: album
spec:
  interval: 5m
  chart:
    spec:
      chart: immich
      version: 0.13.4
      sourceRef:
        kind: HelmRepository
        name: immich-charts
        namespace: album
  values:
    controllers:
      main:
        # Shared by server and machine-learning; both mount an RWO Longhorn
        # claim, and the chart hardcodes RollingUpdate, which wedges forever on
        # Multi-Attach whenever the new pod lands on a different node.
        strategy: Recreate
        containers:
          main:
            image:
              # One tag for both images: the chart leaves the repository to
              # each subchart, so server and machine-learning always match.
              # renovate: datasource=docker depName=ghcr.io/immich-app/immich-server
              tag: v3.3.3
            env:
              REDIS_HOSTNAME: redis.album.svc
              REDIS_PORT: "6379"
              DB_HOSTNAME: postgres-rw.postgres.svc.cluster.local
              DB_USERNAME: immich
              DB_DATABASE_NAME: immich
    immich:
      persistence:
        library:
          existingClaim: immich-library
    machine-learning:
      persistence:
        cache:
          enabled: true
          type: persistentVolumeClaim
          size: 10Gi
          accessMode: ReadWriteOnce
          storageClass: longhorn-yolo
  valuesFrom:
  - kind: Secret
    name: immich-db
    valuesKey: DATABASE_PASSWORD
    targetPath: controllers.main.containers.main.env.DB_PASSWORD
