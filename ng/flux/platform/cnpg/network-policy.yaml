# Cilium's default-deny is per-direction and per-endpoint: a rule with only
# `egress` leaves ingress wide open, so ingress is spelled out here — the
# apiserver calling the webhook is the only inbound traffic the operator takes.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: cloudnative-pg
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: cloudnative-pg
  ingress:
  # Mutating + validating webhooks for Cluster/Backup/ScheduledBackup.
  - fromEntities:
    - kube-apiserver
    toPorts:
    - ports:
      - port: "9443"
        protocol: TCP
  egress:
  - toEntities:
    - kube-apiserver
    toPorts:
    - ports:
      - port: "6443"
        protocol: TCP
  - toEndpoints:
    - matchLabels:
        io.kubernetes.pod.namespace: kube-system
        k8s-app: kube-dns
    toPorts:
    - ports:
      - port: "53"
        protocol: UDP
      - port: "53"
        protocol: TCP
  # The operator drives the instances it created: the instance manager's REST
  # API (8000) and Postgres itself (5432). Those pods live in whatever
  # namespace declared the Cluster, so this can only be bounded to the cluster.
  # Backups and WAL archiving are the *instance* pods' egress, not the
  # operator's — nothing here needs to reach `world`.
  - toEntities:
    - cluster
