# CloudBeaver's MySQL login. Unlike the Postgres side, which pushes the
# operator-generated `postgres-superuser`, this one has to be declared: CNMSQL
# creates the root account as `root@localhost` only, so it is reachable over the
# socket inside the instance pod and by nothing else on the network. There is no
# remote root to hand out — see databaseuser.yaml.
