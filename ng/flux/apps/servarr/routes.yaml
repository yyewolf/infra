# flaresolverr is exposed publicly *and* behind the SSO wall, which makes the
# public hostname useless for the *arr apps calling it — they must use
# http://flaresolverr, the ClusterIP. See flaresolverr.yaml.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: flaresolverr
spec:
  parentRefs:
  - name: envoy-gateway
