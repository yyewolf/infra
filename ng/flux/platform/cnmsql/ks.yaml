apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cnmsql
  namespace: flux-system
spec:
  # The chart ships a self-signed Issuer plus Certificates for its webhook and
  # metrics endpoints, and relies on cainjector to fill in the webhook's
  # caBundle — so cert-manager has to be up first.
  dependsOn:
  - name: cert-manager
  interval: 10m
  path: ./ng/flux/platform/cnmsql
  prune: false
  retryInterval: 1m
  sourceRef:
    kind: GitRepository
    name: flux-system
