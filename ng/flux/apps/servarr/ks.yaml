# CUTOVER NOTE — jellyfin is already running on this cluster from hand-applied
# manifests, outside git. Most of that is adopted in place: the PVCs, the Service
# and the HTTPRoute are declared here with identical specs, so server-side apply
# takes ownership and provisions and restarts nothing.
#
# Two objects are not, and neither is pruned — prune only removes what this
# Kustomization previously applied, so a hand-made object it never owned lives
# forever:
#
#   deployment/jellyfin — this directory declares a StatefulSet instead, so the
#     two would coexist. Both are labelled `app: jellyfin`, both are selected by
#     the Service, and both mount the same RWO config claim. They are on the same
#     node, so Kubernetes permits exactly that, and two Jellyfins open one sqlite
#     database. This one is not cosmetic.
#   ciliumnetworkpolicy/jellyfin — superseded by the namespace-wide `servarr`
#     policy in network-policy.yaml. Cilium unions policies, so leaving it is
#     harmless but it is unowned cruft that grants a subset of what replaced it.
#
# Before this Kustomization first reconciles:
#
#     kubectl -n servarr delete deployment/jellyfin ciliumnetworkpolicy/jellyfin
#
# The StatefulSet then attaches the same claims on the same node. One restart, no
# data movement.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: servarr
  namespace: flux-system
spec:
  decryption:
    provider: sops
    secretRef:
      name: sops-gpg
  dependsOn:
  - name: servarr-migrate
  - name: envoy-proxy
  interval: 10m
  path: ./ng/flux/apps/servarr
  prune: true
  retryInterval: 1m
  sourceRef:
    kind: GitRepository
    name: flux-system
