apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: postgres
  namespace: flux-system
spec:
  dependsOn:
    # The operator has to exist before the Cluster CR resolves, and the
    # StorageClass before the first PVC binds. Neither is a soft ordering
    # preference: without cnpg the Cluster is an unknown kind, and without
    # longhorn the PVC sits Pending forever.
    - name: cnpg
    - name: longhorn
  interval: 10m
  path: ./ng/flux/platform/postgres
  prune: true
  retryInterval: 1m
  sourceRef:
    kind: GitRepository
    name: flux-system
