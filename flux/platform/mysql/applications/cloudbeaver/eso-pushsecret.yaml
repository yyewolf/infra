# Like platform/postgres/applications/cloudbeaver, this directory declares no
# `Database` — CloudBeaver exists to reach the databases the other directories
# create, not to own one.
#
# It does declare a `DatabaseUser`, and that is where the two sides diverge. The
# Postgres directory pushes `postgres-superuser` straight through because CNPG's
# superuser accepts network connections once it is enabled. CNMSQL's root does
# not exist off the socket, so there is nothing equivalent to push and the
# account has to be created — see databaseuser.yaml. The password below is
# therefore ours rather than the operator's, which is why this directory has a
# SOPS file and the Postgres one does not.
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: cloudbeaver-mysql
  namespace: mysql
spec:
  refreshInterval: 1h
  # The copy at the far end outlives this object on purpose — deleting it on a
  # reconcile blip would take a running CloudBeaver's connection with it.
  deletionPolicy: None
  secretStoreRefs:
  - name: cloudbeaver
    kind: SecretStore
  selector:
    secret:
      name: cloudbeaver-db-credentials
  data:
  - match:
      secretKey: username
      remoteRef:
        remoteKey: cloudbeaver-mysql
        property: username
  - match:
      secretKey: password
      remoteRef:
        remoteKey: cloudbeaver-mysql
        property: password
