apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: authentik
  namespace: authentik
spec:
  interval: 5m
  chart:
    spec:
      chart: authentik
      version: 2026.5.5
      sourceRef:
        kind: HelmRepository
        name: authentik
        namespace: authentik
  values:
    authentik:
      error_reporting:
        enabled: false
      postgresql:
        name: "authentik"
      email:
        use_tls: true
    worker:
      replicas: 2
    server:
      replicas: 2
      route:
        main:
          enabled: true
          hostnames:
          - "auth.yewolf.fr"
          parentRefs:
          - name: envoy-gateway
            namespace: envoy-gateway-system
            sectionName: https
  valuesFrom:
  # DB credentials pushed by platform/postgres/applications/authentik/eso-pushsecret.yaml.
  - kind: Secret
    name: authentik-db
    valuesKey: DATABASE_HOST
    targetPath: authentik.postgresql.host
  - kind: Secret
    name: authentik-db
    valuesKey: DATABASE_USER
    targetPath: authentik.postgresql.user
  - kind: Secret
    name: authentik-db
    valuesKey: DATABASE_PASSWORD
    targetPath: authentik.postgresql.password
  # Carried over from the root cluster: secretKey, email settings.
  - kind: Secret
    name: authentik-secret
    valuesKey: secretKey
    targetPath: authentik.secret_key
  - kind: Secret
    name: authentik-secret
    valuesKey: emailHost
    targetPath: authentik.email.host
  - kind: Secret
    name: authentik-secret
    valuesKey: emailFrom
    targetPath: authentik.email.from
  - kind: Secret
    name: authentik-secret
    valuesKey: emailFrom
    targetPath: authentik.email.username
  - kind: Secret
    name: authentik-secret
    valuesKey: emailPassword
    targetPath: authentik.email.password
