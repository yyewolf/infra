apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: harbor
spec:
  interval: 5m
  chart:
    spec:
      chart: harbor
      version: 1.19.0
      sourceRef:
        kind: HelmRepository
        name: harbor
  values:
    expose:
      type: clusterIP
      clusterIP:
        name: harbor
      tls:
        enabled: false
    externalURL: https://registry.yewolf.fr
    persistence:
      enabled: true
      persistentVolumeClaim:
        registry:
          existingClaim: registry-storage
          subPath: registry
        chartmuseum:
          existingClaim: registry-storage
          subPath: chartmuseum
        jobservice:
          existingClaim: registry-storage
          subPath: jobservice
        trivy:
          existingClaim: registry-storage
          subPath: trivy
        database:
          existingClaim: registry-database
        redis:
          existingClaim: registry-redis
    containerSecurityContext:
      privileged: false
      allowPrivilegeEscalation: false
      seccompProfile:
        type: RuntimeDefault
      runAsNonRoot: true
      capabilities:
        drop:
        - ALL
