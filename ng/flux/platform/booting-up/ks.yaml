apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: booting-up
  namespace: flux-system
spec:
  dependsOn:
    - name: cilium
  interval: 10m
  path: ./ng/flux/platform/booting-up
  prune: true
  retryInterval: 1m
  sourceRef:
    kind: GitRepository
    name: flux-system
