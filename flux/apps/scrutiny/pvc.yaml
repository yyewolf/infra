apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: scrutiny
spec:
  accessModes:
  - ReadWriteOnce
  storageClassName: big-pool
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: scrutiny-influxdb
spec:
  accessModes:
  - ReadWriteOnce
  storageClassName: big-pool
  resources:
    requests:
      storage: 20Gi
