# Generated, alphanumeric on purpose.
#
# Both passwords are consumed twice: once by CNPG, which reads username and
# password off this Secret to create the role, and once by the PushSecret
# templates in eso-pushsecret.yaml, which interpolate them into a DSN. The
# second is why the character set matters — a DSN is a URL, and while both
# templates pipe through `urlquery` so a punctuation-bearing password would
# survive today, keeping them alphanumeric means the DSN stays legible in a log
# and a hand-typed `psql` reproduction of it cannot go wrong.
#
# Rotation is: change the value here, `sops -e -i` it, and let CNPG's
# DatabaseRole reconcile the ALTER ROLE. The PushSecret re-renders both DSNs on
# its next refresh (1h) or immediately on reconcile, and the consumers pick the
# new one up when their pods restart — the controller reads its DSN from a
# mounted file at startup, not per connection, so neither restarts itself.
