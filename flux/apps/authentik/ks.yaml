apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: authentik
  namespace: flux-system
spec:
  decryption:
    provider: sops
    secretRef:
      name: sops-gpg
  dependsOn:
  - name: envoy-proxy
  # cloudbeaver-ingress.yaml. The tailscale operator owns the `tailscale`
  # IngressClass; without it that Ingress is admitted and simply never gets an
  # address, which is a silent failure rather than a reconcile error.
  - name: tailscale
  interval: 10m
  path: ./flux/apps/authentik
  prune: true
  retryInterval: 1m
  sourceRef:
    kind: GitRepository
    name: flux-system
