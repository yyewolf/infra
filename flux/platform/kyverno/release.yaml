# Kyverno, the operator only. The policies live in `policies/` under their own
# Flux Kustomization, because that directory is where this install stops being
# inert: Kyverno registers its resource webhooks dynamically from the policies
# that exist, so with none there is nothing intercepting pod creation and
# nothing that can wedge the API server if these pods go away. Reverting that
# one directory returns the cluster to that state without uninstalling anything.
#
# The root cluster's two policies were not portable and were not carried over:
# both pin workloads to `sysbox-runc`, which does not exist here. `policies/`
# rewrites their intent against kata instead (see infrastructure/kata).
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kyverno
spec:
  interval: 30m
  chart:
    spec:
      chart: kyverno
      # renovate: datasource=helm registryUrl=https://kyverno.github.io/kyverno/
      version: "3.9.0"
      sourceRef:
        kind: HelmRepository
        name: kyverno
      interval: 12h
  # Deliberately close to stock. The chart already ships what this repo would
  # otherwise spell out by hand: a memory limit and CPU request per controller
  # with no CPU limit, CRDs installed with the release, and each of the four
  # controllers at one replica.
  values:
    crds:
      install: true
