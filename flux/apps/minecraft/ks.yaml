apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: minecraft
  namespace: flux-system
spec:
  dependsOn:
  # The longhorn-yolo StorageClass the world claim names.
  - name: longhorn
  interval: 10m
  path: ./flux/apps/minecraft
  prune: true
  retryInterval: 1m
  sourceRef:
    kind: GitRepository
    name: flux-system
  # Deliberately no `wait: true`: every StorageClass here is
  # WaitForFirstConsumer, so a fresh claim reports Pending until this same
  # Kustomization's StatefulSet mounts it — waiting would deadlock against
  # ourselves (see apps/servarr/storage).
