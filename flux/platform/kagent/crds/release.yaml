apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kagent-crds
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: kagent-crds
  # The chart is nothing but CustomResourceDefinitions in templates/ — they are
  # ordinary templated resources here, not files under a chart's crds/
  # directory, so `install.crds` does not apply and kustomize-controller's
  # normal apply handles them.
  install:
    strategy:
      name: RetryOnFailure
    crds: CreateReplace
  upgrade:
    strategy:
      name: RetryOnFailure
    crds: CreateReplace
  # -------------------------------------------------------------------------
  # The 1.0.0-alpha1 -> alpha5 upgrade moved every kagent CRD except kmcp's
  # MCPServer from `kagent.dev` to `api.kagent.dev`, as new CRDs rather than a
  # served version. This chart simply stops rendering the old five, so Helm
  # deletes them — and that breaks the OTHER release: the `kagent` release's
  # stored manifest still lists a `kagent.dev` ModelConfig and RemoteMCPServer,
  # and Helm (v4.2, pkg/action/upgrade.go) refuses any upgrade whose *current*
  # manifest names a kind the API server no longer serves — "unable to build
  # kubernetes objects from current release manifest". No remediation fixes
  # that, and neither does deleting the HelmRelease: rollback and uninstall
  # parse the same manifest, so the way out after the fact is deleting Helm's
  # release Secret by hand.
  #
  # The cheap way in is to annotate the five old CRDs BEFORE pushing
  #
  #   kubectl annotate crd agenttemplates.kagent.dev harnesses.kagent.dev \
  #     modelconfigs.kagent.dev modelproviderconfigs.kagent.dev \
  #     remotemcpservers.kagent.dev helm.sh/resource-policy=keep
  #
  # which Helm reads off the LIVE object when deciding what to delete. Once
  # both releases are on alpha5 and the `kagent` Kustomization has pruned its
  # old-group Harness/AgentTemplate/ModelConfig, the five are orphans and are
  # deleted by hand. The same trap applies to any future chart that drops a
  # CRD another release still has objects of.
  # -------------------------------------------------------------------------
  #
  # No `values:` any more. The two knobs this chart had are both gone:
  #
  #   - `substrate.enabled` added the ate.dev CRDs (WorkerPool, SandboxConfig,
  #     CSIDriverConfig) as a `substrate-crds` subchart. 1.0.0-alpha13 dropped
  #     that subchart; those CRDs are now the `substrate-crds` release in
  #     platform/substrate/crds. The upgrade that removed it is exactly the trap
  #     described above, one group over: this chart stopped rendering three CRDs
  #     that every WorkerPool and SandboxConfig on the cluster depends on, so
  #     they were annotated `helm.sh/resource-policy: keep` and handed to the
  #     new release before it went out.
  #
  #   - `kmcp.enabled` added kmcp's MCPServer CRD (group `kagent.dev`).
  #     alpha14 removed kmcp outright (kagent#3223), so this chart stops
  #     rendering it and Helm deletes it — and every MCPServer with it. That was
  #     checked before the upgrade rather than annotated around: there were
  #     none. Both tool servers here are RemoteMCPServers in `api.kagent.dev`,
  #     which this chart still owns, and the `kagent` release's stored manifest
  #     named no MCPServer, so the trap above does not apply either.
