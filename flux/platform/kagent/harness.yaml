# An agent is a Harness x AgentTemplate PAIR, and since 1.0.0-alpha5 the pair is
# an object of its own: the `Agent` at the bottom of this file names one of
# each. Neither half does anything alone — a Harness and an AgentTemplate that
# no Agent references are created successfully, report no error, and are never
# listed. The old label-selector pairing (`Harness.allowedAgentTemplates`) is
# gone from the CRD. Readiness now lives on the Agent (`kubectl -n kagent get
# agents.api.kagent.dev`); AgentTemplate carries no status at all.
#
# The group is `api.kagent.dev`, not `kagent.dev`. The move happened in alpha5
# as brand-new CRDs, not a conversion, so nothing carries over from the old
# group — the objects below are simply created afresh (see crds/release.yaml
# for why the old CRDs had to be kept alive through the upgrade). The
# qualified name matters when typing kubectl too: kmcp's MCPServer stayed on
# `kagent.dev`.
apiVersion: api.kagent.dev/v1alpha3
kind: Harness
metadata:
  name: kagent
  namespace: kagent
spec:
  # The managed kagent runtime adapter. Exactly one of kagent/codex/claude/byo
  # may be set — the CRD has a CEL rule that says so. harness-claude.yaml beside
  # this file is the claude variant, and is not currently applied.
  kagent: {}
  workload:
    # Digest-pinned because the CRD *requires* it:
    #   pattern: ^[^[:space:]@]+@sha256:[a-f0-9]{64}$
    # A tag is rejected at admission. This is the Go ADK image, which is also
    # what the chart names in `controller.agentImage` for declarative agents.
    #
    # It has to be the Go build rather than the Python one, and the reason is
    # specific to being an actor: an actor starts by restoring its template's
    # golden memory snapshot, and the Python runtime dies on restore with SIGILL
    # where a static Go binary comes back. Upstream's setup script carries the
    # same note.
    #
    # Renovate cannot see this (no `image:` key, no `tag:` value), so it moves
    # by hand alongside `chart.spec.version` in release.yaml. The two must stay
    # on the same version.
    image: ghcr.io/kagent-dev/kagent/golang-adk@sha256:ed668c38a5805723912497d4ea085e711cf585d440907abfff3dd27991d768cc
  substrate:
    # Must match `substrateWorkerPool.name` in release.yaml. Two independent
    # strings, no cross-validation.
    workerPoolRef:
      name: kagent-default
    # The bucket half must match the Job in platform/substrate/bucket-init.yaml.
    # Upstream's examples say `gs://ate-snapshots/kagent/` because upstream CI
    # runs on GCS; this cluster's snapshot store is the rustfs in apps/rustfs,
    # reached over the S3 API, so the scheme is `s3://`. The upstream *setup
    # script* uses the s3 form too.
    snapshotPolicy:
      location: s3://ate-snapshots/kagent
---
# One template, so the UI has an agent in it on first boot rather than an empty
# list that looks like a broken install.
#
# `modelConfig.name` is the ModelConfig the chart GENERATES from
# `providers.default` in release.yaml — i.e. the Infomaniak endpoint. There is
# no ModelConfig manifest in this repo for that reason; the name below is the
# chart's `kagent.defaultModelConfigName` helper, and `default-model-config` is
# what it renders to for a release called `kagent` (checked by rendering the
# chart, not assumed — the helper does not simply prefix the release name).
#
# It is also the value the chart puts in the controller's
# DEFAULT_MODEL_CONFIG_NAME, so a template that omits `modelConfig` entirely
# would resolve to the same object.
apiVersion: api.kagent.dev/v1alpha3
kind: AgentTemplate
metadata:
  name: assistant
  namespace: kagent
spec:
  description: General-purpose cluster assistant, read-only.
  modelConfig:
    name: default-model-config
  systemPrompt: |
    You are an assistant with read-only access to a small Kubernetes cluster
    managed entirely by Flux from a git repository.

    Two things follow from that and you should say so rather than work around
    them. You cannot change cluster state: your Kubernetes tools are bound to a
    read-only ClusterRole, and Secrets are outside even that. And a change that
    *is* wanted belongs in the git repository, not applied to the cluster — so
    describe the manifest edit rather than proposing a kubectl command.

    Be concrete. Name the namespace and the object you looked at.
  tools:
    # The built-in tool server from the kagent-tools subchart. It is registered
    # as an MCPServer by the chart's own toolserver template, so the name here
    # is the chart's, not something declared in this repo.
    - mcp:
        server:
          kind: RemoteMCPServer
          name: kagent-tool-server
---
apiVersion: api.kagent.dev/v1alpha3
kind: Agent
metadata:
  name: assistant
  namespace: kagent
spec:
  templateRef:
    name: assistant
  harnessRef:
    name: kagent
