# Non-secret facts about the cluster. This file is the single source of truth
# for addressing: talos.sh derives each node's network patch from it, so node
# addresses are never written down twice.

name: ng

# Talos and Kubernetes versions. talos_version also selects the Image Factory
# build used for the installer and the ISO, so bumping it here is the whole
# upgrade knob.
talos_version: v1.13.7
kubernetes_version: 1.36.3

# Where './talos.sh installer' pushes the images it builds for nodes carrying
# extensions the Image Factory does not have. Tagged <talos_version>-<node>
# there, but nodes are pointed at the pushed digest, not the tag: the tag moves
# on every rebuild and a node re-installing months later should get the image
# that was tested.
#
# Must be readable without credentials, or by a pull secret in the node's
# machine config — the node pulls this itself at install time, long before
# Kubernetes exists.
installer_repository: ghcr.io/yyewolf/talos-installer

network:
  # Matches lan_subnet / lan_gateway in router.
  subnet: 10.200.0.0/24
  gateway: 10.200.0.1

  # Shared control-plane address. The elected leader among the control-plane
  # nodes holds it, so the Kubernetes and Talos endpoints survive losing any
  # single node. Deliberately below the router's DHCP pool (.100-.254).
  #
  # IPv4 only: Talos binds one VIP per interface, and the control-plane endpoint
  # gains nothing from being dual-stack.
  vip: 10.200.0.10

  # IPv6 is a ULA prefix (RFC 4193, randomly generated) rather than the
  # ISP-delegated one, deliberately. Delegated prefixes rotate, and a rotation
  # would silently invalidate every address pinned in this file plus the cert
  # SANs baked into the cluster PKI. Global reachability, where we want it,
  # comes from the router mapping the delegated prefix in front of these.
  subnet6: fdde:c64:7096::/64

  # No IPv6 default route yet: the router does not route v6, and pointing at a
  # gateway that does not answer only buys connection timeouts. Set gateway6
  # here once router has IPv6 working and render will start emitting it.
  gateway6: ""

  # WireGuard overlay. Nodes that are not on the LAN — the cloud edge worker —
  # take their cluster address from here instead of network.subnet, and reach
  # everything else through the tunnel the router terminates.
  #
  # Must match the addresses in wireguard/identities-sops.yaml: the router
  # derives its peer allowed-address and static routes from that registry, so an
  # address written only here would be one the router never routes. talos.sh
  # cross-checks the two and refuses to render on a mismatch.
  wg_subnet: 10.200.255.0/24

  # MTU of the WireGuard interface on off-LAN nodes. This is the number Cilium's
  # MTU value in flux/infrastructure/cilium/helmrelease.yaml is set to — it is the narrowest
  # underlay in the cluster, and pod traffic to this node is built for it. The
  # two have to move together or cross-node traffic to the edge silently drops.
  wg_mtu: 1420

# Cluster CIDRs are fixed at bootstrap — Kubernetes has no supported way to add
# an address family to a running cluster — so both are listed from the start.
pod_subnets:
- 10.244.0.0/16
- fdde:c64:7096:4400::/56

service_subnets:
- 10.96.0.0/12
# IPv6 service CIDRs must be /108 or smaller; Kubernetes rejects anything
# larger.
- fdde:c64:7096:9600::/112

# Per node: type, address and address6 are required. 'interface' is optional and
# only needed on a host with more than one physical NIC — without it the config
# matches "the physical interface", which on a two-NIC box would configure the
# same addresses on both. Find the name with 'talosctl get links'.
#
#   cp-0:
#     type: controlplane
#     address: 10.200.0.11
#     address6: fdde:c64:7096::11
#     interface: enp1s0
#
# 'extensions' is also optional: system extensions layered on top of
# schematic.yaml for this node alone. talos.sh resolves the merged list to its
# own Image Factory ID and points only that node's installer at it, so a
# hardware- or role-specific extension does not force every other node to be
# re-imaged. Extensions every node wants belong in schematic.yaml.
#
# Hardware details (the install disk) live in nodes/<name>.yaml instead.
nodes:
  # The three LAN hosts are bare metal with hardware virtualization, so they
  # carry kata-containers: workloads that ask for the 'kata' RuntimeClass run
  # inside a lightweight VM instead of sharing the host kernel. The extension
  # registers the containerd runtime handlers by itself; the RuntimeClass
  # objects come from flux/infrastructure/kata.
  #
  # They also carry gVisor, which needs no virtualization but, unlike kata, does
  # need machine config to go with the extension — a sysctl and the CRI handler
  # definition. That is what 'patches' is for: files under patches/ applied to
  # the listed node alone. All three must carry the same pair, or a pod that
  # asks for the 'gvisor' RuntimeClass fails at whichever node it lands on.
  #
  # Deliberately not on edge-0: it is a cloud instance with no nested
  # virtualization, and adding an extension there rewrites its machine config,
  # which is its OpenStack user_data — Terraform would destroy and recreate the
  # node to deliver it.
  # All three also carry sysbox, a third sandbox that is not on the Image
  # Factory. 'custom_extensions' is how a node asks for one: the factory rejects
  # an OCI reference, so './talos.sh installer <node>' builds that node's
  # installer with siderolabs/imager instead and render points the node at it.
  # Order matters — 'installer' before 'render', or render refuses with a stale
  # image rather than guessing.
  cp-0:
    type: controlplane
    address: 10.200.0.11
    address6: fdde:c64:7096::11
    extensions:
    - siderolabs/kata-containers
    - siderolabs/gvisor
    custom_extensions:
    - ghcr.io/yyewolf/talos-sysbox-extension@sha256:e92ae18c8efdd4eff53369a6aa34949809b598d803ae3485a0e8c2f6563aa78e
    patches:
    - gvisor.yaml
    - kata.yaml
    - longhorn.yaml
    # After gvisor.yaml, which raises user.max_user_namespaces — sysbox needs it.
    - sysbox.yaml
  cp-1:
    type: controlplane
    address: 10.200.0.12
    address6: fdde:c64:7096::12
    extensions:
    - siderolabs/kata-containers
    - siderolabs/gvisor
    custom_extensions:
    - ghcr.io/yyewolf/talos-sysbox-extension@sha256:e92ae18c8efdd4eff53369a6aa34949809b598d803ae3485a0e8c2f6563aa78e
    patches:
    - gvisor.yaml
    - kata.yaml
    - longhorn.yaml
    - sysbox.yaml
  cp-2:
    type: controlplane
    address: 10.200.0.13
    address6: fdde:c64:7096::13
    extensions:
    - siderolabs/kata-containers
    - siderolabs/gvisor
    custom_extensions:
    - ghcr.io/yyewolf/talos-sysbox-extension@sha256:e92ae18c8efdd4eff53369a6aa34949809b598d803ae3485a0e8c2f6563aa78e
    patches:
    - gvisor.yaml
    - kata.yaml
    - longhorn.yaml
    - sysbox.yaml

  # Cloud worker on Infomaniak OpenStack (see openstack). It is not on the
  # LAN: its physical NIC takes a DHCP lease from the cloud and exists only to
  # carry a WireGuard tunnel, and the address below lives on wg0.
  #
  # 'wireguard.peer' names the identity in wireguard/identities-sops.yaml
  # this node dials or is dialled by. The tunnel is part of the machine config,
  # so it is up before the kubelet starts — the node never talks to the cluster
  # over the bare internet, not even once during join.
  #
  # 'dhcp6' asks the cloud NIC for a public IPv6 as well. Infomaniak's ext-net1
  # is dhcpv6-stateful, so this has to be requested — SLAAC alone gets nothing
  # routable. That address is for ingress only. It is deliberately NOT this
  # node's Kubernetes address: kubelet.nodeIP.validSubnets pins that to the
  # WireGuard overlay, because a node registered under its public v6 would have
  # the other three nodes reaching it over the open internet instead of the
  # tunnel — exactly what this design exists to avoid.
  #
  # No address6 for the same reason: the overlay is v4-only until router
  # terminates IPv6, so this node registers a v4-only *node address*. That does
  # not stop it backing IPv6 Services — kube-controller-manager still hands it
  # a v6 podCIDR out of pod_subnets, and pods here get both families — so a
  # LoadBalancer with pod backends works over v6 today. What is still missing
  # is v6 for anything keyed on the node address: NodePort and host-network
  # workloads. Give it an address6 here once the tunnel carries v6.
  edge-0:
    type: worker
    address: 10.200.255.2
    dhcp6: true
    wireguard:
      peer: home-router-0

  # The storage node. Bare metal on the LAN like cp-0/1/2, but a plain worker:
  # etcd is already three-way and this box is here for its disks, not its vote.
  #
  # This is physically the machine the root cluster called `home1`. It is named
  # w-1 here to match the rest of ng, but the node LABEL stays `location: home1`
  # — that names a place, not a host, and every hostPath PV migrated off the old
  # cluster selects on it. Renaming the label means editing every one of them.
  #
  # It carries a pre-existing ZFS pool — four 6 TB SAS drives (ST6000NM0034 /
  # 0095) as a 4-wide raidz1 in an external enclosure, ~15.7 TiB usable. Talos
  # does not own that pool: it is imported by the zfs extension's own
  # ext-zpool-importer service, which is why there is no UserVolumeConfig for it
  # the way patches/longhorn.yaml declares one for cp-0/1/2's Netac. See
  # patches/zfs-tank.yaml for the mount and the kubelet bind.
  #
  # Carries all three sandboxes, like cp-0/1/2. The CPU is an AMD Ryzen 5 3600
  # and reports svm, so kata has the hardware virtualization it needs — that is
  # a precondition, not a formality: the extension installs happily on a host
  # without it and then fails when a pod actually asks for the runtime.
  #
  # Adding these made the RuntimeClasses' old `node-role.kubernetes.io/
  # control-plane` selector wrong rather than merely fragile, because this is a
  # worker. kata, kata-qemu and gvisor now select capability labels instead
  # (`yewolf.fr/kata`, `yewolf.fr/gvisor`), set by patches/kata.yaml and
  # patches/gvisor.yaml — the pattern patches/sysbox.yaml already used and
  # argued for. The point is that the config which installs an extension is also
  # the config that advertises it, so the two cannot drift apart. Widening the
  # selector to all nodes would have been the wrong fix: edge-0 has none of
  # these, and a pod admitted to a node with no handler fails at the kubelet
  # rather than falling back to runc.
  #
  # patches/kata.yaml carries no config beyond that label — the kata extension
  # registers its own containerd handlers. gvisor.yaml still carries the sysctl
  # and CRI handler it always did, and must come before sysbox.yaml, which needs
  # the raised user.max_user_namespaces.
  #
  # One thing adding kata here does NOT settle: Home Assistant is privileged in
  # order to reach a USB Zigbee dongle, and kata cannot pass USB through. It
  # does not satisfy require-kata-for-privileged in the way it looks like it
  # should — HA on this node still needs a Kyverno exemption.
  #
  # patches/zfs-tank-longhorn.yaml is NOT in this list yet, and that is the
  # whole reason it is a separate file. Longhorn reads its default-disk
  # annotation exactly once, when it first registers the node; the enclosure is
  # unplugged for the install, so on first boot /var/mnt/tank/longhorn does not
  # exist and registering against it would produce nothing that re-applying can
  # retry. Reattach the enclosure, reboot, confirm the pool mounted, then add
  # the second patch and re-render.
  w-1:
    type: worker
    address: 10.200.0.14
    address6: fdde:c64:7096::14
    extensions:
    - siderolabs/zfs
    - siderolabs/kata-containers
    - siderolabs/gvisor
    custom_extensions:
    - ghcr.io/yyewolf/talos-sysbox-extension@sha256:e92ae18c8efdd4eff53369a6aa34949809b598d803ae3485a0e8c2f6563aa78e
    patches:
    - zfs-tank.yaml
    - zfs-tank-longhorn.yaml
    - gvisor.yaml
    - kata.yaml
    # After gvisor.yaml, which raises user.max_user_namespaces — sysbox needs it.
    - sysbox.yaml
