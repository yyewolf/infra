apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: authentik
  namespace: postgres
spec:
  provider:
    kubernetes:
      remoteNamespace: authentik
      server:
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
      auth:
        serviceAccount:
          name: eso-push-writer-authentik
