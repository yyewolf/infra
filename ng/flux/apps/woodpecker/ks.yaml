apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: woodpecker
  namespace: flux-system
spec:
  decryption:
    provider: sops
    secretRef:
      name: sops-gpg
  dependsOn:
  # envoy-proxy for the Gateway the route attaches to, longhorn for the
  # `longhorn-ci` StorageClass every pipeline's workspace volume is provisioned
  # from, and kyverno-policies because the whole security model of this app is
  # two ClusterPolicies: without them the step pods are admitted unsandboxed
  # into a namespace that has Pod Security turned off.
  #
  # Not woodpecker-db: that Kustomization writes a Role into this namespace, so
  # it is the one that waits, and the server simply stays pending on its missing
  # secret until the push lands.
  - name: envoy-proxy
  - name: longhorn
  - name: kyverno-policies
  interval: 10m
  path: ./ng/flux/apps/woodpecker
  prune: false
  retryInterval: 1m
  sourceRef:
    kind: GitRepository
    name: flux-system
