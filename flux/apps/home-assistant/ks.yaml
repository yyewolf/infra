# The workloads. Third and last of the three Kustomizations this app is split
# into — see storage/ks.yaml for why.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: home-assistant
  namespace: flux-system
spec:
  decryption:
    provider: sops
    secretRef:
      name: sops-gpg
  dependsOn:
  - name: envoy-proxy
  # ingress.yaml puts esphome and zigbee2mqtt on the tailnet, and the operator
  # owns the `tailscale` IngressClass — without it both are admitted and simply
  # never get an address.
  - name: tailscale
  interval: 10m
  path: ./flux/apps/home-assistant
  prune: true
  retryInterval: 1m
  sourceRef:
    kind: GitRepository
    name: flux-system
