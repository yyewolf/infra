# Layer-4 PROXY protocol on every upstream connection to stalwart, so the mail
# server sees the real client address instead of the envoy-proxy pod IP. Without
# this every delivered message, every IMAP login and every rate-limit decision
# appears to come from the edge proxy — spam filtering and auth failure counting
# are blind.
#
# BackendTrafficPolicy only accepts route-level targets (not Services), so
# every TCPRoute and TLSRoute is named explicitly.
#
# Stalwart's listener must also accept PROXY protocol. That is database state
# set via the management API (listeners → advanced → proxy protocol), not
# manifest state.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: stalwart-proxy-protocol
spec:
  targetRefs:
  - group: gateway.networking.k8s.io
    kind: TCPRoute
    name: smtp
  - group: gateway.networking.k8s.io
    kind: TCPRoute
    name: submission
  - group: gateway.networking.k8s.io
    kind: TCPRoute
    name: sieve
  - group: gateway.networking.k8s.io
    kind: TLSRoute
    name: smtps
  - group: gateway.networking.k8s.io
    kind: TLSRoute
    name: imaps
  - group: gateway.networking.k8s.io
    kind: TLSRoute
    name: pop3s
  proxyProtocol:
    version: V2
