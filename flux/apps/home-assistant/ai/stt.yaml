# Speech-to-text via Wyoming protocol. Replaced the original faster-whisper
# backend (67453b5) with nemo-parakeet-tdt-0.6b-v3 — smaller, faster, and
# multilingual with no separate model download.
#
# Stateless: the ONNX model is pulled on first request and cached in memory.
apiVersion: v1
kind: Service
metadata:
  name: stt
spec:
  ports:
  - port: 10300
    targetPort: 10300
  selector: { app: stt }
  clusterIP: None
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: stt
  labels: { app: stt }
spec:
  serviceName: stt
  replicas: 1
  selector:
    matchLabels: { app: stt }
  template:
    metadata:
      labels: { app: stt }
    spec:
      nodeSelector:
        kubernetes.io/hostname: w-1
      containers:
      - name: stt
        image: ghcr.io/tboby/wyoming-onnx-asr:latest@sha256:9b2ccdd52c7aa83e36a2d674de749c4c01bd6bb1e23ea45dd85befb9fc013340
        securityContext:
          allowPrivilegeEscalation: false
          capabilities: { drop: [ ALL ] }
          seccompProfile: { type: RuntimeDefault }
        args:
        - "--model-multilingual"
        - "nemo-parakeet-tdt-0.6b-v3"
        - "--uri"
        - "tcp://0.0.0.0:10300"
        ports:
        - { containerPort: 10300 }
        resources:
          requests: { memory: "512Mi", cpu: "200m" }
          limits: { memory: "4Gi" }
