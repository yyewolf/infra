# The backend is the KEDA interceptor, not the app's own Service — routing
# straight to the app would bypass the wake-up and serve nothing at zero
# replicas. The InterceptorRoute picks the real backend from the Host header.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: webmail
spec:
  parentRefs:
  - name: envoy-gateway
    namespace: envoy-gateway-system
    sectionName: yewolf.fr-tls
  hostnames:
  - "mail.yewolf.fr"
  rules:
  - backendRefs:
    - group: ""
      kind: Service
      name: keda-add-ons-http-interceptor-proxy
      namespace: keda
      port: 8080
    matches:
    - path:
        type: PathPrefix
        value: /
