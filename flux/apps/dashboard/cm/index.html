<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Internal Dashboard</title>
  <style>
    :root {
      --bg: #0e1116;
      --card: #171b22;
      --border: #262c36;
      --fg: #e6edf3;
      --muted: #8b949e;
      --accent: #58a6ff;
      --tile: #1f2530;
      --sheen: rgba(255, 255, 255, .05);
      --shadow: rgba(0, 0, 0, .45);
    }

    @media (prefers-color-scheme: light) {
      :root {
        --bg: #f6f8fa;
        --card: #ffffff;
        --border: #d0d7de;
        --fg: #1f2328;
        --muted: #656d76;
        --accent: #0969da;
        --tile: #eef1f5;
        --sheen: rgba(9, 105, 218, .05);
        --shadow: rgba(31, 35, 40, .12);
      }
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 3rem 1.25rem;
      font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--fg);
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    header {
      text-align: center;
      margin-bottom: 2.5rem;
      animation: rise .5s cubic-bezier(.2, .7, .3, 1) both;
    }

    h1 {
      margin: 0 0 .3rem;
      font-size: 1.6rem;
      letter-spacing: -.02em;
    }

    header p {
      margin: 0;
      color: var(--muted);
      font-size: .95rem;
    }

    .section {
      width: 100%;
      max-width: 720px;
      margin: 1.75rem 0 .75rem;
      font-size: .8rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: .08em;
      color: var(--muted);
      animation: rise .5s cubic-bezier(.2, .7, .3, 1) both;
      animation-delay: .04s;
    }

    .section:first-of-type {
      margin-top: 0;
    }

    .grid {
      width: 100%;
      max-width: 720px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: .9rem;
    }

    a.card {
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      gap: .8rem;
      padding: .95rem 1.05rem;
      border-radius: 12px;
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--fg);
      text-decoration: none;
      transition: border-color .2s ease, transform .2s cubic-bezier(.2, .7, .3, 1), box-shadow .2s ease;
      /* Staggered by --i below. `both` holds the pre-animation state, so the
         cards are invisible until their turn rather than flashing in at full
         opacity and then animating. */
      animation: rise .5s cubic-bezier(.2, .7, .3, 1) both;
      animation-delay: calc(.06s + var(--i, 0) * .035s);
    }

    /* The sheen. A single wide, very faint highlight parked off the left edge
       that crosses the card once on hover. Pointer-events off so it never
       intercepts the click. */
    a.card::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: linear-gradient(105deg, transparent 30%, var(--sheen) 50%, transparent 70%);
      transform: translateX(-100%);
      transition: transform .7s ease;
    }

    a.card:hover,
    a.card:focus-visible {
      border-color: var(--accent);
      transform: translateY(-3px);
      box-shadow: 0 8px 22px -12px var(--shadow);
    }

    a.card:hover::after,
    a.card:focus-visible::after {
      transform: translateX(100%);
    }

    a.card:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    a.card:active {
      transform: translateY(-1px);
    }

    .tile {
      flex: 0 0 auto;
      display: grid;
      place-items: center;
      width: 36px;
      height: 36px;
      border-radius: 9px;
      background: var(--tile);
      color: var(--muted);
      transition: color .2s ease, background-color .2s ease, transform .3s cubic-bezier(.2, .7, .3, 1);
    }

    a.card:hover .tile,
    a.card:focus-visible .tile {
      color: var(--accent);
      transform: scale(1.06);
    }

    .icon {
      width: 20px;
      height: 20px;
      stroke: currentColor;
      stroke-width: 1.6;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
    }

    .text {
      display: flex;
      flex-direction: column;
      gap: .1rem;
      min-width: 0;
    }

    .name {
      font-weight: 600;
    }

    .path {
      color: var(--muted);
      font-size: .8rem;
      font-family: ui-monospace, SFMono-Regular, monospace;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    footer {
      margin-top: 2.5rem;
      color: var(--muted);
      font-size: .8rem;
      text-align: center;
      animation: rise .5s cubic-bezier(.2, .7, .3, 1) both;
      animation-delay: .34s;
    }

    @keyframes rise {
      from {
        opacity: 0;
        transform: translateY(10px);
      }

      to {
        opacity: 1;
        transform: none;
      }
    }

    /* Not decoration. Everything above is either an entrance animation or a
       transform, which is exactly the class of motion this setting exists to
       switch off — so all of it goes, rather than being merely shortened. The
       colour and border feedback on hover stays. */
    @media (prefers-reduced-motion: reduce) {

      header,
      .section,
      a.card,
      footer {
        animation: none;
      }

      a.card,
      a.card::after,
      .tile {
        transition: border-color .2s ease, color .2s ease;
        transform: none;
      }

      a.card:hover,
      a.card:focus-visible,
      a.card:active {
        transform: none;
        box-shadow: none;
      }

      a.card:hover::after,
      a.card:focus-visible::after {
        transform: translateX(-100%);
      }

      a.card:hover .tile,
      a.card:focus-visible .tile {
        transform: none;
      }
    }
  </style>
</head>

<body>
  <!-- Icon sprite. Inline rather than linked: this pod's network policy is

    </symbol>

      <path d="M5.6 18.4a9 9 0 0 1 0-12.8M18.4 5.6a9 9 0 0 1 0 12.8" />
    </symbol>

    <symbol id="i-disk" viewBox="0 0 24 24">
      <rect x="2.5" y="5" width="19" height="14" rx="2.5" />
      <circle cx="9" cy="12" r="3.2" />
      <circle cx="9" cy="12" r=".8" />

    </symbol>
    <symbol id="i-radar" viewBox="0 0 24 24">

      <path d="M12 12 18.2 5.8" />
    </symbol>
    <symbol id="i-stack" viewBox="0 0 24 24">

    </symbol>
    <symbol id="i-database" viewBox="0 0 24 24">
      <ellipse cx="12" cy="5.8" rx="7.5" ry="3" />
      <path d="M4.5 5.8v12.4c0 1.66 3.36 3 7.5 3s7.5-1.34 7.5-3V5.8" />
      <path d="M4.5 12c0 1.66 3.36 3 7.5 3s7.5-1.34 7.5-3" />
    </symbol>
    <symbol id="i-video" viewBox="0 0 24 24">
      <rect x="2" y="6" width="14" height="12" rx="2" />
      <path d="M16 10l5-3v10l-5-3" />
    </symbol>
  </svg>

  <header>
    <h1>Internal Dashboard</h1>
    <p>Tailscale-only services &middot; ng</p>
  </header>

  <h2 class="section">ng cluster</h2>
  <nav class="grid">

    <a class="card" style="--i:1" href="https://zigbee2mqtt.goby-beaufort.ts.net/">
