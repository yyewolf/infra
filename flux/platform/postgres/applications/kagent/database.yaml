# Two databases on the shared cluster, one per component, deliberately not one
# database with two schemas.
#
# kagent's controller and substrate's ate-api-server are separate programs on
# separate release cadences, each of which runs its own migrations at startup
# and each of which is the sole owner of its tables. Substrate additionally has
# a `postgres.schema` value, which exists precisely because it expects to be
# sharing — and sharing is what makes a restore ambiguous. Two databases means
# either can be dumped, restored or dropped without reference to the other.
#
# Neither needs `extensions:`. kagent's own vector features ride on pgvector,
# which is in template1 already (platform/postgres runs `CREATE EXTENSION
# vchord CASCADE` in postInitTemplateSQL and CASCADE pulls pgvector in), so it
# is inherited rather than requested — which is also why `vectorEnabled: true`
# is safe to set in the HelmRelease.
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: kagent
  namespace: postgres
spec:
  cluster:
    name: postgres
  name: kagent
  # The group role, not the login. alpha13's migration runner opens with
  # `CREATE SCHEMA IF NOT EXISTS kagent` as `kagent_owner`, and Postgres checks
  # CREATE on the database *before* it checks whether the schema exists — so
  # even with the schema below already in place, a role without it fails with
  # `permission denied for database`. CNPG has no grant field; ownership is the
  # declarative way to give it. The login reaches it through SET ROLE.
  owner: kagent_owner
  # Since 1.0.0-alpha13 kagent sets `search_path` to this schema alone and
  # creates its tables there as `kagent_owner`. The alpha5 tables are still in
  # `public`, owned by the `kagent` login, and nothing reads them: a fresh
  # schema is a fresh goose history, which is why this upgrade did not need the
  # `DROP OWNED BY kagent` reset the earlier alphas did. pgvector stays where
  # template1 put it, in `public` — hence `vectorSchema: public` in the release.
  schemas:
  - name: kagent
    owner: kagent_owner
---
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: substrate
  namespace: postgres
spec:
  cluster:
    name: postgres
  name: substrate
  # The group role, for the same reason as kagent above: ate-api-server runs
  # `CREATE SCHEMA IF NOT EXISTS substrate` as `substrate_owner` and failed with
  # `permission denied for database substrate` while the login owned it.
  owner: substrate_owner
  # Owned by the group role, not the login: substrate creates its tables after
  # `SET ROLE substrate_owner`, and CREATE in a schema needs the role it runs as
  # to own it (or hold CREATE on it). The 0.3-era tables are still in `public`
  # and unread.
  #
  # `substrate_0_6` is the live one. Substrate 0.6 needs a fresh database and
  # does not migrate 0.5's snapshot metadata, so platform/substrate/release.yaml
  # points it at a new, empty schema instead of dropping this one: the 0.5-era
  # tables stay in `substrate`, unread, as the 0.3 ones stayed in `public`.
  # The next substrate that wants a fresh database gets the same treatment.
  schemas:
  - name: substrate
    owner: substrate_owner
  - name: substrate_0_6
    owner: substrate_owner
