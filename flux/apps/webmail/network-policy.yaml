apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: webmail
spec:
  endpointSelector:
    matchLabels:
      app: webmail
  ingress:
  # The interceptor is the only client: the HTTPRoute points at it, not at
  # this pod.
  - fromEndpoints:
    - matchLabels:
        io.kubernetes.pod.namespace: keda
        app.kubernetes.io/part-of: keda-add-ons-http
        app.kubernetes.io/component: interceptor
    toPorts:
    - ports:
      - port: "3000"
        protocol: TCP
  - fromEndpoints:
    - matchLabels:
        io.kubernetes.pod.namespace: webmail
  - fromEntities:
    - host
    - remote-node
    - health
  egress:
  - toEndpoints:
    - matchLabels:
        io.kubernetes.pod.namespace: kube-system
        k8s-app: kube-dns
    toPorts:
    - ports:
      - port: "53"
        protocol: UDP
      - port: "53"
        protocol: TCP
  - toEndpoints:
    - matchLabels:
        io.kubernetes.pod.namespace: stalwart
        app: stalwart
    toPorts:
    - ports:
      - port: "8080"
        protocol: TCP
