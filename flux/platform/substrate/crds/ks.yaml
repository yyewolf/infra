apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: substrate-crds
  namespace: flux-system
spec:
  dependsOn:
  - name: cilium
  interval: 10m
  path: ./flux/platform/substrate/crds
  prune: true
  retryInterval: 1m
  sourceRef:
    kind: GitRepository
    name: flux-system
