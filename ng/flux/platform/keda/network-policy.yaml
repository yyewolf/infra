---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: keda-add-ons-http-operator
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/part-of: keda-add-ons-http
      app.kubernetes.io/component: operator
  egress:
  - toEntities:
    - kube-apiserver
    toPorts:
    - ports:
      - port: "6443"
        protocol: TCP
  - toEndpoints:
    - matchLabels:
        io.kubernetes.pod.namespace: kube-system
        k8s-app: kube-dns
    toPorts:
    - ports:
      - port: "53"
        protocol: UDP
      - port: "53"
        protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: keda-add-ons-http-interceptor
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/part-of: keda-add-ons-http
      app.kubernetes.io/component: interceptor
  ingress:
  # Proxy port. Requests arrive from the Envoy proxy, because an HTTPRoute for
  # a scaled app names this Service as its backend. An in-cluster client
  # calling a scaled app directly would have to be added here.
  - fromEndpoints:
    - matchLabels:
        io.kubernetes.pod.namespace: envoy-gateway-system
        app.kubernetes.io/name: envoy
    toPorts:
    - ports:
      - port: "8080"
        protocol: TCP
  # Admin port. The external scaler polls it for the pending-request count.
  - fromEndpoints:
    - matchLabels:
        app.kubernetes.io/part-of: keda-add-ons-http
        app.kubernetes.io/component: scaler
    toPorts:
    - ports:
      - port: "9090"
        protocol: TCP
  egress:
  - toEntities:
    - kube-apiserver
    toPorts:
    - ports:
      - port: "6443"
        protocol: TCP
  - toEndpoints:
    - matchLabels:
        io.kubernetes.pod.namespace: kube-system
        k8s-app: kube-dns
    toPorts:
    - ports:
      - port: "53"
        protocol: UDP
      - port: "53"
        protocol: TCP
  # Forwards to the Service named by each HTTPScaledObject's scaleTargetRef,
  # in whatever namespace the app lives.
  - toEntities:
    - cluster
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: keda-add-ons-http-scaler
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/part-of: keda-add-ons-http
      app.kubernetes.io/component: scaler
  ingress:
  # KEDA's operator is the only gRPC client of an external scaler.
  - fromEndpoints:
    - matchLabels:
        app: keda-operator
    toPorts:
    - ports:
      - port: "9090"
        protocol: TCP
  egress:
  - toEntities:
    - kube-apiserver
    toPorts:
    - ports:
      - port: "6443"
        protocol: TCP
  - toEndpoints:
    - matchLabels:
        io.kubernetes.pod.namespace: kube-system
        k8s-app: kube-dns
    toPorts:
    - ports:
      - port: "53"
        protocol: UDP
      - port: "53"
        protocol: TCP
  - toEndpoints:
    - matchLabels:
        app.kubernetes.io/part-of: keda-add-ons-http
        app.kubernetes.io/component: interceptor
    toPorts:
    - ports:
      - port: "9090"
        protocol: TCP
