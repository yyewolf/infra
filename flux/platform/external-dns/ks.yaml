apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: external-dns
  namespace: flux-system
spec:
  interval: 10m
  decryption:
    provider: sops
    secretRef:
      name: sops-gpg
  path: ./flux/platform/external-dns
  prune: false
  retryInterval: 1m
  sourceRef:
    kind: GitRepository
    name: flux-system
