# S3 credentials for the Swiss Backup bucket that holds this cluster's
# xtrabackup images and archived binary logs.
#
# Encrypted with SOPS under the repo's two PGP keys. `.sops.yaml` matches this
# file by its `-sops.yaml` suffix and encrypts the `stringData` key only, so
# the shape of the Secret stays readable in git and only the values are opaque.
#
# Unlike the Infomaniak API tokens under platform/certificates, this one *is*
# reconciled from git: it is listed in kustomization.yaml and the mysql
# Kustomization carries a `decryption` block pointing at the `sops-gpg` secret
# in flux-system.
apiVersion: v1
kind: Secret
metadata:
    name: mysql-backup-s3
type: Opaque
stringData:
    ACCESS_KEY_ID: ENC[AES256_GCM,data:3Ho6YLhGiR0zwnmaBGkLIgqhwdF+vdeo9QjDO7hRdYw=,iv:h1TvVhVWe5gRZ7Nq/Gusd30fNP/bX0PbjH94PWglW5w=,tag:IpEmg9zlyiqMnQWUe849qQ==,type:str]
