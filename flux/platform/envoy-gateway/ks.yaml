apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: envoy-gateway
  namespace: flux-system
spec:
  decryption:
    provider: sops
    secretRef:
      name: sops-gpg
  dependsOn:
  - name: cilium
  interval: 10m
  path: ./flux/platform/envoy-gateway
  prune: false
  retryInterval: 1m
  sourceRef:
    kind: GitRepository
    name: flux-system
