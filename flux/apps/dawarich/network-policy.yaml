apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: dawarich
spec:
  endpointSelector:
    matchLabels:
      app: dawarich
  ingress:
  - fromEndpoints:
    - matchLabels:
        io.kubernetes.pod.namespace: dawarich
  - fromEndpoints:
    - matchLabels:
        io.kubernetes.pod.namespace: envoy-gateway-system
  # The kubelet's probes originate from the node, not from a pod identity.
  # Without this the startup, readiness and liveness probes are all dropped and
  # the pod restarts forever while looking healthy in its own logs.
  - fromEntities:
    - host
    - remote-node
    - health
  egress:
  - toEndpoints:
    - matchLabels:
        io.kubernetes.pod.namespace: kube-system
        k8s-app: kube-dns
    toPorts:
    - ports:
      - port: "53"
        protocol: UDP
      - port: "53"
        protocol: TCP
  # Redis, which lives in this namespace.
  - toEndpoints:
    - matchLabels:
        io.kubernetes.pod.namespace: dawarich
  # The shared Postgres. Matched by endpoint identity rather than by CIDR, so
  # it is unaffected by how the internet rule below is written.
  - toEndpoints:
    - matchLabels:
        io.kubernetes.pod.namespace: postgres
    toPorts:
    - ports:
      - port: "5432"
        protocol: TCP
  # authentik, for the OIDC login. This is egress to the *gateway*, not to the
  # authentik namespace: auth.yewolf.fr resolves to the LoadBalancer address,
  # and Cilium translates a service address to a backend endpoint before it
  # evaluates egress policy — so what this rule has to name is the envoy proxy
  # pod on its container port, 10443, and not `world` on 443. Written as
  # `toEntities: [world]` the connection is dropped, and it fails as a connect
  # timeout with nothing in the application log.
  #
  # Reached over the public name deliberately: the ID token's `iss` is checked
  # against the issuer in the discovery document, which authentik builds from
  # its own public URL, so an in-cluster shortcut to the authentik Service
  # would have to be paired with a mismatched issuer.
  - toEndpoints:
    - matchLabels:
        io.kubernetes.pod.namespace: envoy-gateway-system
        app.kubernetes.io/component: proxy
    toPorts:
    - ports:
      - port: "10443"
        protocol: TCP
  # Reverse geocoding. Dawarich turns every point into a place name by calling
  # an external geocoder — Photon by default, optionally Geoapify or a
  # self-hosted Nominatim — and without this every imported point silently
  # keeps its coordinates and never gets a name. Also how it checks for
  # releases.
  - toEntities:
    - world
    toPorts:
    - ports:
      - port: "443"
        protocol: TCP
      - port: "80"
        protocol: TCP
