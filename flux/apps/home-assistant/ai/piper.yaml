# Piper TTS — text-to-speech for Home Assistant voice pipelines.
# Stateless: the voice model is downloaded into memory at startup.
apiVersion: v1
kind: Service
metadata:
  name: piper
spec:
  ports:
    - port: 10200
      targetPort: 10200
  selector: {app: piper}
  clusterIP: None
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: piper
  labels: {app: piper}
spec:
  serviceName: piper
  replicas: 1
  selector:
    matchLabels: {app: piper}
  template:
    metadata:
      labels: {app: piper}
    spec:
      nodeSelector:
        kubernetes.io/hostname: w-1
      containers:
      - name: piper
        image: lscr.io/linuxserver/piper:latest@sha256:dd67b7cb88b1255f3a6eb4207fbdded8fc341173604e6a39b0b07a2e9f23e910
        securityContext:
          allowPrivilegeEscalation: false
          seccompProfile: {type: RuntimeDefault}
        env:
        - {name: PUID, value: "1000"}
        - {name: PGID, value: "1000"}
        - {name: TZ, value: "Etc/UTC"}
        - {name: PIPER_VOICE, value: "fr_FR-tom-medium"}
        - {name: LOCAL_ONLY, value: ""}
        - {name: PIPER_LENGTH, value: "1.0"}
        - {name: PIPER_NOISE, value: "0.667"}
        - {name: PIPER_NOISEW, value: "0.333"}
        - {name: PIPER_SPEAKER, value: "0"}
        - {name: NO_STREAMING, value: ""}
        ports:
        - {containerPort: 10200}
        resources:
          requests: {memory: "256Mi", cpu: "100m"}
          limits: {memory: "1Gi"}
