# Scaling half of the pair. `interceptorRoute` must equal the InterceptorRoute's
# metadata.name: if the route is missing when KEDA reconciles this, the scaler
# returns an empty metric spec and the HPA silently falls back to a CPU metric,
# which never scales up from zero.
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: webmail
spec:
  scaleTargetRef:
    name: webmail
  minReplicaCount: 0
  maxReplicaCount: 1
  # Long on purpose: an open tab keeps polling, and a cold start partway
  # through reading mail is worse than an idle pod for half an hour.
  cooldownPeriod: 1800
  triggers:
    - type: external-push
      metadata:
        scalerAddress: keda-add-ons-http-external-scaler.keda:9090
        interceptorRoute: webmail
