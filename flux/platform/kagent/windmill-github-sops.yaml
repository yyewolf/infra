    git-basic: ENC[AES256_GCM,data:m3hajRVqwFEzBYj6GkWGdsOtIXgAwc4ZPTo2QUT6xL0aEnUXcln0wTffXW0nFTMfrtVAHqejEmr7T9Lqd5ijahxV3NeolYLU3BL7tMShIavoUXjGqj/6ZKHmn+Qt56YM9WDe8BlUQQdCRtUsjlGH2OvgB8A1St1OGs8D2YY+tBtbncXlTJGXygdPyElll6wF,iv:AQ8ckgNmSik++npa0EduFy3V32esAhwxO2pbZhGMLXw=,tag:g6o5+Ve9MHGMfms3W6grLQ==,type:str]
