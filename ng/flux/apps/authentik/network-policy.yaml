# Authentik handles auth.yewolf.fr traffic from the edge, talks to the shared
# CNPG Postgres, and serves ext-auth requests from envoy-gateway-system. Workers
# also reach Postgres. Email is sent outbound to the LAN/tailnet SMTP server.
#
# THIS POLICY DOES NOT COVER THE OUTPOSTS, AND THE 9000 RULE BELOW IMPLIES IT
# DOES. `app.kubernetes.io/instance: authentik` is a chart label, and the outpost
# pods are not created by the chart — authentik's own Kubernetes outpost
# controller reconciles them from the provider definitions in the database, with
# `app.kubernetes.io/name: authentik-outpost-proxy` (and `-ldap`) and no instance
# label at all. So `ak-outpost-proxy`, which is the backend every SecurityPolicy
# in apps/servarr/routes.yaml calls for ext-auth on 9000, is selected by no
# policy in this cluster and is therefore default-allow. Port 9000 is the
# outpost's port, not the server's; the rule below grants nothing.
#
# Closing that means a second policy selecting `app.kubernetes.io/name:
# authentik-outpost-proxy` — ingress from envoy-gateway-system on 9000, egress to
# authentik-server and kube-dns. Deliberately not done in the same change as the
# servarr SSO wiring: the LDAP outpost beside it has consumers outside this
# repo, and a policy written blind for either one fails closed on a path that is
# currently working.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: authentik
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/instance: authentik
  ingress:
  - fromEndpoints:
    - matchLabels:
        io.kubernetes.pod.namespace: envoy-gateway-system
    toPorts:
    - ports:
      - port: "80"
        protocol: TCP
      - port: "9443"
        protocol: TCP
      - port: "9000"
        protocol: TCP
  - fromEndpoints:
    - matchLabels:
        io.kubernetes.pod.namespace: authentik
  - fromEntities:
    - host
    - remote-node
    - health
  egress:
  - toEntities:
    - kube-apiserver
    toPorts:
    - ports:
      - port: "6443"
        protocol: TCP
  - toEndpoints:
    - matchLabels:
        io.kubernetes.pod.namespace: kube-system
        k8s-app: kube-dns
    toPorts:
    - ports:
      - port: "53"
        protocol: UDP
      - port: "53"
        protocol: TCP
  - toEndpoints:
    - matchLabels:
        io.kubernetes.pod.namespace: postgres
    toPorts:
    - ports:
      - port: "5432"
        protocol: TCP
  - toEndpoints:
    - matchLabels:
        io.kubernetes.pod.namespace: authentik
  - toCIDRSet:
    - cidr: 0.0.0.0/0
      except:
      - 10.0.0.0/8
      - 192.168.0.0/16
    toPorts:
    - ports:
      - port: "25"
        protocol: TCP
      - port: "465"
        protocol: TCP
      - port: "587"
        protocol: TCP
