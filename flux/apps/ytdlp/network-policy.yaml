apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: ytdlp
spec:
  endpointSelector:
    matchLabels:
      app: yt-dlp-webui
  ingress:
  # The interceptor is the only client: the HTTPRoute points at it, not at
  # this pod.
  - fromEndpoints:
    - matchLabels:
        io.kubernetes.pod.namespace: keda
        app.kubernetes.io/part-of: keda-add-ons-http
        app.kubernetes.io/component: interceptor
    toPorts:
    - ports:
      - port: "8081"
        protocol: TCP
  - fromEntities:
    - host
    - remote-node
    - health
  egress:
  - toEndpoints:
    - matchLabels:
        io.kubernetes.pod.namespace: kube-system
        k8s-app: kube-dns
    toPorts:
    - ports:
      - port: "53"
        protocol: UDP
      - port: "53"
        protocol: TCP
  - toEndpoints:
    - matchLabels:
        io.kubernetes.pod.namespace: ytdlp
  - toCIDRSet:
    - cidr: 0.0.0.0/0
      except:
      - 10.0.0.0/8
      - 192.168.0.0/16
