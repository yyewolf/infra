# Two keys rather than the single connection URI the postgres tenants push:
# Uptime Kuma has no DSN input at all, it reads five separate
# `UPTIME_KUMA_DB_*` variables. The three that are not secret (type, hostname,
# port, name) are plain env in the Deployment; only these two come from here,
# which is why the app's manifests hold no credential material.
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: uptime-kuma-db
  namespace: mysql
spec:
  refreshInterval: 1h
  deletionPolicy: None
  secretStoreRefs:
  - name: uptime-kuma
    kind: SecretStore
  selector:
    secret:
      name: uptime-kuma-db-credentials
  template:
    engineVersion: v2
    data:
      UPTIME_KUMA_DB_USERNAME: "{{ .username }}"
      UPTIME_KUMA_DB_PASSWORD: "{{ .password }}"
  data:
  - match:
      secretKey: UPTIME_KUMA_DB_USERNAME
      remoteRef:
        remoteKey: uptime-kuma-db
        property: UPTIME_KUMA_DB_USERNAME
  - match:
      secretKey: UPTIME_KUMA_DB_PASSWORD
      remoteRef:
        remoteKey: uptime-kuma-db
        property: UPTIME_KUMA_DB_PASSWORD
