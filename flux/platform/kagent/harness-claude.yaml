# The Claude Code harness — Claude Code run as a kagent runtime, one turn per
# Substrate actor, streamed back over A2A.
#
# It reaches Infomaniak through anthropic-shim.yaml rather than directly, and
# the reason is a single header. The claude compiler accepts three providers
# (go/core/internal/translator/claude/compiler.go): Anthropic, Bedrock and
# AnthropicVertexAI. Anthropic takes an optional baseUrl, so Infomaniak's
# Anthropic-compatible route looks like a fit — but credentials.go pins the
# injected header per provider and offers no field to change it:
#
#   case ModelProviderOpenAI:    header, prefix = "authorization", "Bearer "
#   case ModelProviderAnthropic: header         = "x-api-key"
#
# and Infomaniak's route takes only Bearer. Measured against the live endpoint,
# not inferred: x-api-key -> 401, Authorization: Bearer -> 200. The shim exists
# to move the token between those two headers, and holds no credential of its
# own — read the note at the top of anthropic-shim.yaml before changing it,
# because "give the shim its own token" is the obvious simplification and it
# turns the shim into an open relay onto the model.
#
# The codex harness needs no shim — it is OpenAI-shaped and already uses
# Bearer — but its compiler hard-requires openAI.apiFormat `responses`, and
# Infomaniak 404s /v1/responses while serving /v1/chat/completions. That is why
# this is the claude harness and not that one.
#
# This coexists with the Infomaniak model the chart generates rather than
# replacing it: `providers.default` in release.yaml stays as it is, this
# harness names its own ModelConfig, and the two share one worker pool.
#
# Credential injection needs no extra grant — `credentialProvider` in
# platform/substrate/release.yaml already grants the `kagent` atespace access
# to Secrets in the `kagent` namespace, which is where this one lives.
apiVersion: kagent.dev/v1alpha3
kind: ModelConfig
metadata:
  name: anthropic
  namespace: kagent
spec:
  provider: Anthropic
  # The same model the chart-generated OpenAI ModelConfig names — one product
  # (106500), one catalogue, reached over two wire formats. Deliberately NOT an
  # Anthropic model name: nothing behind this route is Claude, the route only
  # speaks the Messages API. If a turn fails claiming an unknown model, list
  # what the anthropic route actually offers, which may differ from the openai
  # one:
  #   curl -H "Authorization: Bearer $TOKEN" \
  #     https://api.infomaniak.com/2/ai/106500/anthropic/v1/models
  model: moonshotai/Kimi-K2.6
  # The shim, not api.anthropic.com. Only the hostname is used to derive the
  # actor's egress destination; the whole URL is passed to Claude Code as
  # ANTHROPIC_BASE_URL, which appends /v1/messages. http:// is accepted by the
  # compiler's validator (scheme http or https, no credentials, query or
  # fragment), and the hop is inside the cluster.
  anthropic:
    baseUrl: http://anthropic-shim.kagent.svc.cluster.local:8080
  # The Infomaniak token. It is the same credential the chart-generated
  # OpenAI ModelConfig uses, hence the `openai` name on a ModelConfig whose
  # provider is Anthropic — one token, two routes on the same product. The
  # compiler only requires that the Secret exists and the key is non-empty.
  apiKeySecret: kagent-openai
  apiKeySecretKey: OPENAI_API_KEY
---
apiVersion: kagent.dev/v1alpha3
kind: Harness
metadata:
  name: claude
  namespace: kagent
spec:
  claude: {}
  workload:
    # Same digest rule as the kagent harness, same version as the chart.
    image: ghcr.io/kagent-dev/kagent/claude-harness@sha256:23b59459d66ce3162892239b035ba924cd1d64a6e3826db277599e9a98b2f36a
  substrate:
    workerPoolRef:
      name: kagent-default
    snapshotPolicy:
      location: s3://ate-snapshots/kagent
  allowedAgentTemplates:
    selector:
      matchLabels:
        kagent.dev/harness: claude
---
apiVersion: kagent.dev/v1alpha3
kind: AgentTemplate
metadata:
  name: claude-assistant
  namespace: kagent
  labels:
    kagent.dev/harness: claude
spec:
  description: Claude Code, with the cluster's read-only tools.
  modelConfig:
    name: anthropic
  systemPrompt: |
    You are Claude Code running as an agent against a small Kubernetes cluster
    managed entirely by Flux from a git repository. Your Kubernetes tools are
    read-only and cannot see Secrets. A change that is wanted belongs in the
    git repository; describe the manifest edit rather than a kubectl command.
  tools:
    - mcp:
        server:
          kind: RemoteMCPServer
          name: kagent-tool-server
