apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: radar
spec:
  # IngressClass created by the tailscale operator. The operator reads the
  # hostname off tls.hosts, not off a rule host — the tailnet name is
  # radar.<tailnet>.ts.net. It was `radar-ng` while the root cluster still held
  # `radar` on the shared tailnet; that device is deleted, so the suffix is off.
  ingressClassName: tailscale
  tls:
    - hosts:
        - radar
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: radar
                port:
                  number: 9280
