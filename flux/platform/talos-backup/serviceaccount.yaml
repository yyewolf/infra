# Not a Kubernetes ServiceAccount — a Talos one. The CRD is registered by Talos
# when machine.features.kubernetesTalosAPIAccess is enabled, and a controller on
# the control plane watches these and writes a Secret of the same name holding a
# talosconfig (key `config`) scoped to exactly the roles listed here.
#
# This is why none of the cluster PKI in talos/secrets-sops-all.yaml is involved:
# the credential is minted by the cluster, rotated by the cluster, and is only
# ever good for taking etcd snapshots. `os:etcd:backup` cannot read machine
# config, cannot reboot a node, cannot do anything else.
#
# The namespace this lives in must appear in allowedKubernetesNamespaces in
# talos/patches/controlplane.yaml, or the controller ignores it and the Secret
# is never created — the CronJob then fails on a missing volume, which is the
# symptom to look for.
apiVersion: talos.dev/v1alpha1
kind: ServiceAccount
metadata:
  name: talos-backup-secrets
spec:
  roles:
    - os:etcd:backup
