apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: dashboard
  namespace: flux-system
spec:
  dependsOn:
  # The tailscale operator owns the `tailscale` IngressClass and the proxy
  # that fronts this. Without it the Ingress is admitted and simply never
  # gets an address.
  - name: tailscale
  interval: 10m
  path: ./flux/apps/dashboard
  prune: true
  retryInterval: 1m
  sourceRef:
    kind: GitRepository
    name: flux-system
