# Management port plus the six mail-protocol ports forwarded by the ListenerSet.
# The ports here match what stalwart binds by default and what the TCPRoutes in
# tcp-routes.yaml target.
apiVersion: v1
kind: Service
metadata:
  name: stalwart
spec:
  ports:
  - name: mgmt
    port: 8080
    targetPort: 8080
  - name: smtp
    port: 25
    targetPort: 25
  - name: smtps
    port: 465
    targetPort: 465
  - name: submission
    port: 587
    targetPort: 587
  - name: imaps
    port: 993
    targetPort: 993
  - name: pop3s
    port: 995
    targetPort: 995
  - name: sieve
    port: 4190
    targetPort: 4190
  selector:
    app: stalwart
