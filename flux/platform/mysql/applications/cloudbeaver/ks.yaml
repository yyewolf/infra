apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cloudbeaver-mysql-creds
  namespace: flux-system
spec:
  decryption:
    provider: sops
    secretRef:
      name: sops-gpg
  dependsOn:
  - name: external-secrets
  - name: mysql
  interval: 10m
  path: ./flux/platform/mysql/applications/cloudbeaver
  prune: true
  retryInterval: 1m
  sourceRef:
    kind: GitRepository
    name: flux-system
