apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: uptime-kuma-unshade
  namespace: flux-system
spec:
  dependsOn:
  # Same reasoning as apps/uptime-kuma: not uptime-kuma-unshade-db, because
  # that Kustomization writes a Role into this namespace and is the one that
  # waits.
  - name: envoy-proxy
  interval: 10m
  path: ./flux/apps/uptime-kuma-unshade
  prune: true
  retryInterval: 1m
  sourceRef:
    kind: GitRepository
    name: flux-system
