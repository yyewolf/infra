# The workloads. Third and last of the three Kustomizations this app is split
# into — see storage/ks.yaml for why.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: home-assistant
  namespace: flux-system
spec:
  decryption:
    provider: sops
    secretRef:
      name: sops-gpg
  dependsOn:
  - name: envoy-proxy
  interval: 10m
  path: ./ng/flux/apps/home-assistant
  prune: true
  retryInterval: 1m
  sourceRef:
    kind: GitRepository
    name: flux-system
