apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: dashboard
spec:
  # A Tailscale Ingress takes its hostname from `tls.hosts`, not from a rule
  # host — hence no rule host below. `dashboard` with no suffix: the root
  # cluster's device of the same name was deleted along with this app, so
  # there is nothing left to collide with and get silently renamed to
  # `dashboard-1`.
  ingressClassName: tailscale
  tls:
  - hosts:
    - dashboard
  rules:
  - http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: caddy
            port:
              number: 80
