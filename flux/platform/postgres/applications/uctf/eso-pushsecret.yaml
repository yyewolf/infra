# basilic reads its DSN straight out of the environment (the chart's
# `env.existingSecrets` becomes an `envFrom`), so the remote key has to be the
# variable name the app looks for.
#
# sslmode is stated rather than left to the driver default: CNPG serves TLS
# with its own CA, so `require` encrypts without asking the client to verify a
# certificate it has no root for. The root cluster's Postgres was plaintext and
# these DSNs said `sslmode=disable`; that is the one part of them that does not
# carry over.
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: basilic-db
  namespace: postgres
spec:
  refreshInterval: 1h
  deletionPolicy: None
  secretStoreRefs:
  - name: uctf
    kind: SecretStore
  selector:
    secret:
      name: uctf-db-credentials
  template:
    engineVersion: v2
    data:
      uri: postgres://{{ .username | urlquery }}:{{ .password | urlquery }}@postgres-rw.postgres.svc.cluster.local:5432/uctf?sslmode=require
  data:
  - match:
      secretKey: uri
      remoteRef:
        remoteKey: basilic-db
        property: DATABASE_URL
---
# safran's push builds the whole `safran-runtime` Secret rather than one key of
# it, and the target name is the chart's, not ours: the HelmRelease sets
# `secrets.existingSecret: safran-runtime`, so this is what has to be sitting
# in the namespace before Helm runs at all. See db-credentials-sops.yaml for
# why the two non-Postgres keys are sourced from a secret named
# `-db-credentials`.
#
# The key names on the right are the chart's defaults (`secrets.keys.*`) and
# are what the Deployment and the migrate Job actually reference.
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: safran-runtime
  namespace: postgres
spec:
  refreshInterval: 1h
  deletionPolicy: None
  secretStoreRefs:
  - name: uctf
    kind: SecretStore
  selector:
    secret:
      name: safran-db-credentials
  template:
    engineVersion: v2
    data:
      uri: postgres://{{ .username | urlquery }}:{{ .password | urlquery }}@postgres-rw.postgres.svc.cluster.local:5432/safran?sslmode=require
      adminBearerToken: "{{ .adminBearerToken }}"
      secretsMasterKey: "{{ .secretsMasterKey }}"
  data:
  - match:
      secretKey: uri
      remoteRef:
        remoteKey: safran-runtime
        property: DATABASE_URL
  - match:
      secretKey: adminBearerToken
      remoteRef:
        remoteKey: safran-runtime
        property: ADMIN_BEARER_TOKEN
  - match:
      secretKey: secretsMasterKey
      remoteRef:
        remoteKey: safran-runtime
        property: SECRETS_MASTER_KEY
