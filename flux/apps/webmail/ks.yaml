apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: webmail
  namespace: flux-system
spec:
  dependsOn:
  - name: envoy-proxy
  - name: stalwart
  interval: 10m
  path: ./flux/apps/webmail
  prune: false
  retryInterval: 1m
  sourceRef:
    kind: GitRepository
    name: flux-system
