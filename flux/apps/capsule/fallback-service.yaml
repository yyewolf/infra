# InterceptorRoute's coldStart.fallback resolves the Service name in its own
# namespace, so the shared placeholder in booting-up needs a local alias here.
# Every scale-to-zero app that wants the placeholder page copies this file.
apiVersion: v1
kind: Service
metadata:
  name: service-fallback
spec:
  type: ExternalName
  externalName: caddy.booting-up.svc.cluster.local
  ports:
    - name: http
      port: 80
      targetPort: 80
