# The CloudBeaver-internal admin account. Not the SSO login — authentik is
# what decides who reaches this server at all (see the tailscale Ingress in
# apps/authentik). This account exists for the other half: administering
# CloudBeaver itself, which an anonymous session cannot do, and, more
# importantly, for consuming the first-run setup wizard at startup so that
# nobody else is offered it.
#
# CB_ADMIN_NAME/CB_ADMIN_PASSWORD are read once, when the workspace is empty.
# Changing them here after the fact does not change the account — do that from
# the UI.
