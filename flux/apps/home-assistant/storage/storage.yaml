# The three volumes Home Assistant and its addons need, all on `big-pool`.
#
# There was a fourth, `snapcast-storage`. Snapcast is gone and the claim went
# with it — `big-pool` is `reclaimPolicy: Retain`, so its PV and Longhorn volume
# are still there in Released state rather than deleted, and the pre-migration
# copy is still in /var/mnt/tank/others/pvcs on w-1. Clean both up by hand once
# you are sure nothing wants that audio back.
#
# WHY BIG-POOL AND NOT A hostPath PV
#
# The root cluster put these on `local-path-home1-retain`, which meant the data
# landed in /tank/others/pvcs/pvc-<uuid>_<ns>_<claim> — a directory whose name
# contains the PV's UID, generated at provision time. Nothing about that name is
# reproducible, so these claims could never have been "migrated" by recreating
# the same YAML the way the explicit hostPath PVs (paperless, stalwart, registry)
# can be. The data has to be copied, which is what migrate/ does.
#
# Given a copy is unavoidable, big-pool is the better destination: the volumes
# stop being pinned to whichever node happened to provision them, and become
# attachable from anywhere.
#
# Every claim is ReadWriteOnce, which is not a limitation to work around: each
# of these apps is single-writer by nature, and the StatefulSets exist to
# guarantee exactly one replica ever holds the volume.
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: home-assistant
  labels:
    recurring-job-group.longhorn.io/home-assistant-backup: enabled
spec:
  accessModes: [ ReadWriteOnce ]
  storageClassName: big-pool
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: zigbee2mqtt-storage
  labels:
    recurring-job-group.longhorn.io/home-assistant-backup: enabled
spec:
  accessModes: [ ReadWriteOnce ]
  storageClassName: big-pool
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: esphome-config
  labels:
    recurring-job-group.longhorn.io/home-assistant-backup: enabled
spec:
  accessModes: [ ReadWriteOnce ]
  storageClassName: big-pool
  resources:
    requests:
      storage: 15Gi
---
# Frigate's config directory — config.yml, the SQLite DB and the cached model
# weights. Small and rarely written, so it shares the home-assistant-backup
# recurring job with the rest of the stack. Like the three above it is a static
# claim referenced by name rather than a volumeClaimTemplate, matching every
# other workload in this namespace.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: frigate-config
  labels:
    recurring-job-group.longhorn.io/home-assistant-backup: enabled
spec:
  accessModes: [ ReadWriteOnce ]
  storageClassName: big-pool
  resources:
    requests:
      storage: 10Gi
---
# Frigate's recording store. This is the bulk of Frigate's footprint: every
# retained event segment and continuous recording lands here. Sized to start;
# big-pool is allowVolumeExpansion so it grows later without recreating the PV.
# Also on the home-assistant-backup recurring job.
#
# One volume per role (config vs media) rather than a single claim with two
# paths, so the two are sized independently and a media pruning never touches
# the config DB. Both are RWO on big-pool, which is w-1-only — Frigate is
# pinned to w-1 for the same reason the rest of the HA stack is (the cameras
# are on the home LAN reachable from that node, and big-pool lives there).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: frigate-media
  labels:
    recurring-job-group.longhorn.io/home-assistant-backup: enabled
spec:
  accessModes: [ ReadWriteOnce ]
  storageClassName: big-pool
  resources:
    requests:
      storage: 100Gi
