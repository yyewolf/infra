# No `createdb: true` and no superuser on either. Both components migrate their
# own schema inside a database that already exists, which is all the owner of
# that database needs.
apiVersion: postgresql.cnpg.io/v1
kind: DatabaseRole
metadata:
  name: kagent
  namespace: postgres
spec:
  cluster:
    name: postgres
  name: kagent
  login: true
  # Since kagent 1.0.0-alpha14 this is the same shape as substrate below, all
  # the way down: two pools, `SET ROLE kagent_owner` for migrations and
  # `SET ROLE kagent_readwrite` for everything else
  # (`config.database.{owner,readWrite}.role` in platform/kagent/release.yaml),
  # tables in the `kagent` schema that `kagent_owner` owns. One login in both
  # roles, as for substrate. NOINHERIT for the same reason as substrate's login.
  inRoles:
  - kagent_owner
  - kagent_readwrite
  inherit: false
  passwordSecret:
    name: kagent-db-credentials
---
apiVersion: postgresql.cnpg.io/v1
kind: DatabaseRole
metadata:
  name: kagent-owner
  namespace: postgres
spec:
  cluster:
    name: postgres
  name: kagent_owner
  login: false
---
# kagent's read/write role, and it has the same gap as `substrate_readwrite`
# below: CNPG creates the role but cannot grant it anything on the tables
# `kagent_owner` creates. Upstream's go/core/pkg/postgressetup/setup.sql (at
# v1.0.0-alpha17) does it with default privileges; these are its statements,
# run once by hand as superuser against the `kagent` database:
#
#   REVOKE ALL ON SCHEMA kagent FROM PUBLIC;
#   GRANT USAGE ON SCHEMA kagent TO kagent_readwrite;
#   ALTER DEFAULT PRIVILEGES FOR ROLE kagent_owner IN SCHEMA kagent
#     GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO kagent_readwrite;
#   ALTER DEFAULT PRIVILEGES FOR ROLE kagent_owner IN SCHEMA kagent
#     GRANT USAGE, SELECT, UPDATE ON SEQUENCES TO kagent_readwrite;
#   ALTER DEFAULT PRIVILEGES FOR ROLE kagent_owner IN SCHEMA kagent
#     GRANT EXECUTE ON ROUTINES TO kagent_readwrite;
#   ALTER DEFAULT PRIVILEGES FOR ROLE kagent_owner IN SCHEMA kagent
#     GRANT USAGE ON TYPES TO kagent_readwrite;
#   -- the alpha13 tables already exist, so default privileges alone miss them:
#   GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA kagent TO kagent_readwrite;
#   GRANT USAGE, SELECT, UPDATE ON ALL SEQUENCES IN SCHEMA kagent TO kagent_readwrite;
#   GRANT EXECUTE ON ALL ROUTINES IN SCHEMA kagent TO kagent_readwrite;
#
# Unlike substrate's, the ON ALL half is not optional here: this schema was
# populated by alpha13, before the role existed. The symptom without it is the
# controller migrating fine as the owner and then failing its first runtime
# query with `permission denied for table ...`.
#
# SINCE ALPHA17 THE LIVE SCHEMA IS `kagent_alpha17` (see database.yaml). The
# statements above were run against it too, with `kagent` replaced by
# `kagent_alpha17`, before the controller first started on it — it was empty
# then, so the default privileges alone cover it.
#
# setup.sql also runs `REVOKE CREATE ON SCHEMA public FROM PUBLIC` for the
# whole database. That is left out: pgvector lives in `public` here (see
# `vectorSchema` in platform/kagent/release.yaml), and both roles only need
# USAGE on it, which PUBLIC keeps.
apiVersion: postgresql.cnpg.io/v1
kind: DatabaseRole
metadata:
  name: kagent-readwrite
  namespace: postgres
spec:
  cluster:
    name: postgres
  name: kagent_readwrite
  login: false
---
apiVersion: postgresql.cnpg.io/v1
kind: DatabaseRole
metadata:
  name: substrate
  namespace: postgres
spec:
  cluster:
    name: postgres
  name: substrate
  login: true
  # Both, because one login serves both of substrate's pools (see
  # platform/substrate/release.yaml). NOINHERIT, as upstream's setup creates its
  # logins: the role's rights are only in effect after the SET ROLE substrate
  # issues, never ambiently on the login itself.
  inRoles:
  - substrate_owner
  - substrate_readwrite
  inherit: false
  passwordSecret:
    name: substrate-db-credentials
---
# Substrate (0.4+) never acts as its login. It runs `SET ROLE` on every new
# connection — `substrate_owner` for the migration pool, `substrate_readwrite`
# for everything else — and refuses a login that is not a member of the role it
# is told to assume. These two are those roles: NOLOGIN, no password, just
# privilege sets. The names are the chart defaults and are restated in
# platform/substrate/release.yaml.
#
# What CNPG cannot declare is the half that makes the split mean anything:
# `substrate_readwrite`'s rights on the tables `substrate_owner` creates. That is
# ALTER DEFAULT PRIVILEGES, which has no CRD field, so it was run once by hand
# as superuser against the `substrate` database — the same statements as
# upstream's pkg/postgressetup/setup.sql:
#
#   REVOKE ALL ON SCHEMA substrate FROM PUBLIC;
#   GRANT USAGE ON SCHEMA substrate TO substrate_readwrite;
#   ALTER DEFAULT PRIVILEGES FOR ROLE substrate_owner IN SCHEMA substrate
#     GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO substrate_readwrite;
#   ALTER DEFAULT PRIVILEGES FOR ROLE substrate_owner IN SCHEMA substrate
#     GRANT USAGE, SELECT, UPDATE ON SEQUENCES TO substrate_readwrite;
#   ALTER DEFAULT PRIVILEGES FOR ROLE substrate_owner IN SCHEMA substrate
#     GRANT EXECUTE ON ROUTINES TO substrate_readwrite;
#   ALTER DEFAULT PRIVILEGES FOR ROLE substrate_owner IN SCHEMA substrate
#     GRANT USAGE ON TYPES TO substrate_readwrite;
#   -- and for whatever already exists, so the order stops mattering:
#   GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA substrate TO substrate_readwrite;
#   GRANT USAGE, SELECT, UPDATE ON ALL SEQUENCES IN SCHEMA substrate TO substrate_readwrite;
#   GRANT EXECUTE ON ALL ROUTINES IN SCHEMA substrate TO substrate_readwrite;
#
# SINCE SUBSTRATE 0.6 THE LIVE SCHEMA IS `substrate_0_6` (see database.yaml),
# so these statements apply with `substrate` replaced by `substrate_0_6`. They
# were run against it before 0.6 first started, which is what avoids the race
# below; the ON ALL half is still the fix if they ever were not.
#
# A rebuilt cluster needs it again. Default privileges only cover tables
# created *afterwards*, and the race is real: on 2026-10-15 a crash-looping
# ate-api-server migrated within seconds of CNPG creating the schema, before
# the SQL ran, so the first three statements alone left all 22 tables
# unreadable. The symptom is the server migrating fine as the owner and then
# dying on `Failed to initialize OpenFGA authz ... list stores: Internal Server
# Error`, which is Postgres saying `permission denied for table store`. The
# three ON ALL grants are what fix it after the fact.
apiVersion: postgresql.cnpg.io/v1
kind: DatabaseRole
metadata:
  name: substrate-owner
  namespace: postgres
spec:
  cluster:
    name: postgres
  name: substrate_owner
  login: false
---
apiVersion: postgresql.cnpg.io/v1
kind: DatabaseRole
metadata:
  name: substrate-readwrite
  namespace: postgres
spec:
  cluster:
    name: postgres
  name: substrate_readwrite
  login: false
