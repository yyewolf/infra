apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: external-dns
spec:
  interval: 30m
  chart:
    spec:
      chart: external-dns
      version: "1.21.1"
      sourceRef:
        kind: HelmRepository
        name: external-dns
      interval: 12h
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  values:
    logLevel: info

    # Gateway API routes and annotated Services, plus DNSEndpoint objects for
    # records that no other resource owns. The DNSEndpoint CRD ships with the
    # chart's crds/ directory.
    sources:
      - crd
      - gateway-httproute
      - service

    policy: sync
    interval: 1m
    triggerLoopOnEvent: true

    # TXT ownership records keep external-dns from touching anything it did not
    # create. The prefix avoids a TXT sitting on the same name as a CNAME.
    registry: txt
    txtOwnerId: ng
    txtPrefix: k8s-

    domainFilters:
      - yewolf.fr
      - hackcorp.net

    provider:
      name: webhook
      webhook:
        image:
          repository: ghcr.io/m0nsterrr/external-dns-webhook-infomaniak
          # renovate: datasource=docker depName=ghcr.io/m0nsterrr/external-dns-webhook-infomaniak
          tag: v0.1.3
        env:
          - name: INFOMANIAK_API_TOKEN
            valueFrom:
              secretKeyRef:
                name: infomaniak-credentials
                key: api-token
          # external-dns defaults to http://localhost:8888 for the provider.
          - name: SERVER_PORT
            value: "8888"
          - name: METRICS_PORT
            value: "8080"
          - name: LOG_LEVEL
            value: info
          - name: DRY_RUN
            value: "false"
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            memory: 128Mi

    resources:
      requests:
        cpu: 20m
        memory: 64Mi
      limits:
        memory: 256Mi
