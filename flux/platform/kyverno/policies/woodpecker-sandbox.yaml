# Which sandbox a pipeline step runs in, and how much privilege it gets.
#
# CI is the one workload here that runs code nobody reviewed — a pipeline is a
# shell script from whichever repository triggered it — so no step runs on plain
# runc.
#
# Every step goes to sysbox, unprivileged, with `hostUsers: false`. This is the
# approach the root cluster used, and it is back because the thing that ruled it
# out here is gone: ng now carries the sysbox extension on all three LAN hosts
# (see talos/patches/sysbox.yaml).
#
# Why one sandbox for everything, when the previous split existed for a reason:
# the split was there because image builds need to run a container engine, and
# neither of the other two sandboxes lets them do that unprivileged. gVisor
# cannot host an inner engine at all — runsc does not implement enough of the
# mount and overlay surface — so those steps went to kata, which meant granting
# them real privilege inside a VM. Sysbox's entire purpose is that a container
# engine runs *unprivileged*: the step's root is root in a user namespace, and
# `hostUsers: false` maps it to an unprivileged uid on the node. So the step
# that used to need the most privilege now needs none, and there is nothing left
# for the split to sort.
#
# Kata remains reachable as an escape hatch for a step that pins it — nested
# virtualisation, or anything that genuinely wants its own kernel — and rule one
# still grants those the privilege that only makes sense inside a VM. It is no
# longer the docker path, so the `plugin-docker-buildx` image fallback that used
# to route builds there is gone: a buildx step now lands on sysbox like anything
# else, which is where it works unprivileged.
#
# `sysbox-runc` is no longer a special case either. It used to be a root-cluster
# name aliased to gVisor precisely because sysbox did not exist here; now it
# resolves to the real thing and a step pinning it falls into rule two like
# every other step. See infrastructure/gvisor/compat-sysbox-runc.yaml.
#
# The two rules are mutually exclusive by construction: both read
# `request.object`, which is the *original* admission object, so rule one's
# mutation cannot make rule two fire as well.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: woodpecker-sandbox
spec:
  rules:
  # --- explicit kata pin: kata, privileged ----------------------------------
  - name: pinned-kata-steps
    match:
      any:
      - resources:
          kinds:
          - Pod
          namespaces:
          - woodpecker
          # The label the agent stamps on every pod it creates for a task. It
          # is what separates a pipeline step from woodpecker's own server and
          # agent Deployments in the same namespace — those stay on runc and
          # unprivileged.
          selector:
            matchExpressions:
            - key: woodpecker-ci.org/task-uuid
              operator: Exists
    # The pin, and only the pin. A step lands here by saying so in its own
    # backend_options, which is the honest signal and now the only one: with
    # sysbox as the default, a step that says nothing gets a sandbox that can
    # already run a container engine, so there is nothing left to guess at from
    # the image name.
    #
    # What used to be here was a fallback matching the `plugin-docker-buildx`
    # image, because a buildx step in an untouched pipeline pins nothing and
    # sending it to gVisor unprivileged was a broken build with a confusing
    # error. Under sysbox that step just works, so the heuristic is gone rather
    # than kept as a second way to reach a privileged VM.
    preconditions:
      any:
      - key: "{{ request.object.spec.runtimeClassName || '' }}"
        operator: AnyIn
        value:
        - kata
        - kata-qemu
    mutate:
      patchStrategicMerge:
        spec:
          # runtimeClassName is deliberately not written here. The precondition
          # already guarantees it is `kata` or `kata-qemu`, and the difference
          # between them is the step's to make: Cloud Hypervisor boots faster
          # and costs less memory, but does not pass the CPU virt flag through,
          # so a step wanting nested virt pins kata-qemu. Rewriting it to `kata`
          # would silently take that away.
          #
          # No `hostUsers: false` here either, deliberately: the pod is a VM,
          # there is no host uid to map its root to, and the kubelet rejects the
          # combination outright. Inside kata privilege is granted rather than
          # emulated, and the isolation moves down a layer instead.
          containers:
          - (name): "*"
            securityContext:
              privileged: true
              # Not redundant: the kubelet rejects a container that is
              # privileged with allowPrivilegeEscalation explicitly false, so
              # anything woodpecker sets to false has to be raised with it or
              # the pod fails to start rather than failing to be admitted.
              allowPrivilegeEscalation: true
          initContainers:
          - (name): "*"
            securityContext:
              privileged: true
              allowPrivilegeEscalation: true
  # --- everything else: sysbox, unprivileged --------------------------------
  - name: other-steps-to-sysbox
    match:
      any:
      - resources:
          kinds:
          - Pod
          namespaces:
          - woodpecker
          selector:
            matchExpressions:
            - key: woodpecker-ci.org/task-uuid
              operator: Exists
    # The exact negation of rule one. Keep the two lists in step: a value added
    # above and not removed from here is a pod mutated twice, and the second
    # write wins.
    #
    # Note what is *not* excluded — an unset runtimeClassName, `gvisor`, or
    # `sysbox-runc` all land here and are rewritten to `sysbox`. A pipeline
    # cannot opt out of the sandbox by naming a weaker one; the only pin this
    # policy honours is the kata pair above.
    preconditions:
      all:
      - key: "{{ request.object.spec.runtimeClassName || '' }}"
        operator: AnyNotIn
        value:
        - kata
        - kata-qemu
    mutate:
      patchStrategicMerge:
        spec:
          runtimeClassName: "sysbox"
          # The half of sysbox that makes the privilege drop below safe rather
          # than merely strict. Without it the step's root is uid 0 on the node
          # and only namespaces stand between it and the host; with it the
          # kubelet maps the pod into a user namespace, so container root is an
          # unprivileged uid outside. A container engine inside the step still
          # works — that is the whole reason this cluster carries sysbox.
          hostUsers: false
          # Privilege is not granted here and must not be: under sysbox a step
          # that needs a container engine does not need privilege to run one,
          # and `require-kata-for-privileged` would reject the pod anyway.
          # Dropped explicitly rather than left alone — a pipeline cannot ask
          # for privilege by writing it into its own backend_options.
          containers:
          - (name): "*"
            securityContext:
              privileged: false
              allowPrivilegeEscalation: false
          initContainers:
          - (name): "*"
            securityContext:
              privileged: false
              allowPrivilegeEscalation: false
