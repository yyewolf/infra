apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: uctf-mgmt
spec:
  interval: 10m
  releaseName: uctf-mgmt
  chart:
    spec:
      chart: vcluster
      version: 0.36.1
      sourceRef:
        kind: HelmRepository
        name: vcluster
        namespace: uctf
      interval: 30m
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    # The k8s distro is the only one vcluster 0.36 ships, and `enabled: true`
    # is what selects it. Leave `version` unset so the control plane image tag
    # (v1.36.0, the chart default) is used verbatim — setting `version` here
    # rewrites the tag without its `v` prefix and the pull fails.
    controlPlane:
      distro:
        k8s:
          enabled: true
      statefulSet:
        persistence:
          volumeClaim:
            # 3-replica default class. A management cluster's control plane is
            # the source of truth for everything inside it, so durability
            # against node loss beats the single-replica `longhorn-yolo` used
            # for the databases. Three replicas also sidesteps Longhorn's
            # block-if-contains-last-replica during a `talos.sh upgrade` drain.
            storageClass: longhorn
            size: 5Gi

    # Sync. vcluster's own defaults already push services, endpoints,
    # endpointSlices, pods, configmaps and secrets to the host (so a workload
    # created inside the management cluster lands as a real pod in this
    # namespace and is reachable by name). The additions below are the "and
    # all" half: cert-manager (reusing the host's controller rather than
    # running a second copy inside the vcluster), plus PV/PVC and
    # NetworkPolicy toHost sync and storageClass/RuntimeClass
    # fromHost import so the management cluster can provision storage and pin
    # a sandbox the same way a host workload can.
    sync:
      toHost:
        # PVCs are on by default (a vcluster workload with a volume needs its
        # claim to land on the host for the host provisioner to bind), stated
        # explicitly so a later default flip does not silently change it.
        persistentVolumeClaims:
          enabled: true
        # PVs are off by default. Enabling lets the management cluster own the
        # full PVC<->PV pair: a statically-provisioned PV declared in the
        # vcluster syncs to the host and binds a synced claim. Dynamic
        # provisioning does not need this (the host provisioner creates the PV
        # from the claim anyway), so this is for volumes the vcluster pins by
        # hand. The chart only adds persistentvolumes create/delete/patch/
        # update/watch to its ClusterRole when this is true.
        persistentVolumes:
          enabled: true
        # Standard Kubernetes NetworkPolicies (networking.k8s.io/v1), not
        # CiliumNetworkPolicies. Cilium implements the K8s NetworkPolicy API,
        # so one declared in the vcluster and synced here is enforced by Cilium
        # at the host endpoint -- a second layer on top of the
        # CiliumNetworkPolicies in network-policy.yaml. Use CiliumNetworkPolicy
        # for anything Cilium-specific (L7, FQDN, entities); this is the
        # portable subset a management cluster can carry if it ever moves.
        networkPolicies:
          enabled: true
      fromHost:
        # Host StorageClasses (longhorn, longhorn-ha, longhorn-yolo, longhorn-ci)
        # so a PVC created in the vcluster can name one. The default is `auto`,
        # which only turns on with the virtual scheduler -- and the scheduler is
        # off here (the host schedules the synced pods), so `auto` resolves to
        # false and the classes would never appear inside the vcluster. `true`
        # imports them unconditionally. The chart only adds the storageclasses
        # get/list/watch to its ClusterRole on an explicit `true`.
        storageClasses:
          enabled: true
        # Host RuntimeClasses (kata, gvisor, sysbox-runc, nvidia) so a vcluster
        # workload can pin a sandbox. The RuntimeClass admission plugin runs on
        # the host for the synced pod, so the class must exist there -- which it
        # does -- and importing it here is what lets the vcluster's own
        # admission accept the name. A kata/gvisor pod then lands on the host
        # and is scheduled per the class's nodeSelector (control-plane for both).
        runtimeClasses:
          enabled: true
        # Real host nodes. The chart default (`enabled: false`) creates fake
        # nodes -- only the name is real, capacity/IP/images are randomly
        # generated -- and only materialises a node once a synced pod actually
        # lands on it. With one StatefulSet replica that meant a single node
        # (cp-1) regardless of how many the host has. `enabled: true` swaps in
        # real node info (capacity, labels, taints, obfuscated node IP by
        # default), and `selector.all: true` makes every host node appear
        # instead of only the ones running a vcluster pod. The chart adds a
        # cluster-scoped nodes get/list/watch to its ClusterRole for this;
        # syncBackChanges stays false, so the vcluster cannot mutate host node
        # labels or taints.
        nodes:
          enabled: true
          selector:
            all: true

    # Reuse the host cert-manager. Certificates and Issuers created in the
    # vcluster sync to this namespace (realised by the host controller);
    # ClusterIssuers are imported back read-only so the vcluster can reference
    # the existing `letsencrypt-*` issuers without a second copy. The chart's
    # sync.toHost/fromHost defaults under here are already the right shape, so
    # the single `enabled: true` is enough.
    integrations:
      # Proxy the host metrics-server so `kubectl top` works inside the
      # vcluster. nodes and pods both on: the management cluster needs to see
      # real usage of the workloads it drives, not just its own control plane.
      # The chart adds a metrics.k8s.io pods rule to its Role for this and a
      # nodes rule to its ClusterRole (cluster-scoped read).
      metricsServer:
        enabled: true
        nodes: true
        pods: true

    # The chart's ResourceQuota and LimitRange are namespace-wide, which in
    # this shared namespace would cap basilic, safran and fenouil alongside
    # the management workloads (count/pods: 20, requests.storage: 100Gi, …) —
    # a shared limit the other three never opted into. The host cluster's own
    # capacity bounds the vcluster instead.
    policies:
      resourceQuota:
        enabled: false
      limitRange:
        enabled: false
      # The chart's own NetworkPolicy is off by default; uctf-vcluster in
      # network-policy.yaml replaces it in Cilium terms. The control plane has
      # to reach the host kube-apiserver, which is host-networked and so needs
      # host/remote-node entities (the gotcha documented on uctf-basilic-api),
      # not the chart's port-only egress rule that a standard NetworkPolicy
      # would not match against reserved:host reliably.
      networkPolicy:
        enabled: false
