# Cilium's default-deny is per-direction and per-endpoint: a rule with only
# `egress` leaves ingress wide open, so ingress is spelled out here. The
# metrics endpoint (8443) is deliberately not opened — nothing scrapes it yet;
# add a rule when prometheus lands.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: cnmsql
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: cnmsql
  ingress:
  # Validating webhook for Cluster/Backup/Restore, plus the UPDATE hook on
  # instance pods.
  #
  # `kube-apiserver` alone does not work here and the failure is total, not
  # intermittent. The API server runs host-network on the control planes, and
  # its connection into the pod network enters via that node's `cilium_host`
  # router address — so the source Cilium sees is 10.244.<n>.<x> with identity
  # `reserved:remote-node` (or `reserved:host` when the apiserver and the
  # operator happen to share a node), never `reserved:kube-apiserver`. The
  # symptom is a 10s admission timeout with `Policy denied DROPPED (TCP Flags:
  # SYN)` to :9443 in Hubble on the operator's node, and it takes the operator
  # down with it — every reconcile blocks the full webhook timeout, the worker
  # pool saturates, /healthz stops answering and the kubelet kills the pod on
  # its liveness probe (exit 137, which reads like an OOM and is not one).
  #
  # cnpg has the same shape and works only because its rule also lists
  # `cluster`, which subsumes `remote-node`. Naming the two node entities is
  # tighter than that: nothing but the API server calls these admission
  # endpoints, so pod identities do not need to be in scope.
  - fromEntities:
    - kube-apiserver
    - remote-node
    - host
    toPorts:
    - ports:
      - port: "9443"
        protocol: TCP
  egress:
  - toEntities:
    - kube-apiserver
    toPorts:
    - ports:
      - port: "6443"
        protocol: TCP
  - toEndpoints:
    - matchLabels:
        io.kubernetes.pod.namespace: kube-system
        k8s-app: kube-dns
    toPorts:
    - ports:
      - port: "53"
        protocol: UDP
      - port: "53"
        protocol: TCP
      rules:
        dns:
        - matchPattern: "*"
  # The operator drives the instances it created — MySQL (3306) and the
  # instance manager's API — in whatever namespace declared the Cluster, so
  # this can only be bounded to the cluster. Physical backups to S3 are the
  # instance pods' egress, not the operator's; nothing here reaches `world`.
  - toEntities:
    - cluster
  - toFQDNs:
    - matchName: "s3.swiss-backup02.infomaniak.com"
    toPorts:
    - ports:
      - port: "443"
        protocol: TCP
