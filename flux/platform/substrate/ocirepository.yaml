# GHCR-only. The version is not free: docs/architecture/credential-injection.md
# in kagent v1.0.0-alpha5 opens with "Kagent requires Substrate v0.3.0-alpha1",
# and both the kagent and kagent-crds charts declare exactly that version for
# their vendored copies. Bumping this without bumping kagent is not a patch —
# 0.3.0-alpha1 alone renamed the credential URI authority from `kubernetes.io`
# to `k8s.io`, which only works because kagent's compiler moved with it.
#
# Renovate reads `ref.tag` here, and will offer every substrate pre-release
# (they ship near-daily). Take the one kagent's Chart.yaml names, not the
# newest.
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: substrate
  namespace: ate-system
spec:
  interval: 1h
  url: oci://ghcr.io/kagent-dev/substrate/helm/substrate
  layerSelector:
    mediaType: "application/vnd.cncf.helm.chart.content.v1.tar+gzip"
    operation: copy
  ref:
    tag: 0.5.0-alpha1
    digest: sha256:91c95167a95f83b62be00cd0413cc15574f116fbe81f9de4621f29833d479327
