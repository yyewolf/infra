# Pushes the bare password rather than a rendered DSN, which is the difference
# from the umami/vaultwarden stores beside this one. K7 takes its connection
# details as five discrete env vars (Database__Server, __Port, __Name,
# __UserID, __Password) and the chart reads only the password from a secret, so
# there is no URL to assemble — and correspondingly nothing to urlquery-escape.
#
# The key name is `database-password` because that is what the chart's
# `k7.database.passwordKey` helper resolves to for `database.mode: external`.
# Renaming it means the pod starts with an empty password and Postgres rejects
# the login.
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: k7-db
  namespace: postgres
spec:
  refreshInterval: 1h
  deletionPolicy: None
  secretStoreRefs:
  - name: k7
    kind: SecretStore
  selector:
    secret:
      name: k7-db-credentials
  data:
  - match:
      secretKey: password
      remoteRef:
        remoteKey: k7-db
        property: database-password
