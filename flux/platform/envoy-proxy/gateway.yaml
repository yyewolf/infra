apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: envoy-gateway
spec:
  gatewayClassName: eg
  # Apps do not get to bolt listeners onto this Gateway by default — the
  # Gateway API default is to allow no ListenerSets at all, and it stays that
  # way for everything not named here. `portfoliosh` opens SSH, `stalwart`
  # opens the mail ports. Both declare their ListenerSets in their own
  # directories and this is the consent half.
  #
  # Selector rather than `All`, so a new namespace cannot open a port on the
  # public edge by creating an object in its own directory. The label is the
  # one the kubelet stamps on every namespace.
  allowedListeners:
    namespaces:
      from: Selector
      selector:
        matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: In
          values:
          - portfoliosh
          - stalwart
  listeners:
  - protocol: HTTP
    port: 80
    name: http
    # `Same`, not `All`: the only thing that belongs on the plaintext listener
    # is the redirect in redirect.yaml, which lives in this namespace. With
    # `All` any app could attach a route here and serve itself in the clear —
    # the listener would accept it, and nothing else in the repo would object.
    # An app that wants public traffic attaches to `https` and gets the
    # redirect for free.
    allowedRoutes:
      namespaces:
        from: Same
  - protocol: HTTPS
    port: 443
    name: https
    tls:
      mode: Terminate
      certificateRefs:
      - kind: Secret
        group: ""
        name: hackcorp-host-secret
        namespace: cert-manager
      - kind: Secret
        group: ""
        name: yewolf.fr
        namespace: cert-manager
      - kind: Secret
        group: ""
        name: uctf.io
        namespace: cert-manager
    allowedRoutes:
      namespaces:
        from: All
