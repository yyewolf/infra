# Copied byte-for-byte from the root cluster's
# applications/monitoring/cluster/umami/secret-sops.yaml, not regenerated: the
# APP_SECRET here is the salt umami hashes session identifiers with, so a fresh
# one would silently reset every visitor session the moved data describes.
#
# It still carries the root cluster's DATABASE_URL alongside it. That key is
# dead — the ng deployment takes DATABASE_URL from the `umami-db` secret that
# ESO pushes — and it is still here because dropping a key from a SOPS file
# means decrypting and re-encrypting the whole thing. Drop it the next time
# APP_SECRET is rotated.
