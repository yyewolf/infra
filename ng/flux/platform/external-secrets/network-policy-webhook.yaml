apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: webhook
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: external-secrets-webhook
  ingress:
  # Validating and conversion webhooks are called by the apiserver on 10250;
  # kubelet probes come from the node itself.
  - fromEntities:
    - kube-apiserver
    - remote-node
    - host
    toPorts:
    - ports:
      - port: "10250"
        protocol: TCP
      - port: "8081"
        protocol: TCP
  egress:
  - toEntities:
    - kube-apiserver
    toPorts:
    - ports:
      - port: "6443"
        protocol: TCP
  - toEndpoints:
    - matchLabels:
        io.kubernetes.pod.namespace: kube-system
        k8s-app: kube-dns
    toPorts:
    - ports:
      - port: "53"
        protocol: UDP
      - port: "53"
        protocol: TCP
