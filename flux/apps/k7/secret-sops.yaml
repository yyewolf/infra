# The HMAC secret K7 mixes into API-key hashes. It is in git rather than left to
# the chart to mint because the chart would generate a fresh one on any install
# that lost its Secret, and every API key ever issued — including the ones the
# native clients hold — is invalidated the moment it changes.
#
# Not a password: nothing logs in with it and it is never shown in the UI.
