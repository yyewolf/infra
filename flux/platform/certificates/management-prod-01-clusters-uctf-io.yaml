apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: management-prod-01.clusters.uctf.io
spec:
  secretName: management-prod-01.clusters.uctf.io
  privateKey:
    algorithm: RSA
    encoding: PKCS1
    size: 4096
  duration: 2160h # 90d
  renewBefore: 360h # 15d
  isCA: false
  usages:
  - server auth
  - client auth
  subject:
    organizations:
    - uctf
  dnsNames:
  - 'management-prod-01.clusters.uctf.io'
  - '*.management-prod-01.clusters.uctf.io'
  issuerRef:
    name: infomaniak
    kind: ClusterIssuer
