# Cilium's default-deny is per-direction and per-endpoint, so both directions
# are spelled out.
#
# This covers the plugin Deployment only. The part of the plugin that actually
# talks to S3 is a *sidecar* the operator injects into each Postgres instance
# pod, so it lives in the postgres namespace and is covered by that namespace's
# policy — which is where the toFQDNs rule for the bucket had to go.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: plugin-barman-cloud
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: plugin-barman-cloud
  ingress:
  # The operator calls the plugin over gRPC (CNPG-I) with mTLS, and the
  # instance sidecars call it too. Both are in-cluster; the operator is next
  # door in cnpg-system and the sidecars are in whichever namespace declared a
  # Cluster, which cannot be enumerated here.
  - fromEntities:
    - cluster
    toPorts:
    - ports:
      - port: "9090"
        protocol: TCP
  egress:
  # Watches ObjectStore resources and reports status.
  - toEntities:
    - kube-apiserver
    toPorts:
    - ports:
      - port: "6443"
        protocol: TCP
  - toEndpoints:
    - matchLabels:
        io.kubernetes.pod.namespace: kube-system
        k8s-app: kube-dns
    toPorts:
    - ports:
      - port: "53"
        protocol: UDP
      - port: "53"
        protocol: TCP
  # No `world`. This process does not upload anything itself — it hands
  # configuration to the sidecars, and they do the talking to S3.
