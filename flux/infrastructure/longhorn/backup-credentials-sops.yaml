# Longhorn backup target credentials and encryption key.
#
# Swiss Backup tenant sb_project_SBI-TS068103, bucket `default`, prefix `/longhorn/`.
# Longhorn talks to this endpoint directly — the manager and the backing-image
# manager pods, not the engine pods — so network-policy.yaml grants the whole
# namespace egress to s3.swiss-backup02.infomaniak.com.
#
# AWS_ENDPOINTS enables path-style addressing automatically (no VIRTUAL_HOSTED_STYLE
# needed), which is required because Swiss Backup is not an AWS service and does not
# resolve bucket-in-hostname requests.
#
# CRYPTO_KEY_VALUE is the AES-256-GCM passphrase Longhorn uses to encrypt every
# backup block. Without it the backups are unreadable; store it outside the cluster.
#
# Encrypted with SOPS under the repo's two PGP keys. `.sops.yaml` matches this
# file by its `-sops.yaml` suffix and encrypts `stringData` only.
apiVersion: v1
kind: Secret
metadata:
    name: longhorn-backup-s3
type: Opaque
stringData:
    AWS_ACCESS_KEY_ID: ENC[AES256_GCM,data:aVZlVfVrAJXSTxwpwQZY969QzFee7KtcmfG1ktm9e+E=,iv:Ma/QbT6onn8iiY80NKcDmih68sjpm1eO6Bpm32QVodw=,tag:IYtFf+bZzSt1lGy9UXdFoA==,type:str]
