# This one carries two keys that have nothing to do with Postgres, which needs
# explaining.
#
# safran's chart builds its runtime Secret out of values, and its `migrate` Job
# is a pre-install hook — so on a fresh install Helm creates the hook pod
# before it creates the Secret the pod mounts, and the release never gets off
# the ground (`secret "safran-runtime" not found`, CreateContainerConfigError).
# The root cluster never hit this because that release has only ever run
# pre-*upgrade*, by which point the Secret was already there from install.
#
# The way out is to hand the chart a Secret that already exists —
# `secrets.existingSecret` — which means something other than Helm has to
# create it, with all three keys in it. The DSN can only come from here, so
# the other two come from here too: two PushSecrets writing different keys of
# one Secret would race, and a Secret half-owned by Flux and half by ESO
# flaps as each controller prunes the other's key.
#
# DatabaseRole reads only username and password and ignores the rest.
apiVersion: v1
kind: Secret
metadata:
    name: safran-db-credentials
    namespace: postgres
type: Opaque
stringData:
    username: ENC[AES256_GCM,data:Hz56vMHn,iv:w4NRI3V6tkx2hHMMf/ww3YX0j3HOzLYXl2xxoxH0Nks=,tag:XGs/JdkJ/ZXjlPfe6H3wuA==,type:str]
