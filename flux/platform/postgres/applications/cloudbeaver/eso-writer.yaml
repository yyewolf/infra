# The identity the SecretStore authenticates as when it writes the superuser
# credentials into the cloudbeaver namespace.
#
# Its own ServiceAccount rather than reusing another app's: those are created by
# different Flux Kustomizations, and sharing one would make this directory
# silently depend on that one applying first. One SA per app keeps each
# directory self-contained, and the SA has no permissions beyond the RoleBinding
# below.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: eso-push-writer-cloudbeaver
  namespace: postgres
---
# In the cloudbeaver namespace, not this one: this is what the SA is allowed to
# do at the far end of the push. Secrets only, and only the verbs a PushSecret
# needs to create and keep one up to date.
#
# The cloudbeaver namespace is created by apps/cloudbeaver, so this
# Kustomization stays in retry until that one has reconciled. That is the same
# ordering every other directory here has and it resolves on its own.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: eso-push-writer-postgres
  namespace: cloudbeaver
rules:
- apiGroups: [""]
  resources: [secrets]
  verbs: [get, list, watch, create, update, patch]
- apiGroups: [authorization.k8s.io]
  resources: [selfsubjectrulesreviews]
  verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: eso-push-writer-postgres
  namespace: cloudbeaver
subjects:
- kind: ServiceAccount
  name: eso-push-writer-cloudbeaver
  namespace: postgres
roleRef:
  kind: Role
  name: eso-push-writer-postgres
  apiGroup: rbac.authorization.k8s.io
