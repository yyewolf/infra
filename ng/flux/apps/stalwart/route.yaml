# mail-ng, not mail. `mail.yewolf.fr` is still the running mail server on the
# root cluster and its A record was created by hand there, so external-dns here
# would not adopt it anyway (no `k8s-` TXT owner record for it) — but claiming
# the name in this file would be one accidental record away from pointing live
# mail at an empty server. The cutover is: delete the manual record on the root
# cluster, then change this hostname.
#
# Note this must match the hostname configured *inside* Stalwart: the WebUI is
# only reachable on the configured hostname over HTTPS, and loading it under any
# other name gets as far as the sign-in page and then fails the OAuth callback.
# So set mail-ng.yewolf.fr in the setup wizard now, and change both together at
# cutover.
#
# Backend is plain HTTP on the management port — the edge terminates TLS with
# the *.yewolf.fr certificate, so Stalwart's own TLS is not in this path.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: stalwart
spec:
  parentRefs:
  - name: envoy-gateway
    namespace: envoy-gateway-system
    sectionName: https
  hostnames:
  - "mail-ng.yewolf.fr"
  rules:
  - backendRefs:
    - group: ""
      kind: Service
      name: stalwart
      port: 8080
      weight: 1
    matches:
    - path:
        type: PathPrefix
        value: /
