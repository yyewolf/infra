apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: uctf.io-wildcard
spec:
  secretName: uctf.io-wildcard
  privateKey:
    algorithm: RSA
    encoding: PKCS1
    size: 4096
  duration: 2160h # 90d
  renewBefore: 360h # 15d
  isCA: false
  usages:
    - server auth
    - client auth
  subject:
    organizations:
      - uctf
  dnsNames:
    - '*.uctf.io'
  issuerRef:
    name: infomaniak
    kind: ClusterIssuer
