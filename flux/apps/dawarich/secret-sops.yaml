# Rails' SECRET_KEY_BASE. It derives the keys that sign session cookies and
# encrypt ActiveRecord attributes, so it is in git rather than generated per
# install: a fresh one logs every session out, and anything Rails encrypted with
# the old one — including the OIDC and 2FA material if those are ever turned on
# — stops being decryptable.
#
