apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: immich
  namespace: album
spec:
  interval: 5m
  chart:
    spec:
      chart: immich
      version: 0.13.1
      sourceRef:
        kind: HelmRepository
        name: immich-charts
        namespace: album
  values:
    controllers:
      main:
        containers:
          main:
            image:
              tag: v3.1.0
            env:
              REDIS_HOSTNAME: redis.album.svc
              REDIS_PORT: "6379"
              DB_HOSTNAME: postgres-rw.postgres.svc.cluster.local
              DB_USERNAME: immich
              DB_DATABASE_NAME: immich
    immich:
      persistence:
        library:
          existingClaim: immich-library
    machine-learning:
      persistence:
        cache:
          enabled: true
          type: persistentVolumeClaim
          size: 10Gi
          accessMode: ReadWriteOnce
          storageClass: longhorn-yolo
  valuesFrom:
  - kind: Secret
    name: immich-db
    valuesKey: DATABASE_PASSWORD
    targetPath: controllers.main.containers.main.env.DB_PASSWORD
