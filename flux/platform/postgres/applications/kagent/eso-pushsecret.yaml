# Both pushes render a full DSN rather than discrete username/password keys,
# because both consumers take one: the kagent controller reads
# `database.postgres.urlFile` (a mounted key of the pushed Secret) and
# ate-api-server reads ATE_API_POSTGRES_CONNECTION_STRING.
#
# `urlquery` on both halves is the convention here and it earns its keep in this
# directory more than most: these passwords are generated alphanumeric today,
# but a rotation to something containing `@`, `:` or `/` would otherwise
# produce a DSN that parses into a different host with no error anywhere.
#
# sslmode=require, matching every other DSN in this tree — CNPG serves TLS with
# its own CA, so `require` encrypts without asking the client to verify a root
# it does not have.
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: kagent-db
  namespace: postgres
spec:
  refreshInterval: 1h
  deletionPolicy: None
  secretStoreRefs:
  - name: kagent
    kind: SecretStore
  selector:
    secret:
      name: kagent-db-credentials
  template:
    engineVersion: v2
    data:
      url: postgres://{{ .username | urlquery }}:{{ .password | urlquery }}@postgres-rw.postgres.svc.cluster.local:5432/kagent?sslmode=require
  data:
  # The remote key is the Secret name and the property is the key inside it, so
  # this lands as `kagent-db` in the `kagent` namespace with one key, `url` —
  # which is exactly what platform/kagent/release.yaml projects to
  # /etc/kagent/db/url. Renaming either end breaks a mount, not a lookup, so
  # the pod hangs on a missing volume rather than logging anything useful.
  - match:
      secretKey: url
      remoteRef:
        remoteKey: kagent-db
        property: url
---
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: substrate-db
  namespace: postgres
spec:
  refreshInterval: 1h
  deletionPolicy: None
  secretStoreRefs:
  - name: substrate
    kind: SecretStore
  selector:
    secret:
      name: substrate-db-credentials
  template:
    engineVersion: v2
    data:
      connection-string: postgresql://{{ .username | urlquery }}:{{ .password | urlquery }}@postgres-rw.postgres.svc.cluster.local:5432/substrate?sslmode=require
  data:
  # `postgresql://` rather than `postgres://` for this one, matching the form
  # the substrate chart's own default connection string uses. Both are valid
  # libpq URI schemes; there is no reason to differ from what upstream tested.
  #
  # This key is read by a `secretKeyRef` in the postRenderer patch in
  # platform/substrate/release.yaml, which is what overrides the passwordless
  # placeholder the chart puts in a ConfigMap. If this push has not landed, that
  # patch resolves to a missing Secret and ate-api-server does not start —
  # which is the right way round: it cannot silently fall back to the
  # credential-free DSN.
  - match:
      secretKey: connection-string
      remoteRef:
        remoteKey: substrate-db
        property: connection-string
