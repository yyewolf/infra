apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: dawarich
  namespace: postgres
spec:
  provider:
    kubernetes:
      remoteNamespace: dawarich
      server:
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
      auth:
        # Must match the ServiceAccount in eso-writer.yaml, which is the one the
        # RoleBinding in the dawarich namespace grants. One SA per app — naming
        # another directory's SA here authenticates as an identity with no
        # rights at the far end, and the store fails validation with the
        # unhelpful "client is not allowed to get secrets".
        serviceAccount:
          name: eso-push-writer-dawarich
