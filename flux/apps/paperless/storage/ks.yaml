apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: paperless-storage
  namespace: flux-system
spec:
  dependsOn:
  - name: longhorn
  interval: 10m
  path: ./flux/apps/paperless/storage
  prune: true
  retryInterval: 1m
  sourceRef:
    kind: GitRepository
    name: flux-system
