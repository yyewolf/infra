apiVersion: v1
kind: ServiceAccount
metadata:
  name: eso-push-writer
  namespace: postgres
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: eso-push-writer
  namespace: album
rules:
- apiGroups: [""]
  resources: [secrets]
  verbs: [get, list, watch, create, update, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: eso-push-writer
  namespace: album
subjects:
- kind: ServiceAccount
  name: eso-push-writer
  namespace: postgres
roleRef:
  kind: Role
  name: eso-push-writer
  apiGroup: rbac.authorization.k8s.io
