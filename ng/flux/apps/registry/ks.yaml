apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: registry
  namespace: flux-system
spec:
  dependsOn:
  - name: envoy-proxy
  - name: longhorn
  interval: 10m
  path: ./ng/flux/apps/registry
  prune: false
  retryInterval: 1m
  sourceRef:
    kind: GitRepository
    name: flux-system
