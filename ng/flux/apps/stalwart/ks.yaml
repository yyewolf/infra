apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: stalwart
  namespace: flux-system
spec:
  # recovery-admin-sops.yaml — without this the encrypted Secret is applied
  # verbatim and the bootstrap credential is an unusable ciphertext string
  # rather than an error.
  decryption:
    provider: sops
    secretRef:
      name: sops-gpg
  dependsOn:
  # envoy-proxy owns the Gateway this app's HTTPRoute attaches to; longhorn
  # provisions the volume the whole server lives on. certificates creates the
  # infomaniak ClusterIssuer the Certificate resource references.
  - name: envoy-proxy
  - name: longhorn
  - name: certificates
  interval: 10m
  path: ./ng/flux/apps/stalwart
  prune: true
  retryInterval: 1m
  sourceRef:
    kind: GitRepository
    name: flux-system
