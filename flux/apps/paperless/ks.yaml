apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: paperless
  namespace: flux-system
spec:
  decryption:
    provider: sops
    secretRef:
      name: sops-gpg
  dependsOn:
  - name: paperless-storage
  - name: envoy-proxy
  interval: 10m
  path: ./flux/apps/paperless
  prune: true
  retryInterval: 1m
  sourceRef:
    kind: GitRepository
    name: flux-system
