# Separate from the `kyverno` Kustomization that installs the operator, not
# folded into it: a ClusterPolicy is rejected until its CRD exists, and more
# importantly this is the boundary where Kyverno stops being inert. Installing
# the controllers registers no webhooks at all; applying the first policy is
# what puts an admission webhook in front of pod creation. Keeping them apart
# means `flux suspend kustomization kyverno-policies` — or reverting this one
# directory — takes the cluster back to that inert state without uninstalling
# anything.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: kyverno-policies
  namespace: flux-system
spec:
  dependsOn:
  - name: kyverno
  interval: 10m
  path: ./ng/flux/platform/kyverno/policies
  prune: false
  retryInterval: 1m
  sourceRef:
    kind: GitRepository
    name: flux-system
