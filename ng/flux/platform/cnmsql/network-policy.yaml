# Cilium's default-deny is per-direction and per-endpoint: a rule with only
# `egress` leaves ingress wide open, so ingress is spelled out here. The
# metrics endpoint (8443) is deliberately not opened — nothing scrapes it yet;
# add a rule when prometheus lands.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: cnmsql
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: cnmsql
  ingress:
  # Validating webhook for Cluster/Backup/Restore.
  - fromEntities:
    - kube-apiserver
    toPorts:
    - ports:
      - port: "9443"
        protocol: TCP
  egress:
  - toEntities:
    - kube-apiserver
    toPorts:
    - ports:
      - port: "6443"
        protocol: TCP
  - toEndpoints:
    - matchLabels:
        io.kubernetes.pod.namespace: kube-system
        k8s-app: kube-dns
    toPorts:
    - ports:
      - port: "53"
        protocol: UDP
      - port: "53"
        protocol: TCP
      rules:
        dns:
        - matchPattern: "*"
  # The operator drives the instances it created — MySQL (3306) and the
  # instance manager's API — in whatever namespace declared the Cluster, so
  # this can only be bounded to the cluster. Physical backups to S3 are the
  # instance pods' egress, not the operator's; nothing here reaches `world`.
  - toEntities:
    - cluster
  - toFQDNs:
    - matchName: "s3.swiss-backup02.infomaniak.com"
    toPorts:
    - ports:
      - port: "443"
        protocol: TCP
