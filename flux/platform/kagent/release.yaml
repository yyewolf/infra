apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kagent
spec:
  # The chart templates `kagent-ui` as `<release>-ui` and the oauth2-proxy
  # values hardcode that name; more importantly `substrateWorkerPool` and the
  # controller ConfigMap derive names from it. Keep it `kagent`.
  releaseName: kagent
  interval: 30m
  # ---------------------------------------------------------------------
  # Why this is `chart.spec` and not `chartRef`
  # ---------------------------------------------------------------------
  # Every other OCI chart in this repo's platform/ tree uses an OCIRepository
  # plus `chartRef`, which pins a sha256 digest. This one cannot, and the reason
  # is a collision between Flux and this chart:
  #
  #   helm install failed ... error while running post render on files:
  #     yaml: unmarshal errors: line 13: mapping key
  #     "app.kubernetes.io/version" already defined at line 10
  #
  # and before that workaround was attempted:
  #
  #   ServiceAccount "kagent-controller" is invalid: metadata.labels:
  #   Invalid value: "1.0.0-alpha1+1b4621d58c71": a valid label must be an
  #   empty string or consist of alphanumeric characters, '-', '_' or '.'
  #
  # helm-controller loading a chart through `chartRef` appends the artifact
  # digest to the chart version as SemVer build metadata, so `.Chart.Version` at
  # render time is `1.0.0-alpha1+1b4621d58c71`. `+` is legal in SemVer and
  # illegal in a label value. The chart is half-prepared for it: in
  # `kagent.labels`, `helm.sh/chart` pipes through `| replace "+" "_"` and
  # `app.kubernetes.io/version` does not, so exactly one label is invalid — on
  # every object the chart creates.
  #
  # THE OBVIOUS WORKAROUND DOES NOT WORK, and it is worth recording why.
  # `.Values.labels` is emitted last in that helper, so `labels:
  # {app.kubernetes.io/version: ""}` does override it in the rendered text, and
  # the API server accepts the resulting duplicate YAML key (checked with
  # `kubectl apply --dry-run=server`). But the API server is not the component
  # that parses it first: helm-controller runs its own post-render pass over the
  # rendered manifests with a strict YAML parser that rejects a repeated mapping
  # key outright, so the install never gets far enough to apply anything. Any
  # fix that relies on emitting a duplicate key is dead for this reason.
  #
  # A `postRenderers` patch would work — the single invalid label parses fine and
  # kustomize could rewrite it — but it has to target every object kind while
  # not clobbering the subcharts, whose own `app.kubernetes.io/version` comes
  # from their own (suffix-free) `.Chart.Version`.
  #
  # So the cause is removed instead. The HelmChart that `chart.spec` produces
  # carries the bare version: verified on this cluster, where the `type: oci`
  # repository `album/immich-charts` yields a HelmChart whose artifact revision
  # is exactly `0.13.2`.
  #
  # Cost: no digest pin (see helmrepository.yaml). crds/ next door keeps its
  # OCIRepository and its digest, because a chart of pure CRDs never renders
  # that label and is unaffected — as is platform/substrate, whose templates do
  # not put `.Chart.Version` in a label value. Both installed cleanly with the
  # same `+digest` suffix on their chart versions.
  chart:
    spec:
      chart: kagent
      version: 1.0.0-alpha17
      sourceRef:
        kind: HelmRepository
        name: kagent
        namespace: kagent
  # CRDs come from the kagent-crds release in crds/, reconciled by its own
  # Kustomization. `Skip` so this release never fights it for ownership.
  install:
    crds: Skip
    timeout: 15m
    remediation:
      retries: -1
  upgrade:
    crds: Skip
    timeout: 15m
    remediation:
      retries: 3
  values:
    # ---------------------------------------------------------------------
    # Database: a database on the shared cluster
    # ---------------------------------------------------------------------
    # The DSN comes from the Secret that platform/postgres/applications/kagent
    # pushes into this namespace. Since 1.0.0-alpha13 the chart takes a Secret
    # ref directly (a secretKeyRef env on the controller), which is what the
    # `urlFile` + hand-mounted volume used to emulate — the reason was the same
    # both times: `url` would be a Helm value, i.e. a password in git.
    #
    # Since alpha14 there are TWO refs, the same split substrate made in 0.4
    # (see platform/substrate/release.yaml): an OWNER connection that runs
    # migrations as `kagent_owner`, and a READ/WRITE connection that serves
    # every runtime query as `kagent_readwrite`. Both name the same Secret, for
    # the same reason substrate's do — one login (`kagent`) is a member of both
    # roles, and the `SET ROLE` the controller issues per pool is what separates
    # the privilege sets. Upstream's setup.sql creates a login per role; two
    # here would be a second password to rotate and nothing else.
    database:
      postgres:
        ownerConnectionStringSecretRef:
          name: kagent-db
          key: url
        readWriteConnectionStringSecretRef:
          name: kagent-db
          key: url

    config:
      database:
        # The roles each pool assumes with `SET ROLE` (alpha13 had one,
        # `role: kagent_owner`, for everything). Tables live in the `kagent`
        # schema, owned by `kagent_owner`; `kagent_readwrite` gets DML on them
        # only through the default privileges in
        # platform/postgres/applications/kagent/databaserole.yaml. All three
        # names are chart defaults, restated because that directory has to
        # create exactly these and nothing cross-checks the two.
        owner:
          role: kagent_owner
        readWrite:
          role: kagent_readwrite
        schema: kagent
        # pgvector is in every database on this cluster already:
        # platform/postgres runs `CREATE EXTENSION vchord CASCADE` in
        # `postInitTemplateSQL`, CASCADE pulls in pgvector, and template1 is
        # what every later database is cloned from. That puts it in `public`,
        # not in the chart's default `extensions` schema — the vector migration
        # types its column as `<vectorSchema>.vector(768)`, so the default would
        # fail at migrate time with `type "extensions.vector" does not exist`.
        #
        # If vectorEnabled is ever turned off again, note the Memory feature
        # degrades silently rather than erroring.
        vectorEnabled: true
        vectorSchema: public
      # These two are literal strings, and they only resolve because
      # platform/substrate pins its release name to `substrate` — that is the
      # one release name for which `substrate.fullname` returns a bare `api`
      # and `atenet-router` instead of prefixing them. Both are also the chart
      # defaults (they moved here from `controller.substrate` in alpha13).
      #
      # Every Harness names its pool in `spec.substrate.workerPoolRef`; there
      # is no default pool.
      #
      # `actorJwtIssuer` (alpha17) is left at its default,
      # `https://idp.ate-system.svc`, which is what substrate's
      # `ateApi.actorJWTIssuer` defaults to as well. The controller verifies the
      # JWT an actor presents on every TaskStore call against that issuer's
      # discovery document, so setting either side alone breaks every turn.
      substrate:
        apiEndpoint: dns:///api.ate-system.svc:443
        routerUrl: http://atenet-router.ate-system.svc:80

    controller:
      # Off in the chart, on in upstream's own installer (`kagent install`,
      # go/core/cli/internal/commands/install.go), and required here: ate-api
      # serves TLS from the pod certificate controller's private CA, so without
      # the servicedns trust bundle the controller cannot verify it, and without
      # the podidentity certificate it has nothing to present. Both are the
      # `podCertificate:`/`clusterTrustBundle:` projections the
      # podcertificate-controller in platform/substrate signs.
      substrateClientCertificate:
        enabled: true
      resources:
        requests:
          cpu: 50m
          memory: 256Mi
        limits:
          memory: 1Gi

    # The WorkerPool the harnesses reference. It is an ate.dev resource, so it
    # needs substrate's CRDs and its controller — hence the `dependsOn` in
    # ks.yaml. The name has to match `spec.substrate.workerPoolRef.name` on
    # every Harness; nothing cross-validates the two.
    #
    # `sandboxClass: gvisor` is substrate's OWN gVisor, not this cluster's.
    # infrastructure/gvisor installs runsc via a Talos system extension and
    # exposes it as a RuntimeClass; substrate's atelet downloads its own runsc
    # per the SandboxConfig the chart ships (a pinned *nightly* build from
    # gs://gvisor/releases/nightly/) and starts sandboxes directly. The two are
    # unrelated and the cluster's RuntimeClass is not involved. Worth knowing
    # before debugging one by looking at the other.
    substrateWorkerPool:
      create: true
      name: kagent-default
      replicas: 2
      # Digest-pinned. The WorkerPool does not require it the way a Harness
      # does, but a floating tag on the thing that executes agent code is not
      # worth the convenience.
      #
      # Its version is substrate's, not kagent's: it must equal the substrate
      # chart in platform/substrate/ocirepository.yaml (see the note there).
      # Renovate DOES see this line and is told to leave it alone — bumped on
      # its own to v0.6.0, the worker crash-looped on `--dns-egress-policy is
      # required`, a flag only a 0.6 ate-controller passes.
      #
      # The image was renamed in 0.6: `ateom-gvisor` -> `ateworker-gvisor`.
      # The old name has no 0.6 tags, so bumping only the tag is a pull error.
      workerImage: ghcr.io/kagent-dev/substrate/ateworker-gvisor:v0.6.0-alpha3@sha256:56e6231c3ed48d54afd3068b6313a1545df1277e0ac1faa6090085cc480d573e
      sandboxClass: gvisor

    # ---------------------------------------------------------------------
    # The model: Infomaniak's OpenAI-compatible endpoint
    # ---------------------------------------------------------------------
    # This block is not just defaults — the chart renders `providers.default`
    # into a real ModelConfig (templates/modelconfig.yaml) and puts its name in
    # the controller's DEFAULT_MODEL_CONFIG_NAME. So configuring it here is
    # what makes Infomaniak the default model, and is why there is no
    # hand-written ModelConfig in this directory.
    #
    # `config:` is rendered as `spec.<provider>`, i.e. `spec.openAI`, so
    # `baseUrl` lands where the CRD wants it. `apiKey` is deliberately NOT set:
    # setting it makes the chart template a Secret with the key in it, which is
    # plaintext in git. Left unset, the generated ModelConfig just references
    # `kagent-openai`, which is infomaniak-sops.yaml.
    #
    # THE `/2/` AND THE `/v1` ARE BOTH LOAD-BEARING, and Infomaniak serves a
    # second, near-identical route that silently lacks the LLMs. Verified by
    # asking both:
    #
    #   GET /1/ai/106500/openai/models        -> 200, 4 models
    #                                            (whisper, flux, 2 embedders)
    #   GET /2/ai/106500/openai/v1/models     -> 200, 11 models, including
    #                                            moonshotai/Kimi-K2.6
    #   GET /1/ai/106500/openai/v1/models     -> 404
    #
    # So the `/1/` route is real, authenticates with the same key, and answers
    # `/models` — it just has no chat model on it. Getting this wrong does not
    # look like a URL problem.
    #
    # `106500` is the AI Tools product number; the endpoint is per-product and
    # there is no account-wide form. The HOSTNAME does not change with it, which
    # is why the `toFQDNs` rule in platform/substrate/network-policy.yaml and
    # the credential-injection destination are both just `api.infomaniak.com` —
    # changing product or API version does not touch either.
    #
    # `apiFormat` is left at the CRD default of `chatCompletions`. Confirmed
    # working: POST .../v1/chat/completions returns 200 with a normal OpenAI
    # response body and a `usage` block.
    #
    # NOTE ON THIS MODEL: Kimi-K2.6 is a reasoning model, and it spends its
    # budget on a `reasoning` field BEFORE it writes `content`. A capped
    # `max_tokens` therefore returns `content: null` with
    # `finish_reason: "length"` and a full `usage` block — a successful,
    # billed, empty answer. That is why no `maxTokens` is set here: the CRD
    # would pass it through as the OpenAI `max_tokens` and a value chosen for a
    # non-reasoning model would make every short reply blank. Confirmed at
    # max_tokens=16 (null) versus 512 (" ok").
    #
    # The model name itself is not validated at apply time. A name Infomaniak
    # does not serve renders a perfectly healthy ModelConfig and fails at the
    # first turn — so if agents are created fine and every conversation errors,
    # check this string against `/2/ai/<product>/openai/v1/models` before
    # suspecting the harness or the egress path.
    providers:
      default: openAI
      openAI:
        provider: OpenAI
        model: "moonshotai/Kimi-K2.6"
        apiKeySecretRef: kagent-openai
        apiKeySecretKey: OPENAI_API_KEY
        config:
          baseUrl: "https://api.infomaniak.com/2/ai/106500/openai/v1"

    # ---------------------------------------------------------------------
    # Built-in tools, and the one value here that is a security control
    # ---------------------------------------------------------------------
    # `rbac.readOnly: true` is NOT the chart default, and the default is worth
    # stating plainly: with `readOnly: false`, kagent-tools binds its
    # ServiceAccount to a ClusterRole of
    #
    #   - apiGroups: ["*"] resources: ["*"] verbs: ["*"]
    #   - nonResourceURLs: ["*"] verbs: ["*"]
    #
    # i.e. cluster-admin, held by the MCP tool server that any agent can call —
    # reachable, on this cluster, from a UI with no login on the tailnet. That
    # is a combination worth opting into deliberately rather than inheriting.
    #
    # Read-only still leaves agents able to get/list/watch pods, deployments,
    # jobs, ingresses, events and nodes cluster-wide, which is most of what
    # makes a cluster-troubleshooting agent useful. `allowSecrets: false` keeps
    # Secrets out of even that; it is the chart default and is restated here
    # because it is the one read that would matter most.
    #
    # Widening this is a deliberate edit with an argument, the same as adding a
    # namespace to require-kata-for-privileged.
    kagent-tools:
      enabled: true
      rbac:
        readOnly: false
        allowSecrets: false
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          memory: 512Mi

    # (`kmcp.enabled` used to sit here. alpha14 removed kmcp from the chart;
    # see ./crds/release.yaml for why that was safe on this cluster.)

    # No Grafana on this cluster — the chart's default points the MCP server at
    # `grafana.kagent:3000`, which resolves to nothing.
    grafana-mcp:
      enabled: false

    # ---------------------------------------------------------------------
    # The UI, and what is guarding it
    # ---------------------------------------------------------------------
    # `auth.mode` is left at the chart's `insecure` (spelled `unsecure` before
    # 1.0.0-alpha5 — set it by hand and the old spelling is what you would
    # reach for), which means no login: the
    # controller takes the user from an `X-User-Id` header and otherwise treats
    # every request as admin@kagent.dev. The tailnet is the access control, the
    # same argument apps/radar makes, and network-policy.yaml is where that
    # stops being an argument and becomes enforced — the UI accepts ingress only
    # from the `tailscale` namespace.
    #
    # The alternative is `auth.mode: trusted-proxy` plus the oauth2-proxy
    # subchart against authentik, which needs a Gateway listener the tailnet
    # path deliberately does not have. Left off.
    oauth2-proxy:
      enabled: false

    ui:
      # Absolute links the UI emits (and the A2A agent cards) use this. It must
      # match the tailnet device name in ingress.yaml exactly — the operator
      # takes that name from `tls.hosts`, and a mismatch here produces a UI that
      # loads and then points at a host that does not exist.
      externalUrl: https://kagent.goby-beaufort.ts.net
      resources:
        requests:
          cpu: 10m
          memory: 64Mi
        limits:
          memory: 256Mi
