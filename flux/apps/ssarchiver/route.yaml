apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: ssarchiver
spec:
  parentRefs:
  - name: envoy-gateway
    namespace: envoy-gateway-system
    sectionName: yewolf.fr-tls
  hostnames:
  - "ssarchiver.yewolf.fr"
  rules:
  # SSArchiver's admin account is created by whoever submits /setup first, and
  # until someone does, every other path redirects there. Public, that is the
  # admin account offered to the first visitor. So /setup never leaves the
  # cluster: a rule with no backendRefs is answered by Envoy itself, and setup
  # is done once over `kubectl port-forward`. After that /setup is a 404 in the
  # app anyway, so blocking it here costs nothing; a forgotten password is
  # `ssarchiver user reset-password` inside the pod, not this page.
  - matches:
    - path:
        type: PathPrefix
        value: /setup
  # No ext-auth: reads are public by design — score pages, .dat downloads and
  # an /embed/ iframe meant for other sites — and writes are on the admin
  # session cookie.
  - backendRefs:
    - group: ""
      kind: Service
      name: ssarchiver
      port: 8080
      weight: 1
    matches:
    - path:
        type: PathPrefix
        value: /
