# Pushes the bare password rather than a rendered DSN. Dawarich takes its
# connection details as five discrete env vars (DATABASE_HOST, _PORT, _NAME,
# _USERNAME, _PASSWORD), and only the password is secret — the other four are
# plain values in the Deployment. So there is no URL to assemble here, and
# correspondingly nothing to urlquery-escape.
#
# Dawarich's entrypoint *does* also accept a single DATABASE_URL and splits it
# itself, but it does so with shell parameter expansion and no unescaping, so a
# password containing `@` or `/` would be parsed wrong. Passing the parts
# separately sidesteps that entirely.
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: dawarich-db
  namespace: postgres
spec:
  refreshInterval: 1h
  deletionPolicy: None
  secretStoreRefs:
  - name: dawarich
    kind: SecretStore
  selector:
    secret:
      name: dawarich-db-credentials
  data:
  - match:
      secretKey: password
      remoteRef:
        remoteKey: dawarich-db
        property: password
