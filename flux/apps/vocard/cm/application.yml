server:
  port: 2333
  address: 0.0.0.0

plugins:
  youtube:
    enabled: true
    # MUSIC and ANDROID_VR resolve most tracks; WEB/WEBEMBEDDED are the
    # fallbacks. TV is last and is here only because of the OAuth block below:
    # per youtube-source's client table it is the *only* client that can use an
    # OAuth token, and it carries no metadata support of its own — it plays,
    # it does not search.
    clients:
    - MUSIC
    - ANDROID_VR
    - WEB
    - WEBEMBEDDED
    - TV
    # Without this, YouTube answers this server's requests with "This video
    # requires login" on ANDROID_VR and "No supported audio streams available"
    # on WEB — its bot detection, on an ordinary public video, not an
    # age-restricted one. OAuth makes the requests look like a signed-in user.
    #
    # The first start with no refreshToken prints a code and a
    # google.com/device link, and prints the resulting refresh token once the
    # flow is completed. That token then goes into secret-sops.yaml as
    # YOUTUBE_OAUTH_REFRESH_TOKEN and is injected as an env var by
    # lavalink.yaml, so it is never in this ConfigMap.
    #
    # Use a burner Google account. Upstream's warning is that this can get an
    # account terminated, and it is not an idle one.
    oauth:
      enabled: true
    # Signature deciphering, handed to the service in yt-cipher.yaml. The
    # password comes from the environment, so only the URL and the metrics
    # label are here. Removing this block puts the local extractor back in
    # charge and returns the "Must find sig function" failure.
    remoteCipher:
      url: "http://yt-cipher:8001"
      userAgent: "vocard"

lavalink:
  plugins:
  # YouTube support is not in Lavalink itself any more — the built-in source is
  # deprecated and disabled below. The jar is downloaded from maven.lavalink.dev
  # on every start into the plugins emptyDir, which is why the pod needs
  # internet egress before it can become ready.
  #
  # No Renovate manager reads a maven coordinate in a ConfigMap, so unlike
  # every other version in flux/ this one is invisible to the bot — bump it by
  # hand when the Lavalink image moves.
  - dependency: "dev.lavalink.youtube:youtube-plugin:1.18.2"
    snapshot: false
  pluginsDir: "/plugins"
  server:
    # password comes from LAVALINK_SERVER_PASSWORD (Spring relaxed binding),
    # not from this file — see secret-sops.yaml.
    sources:
      youtube: false
      bandcamp: true
      soundcloud: true
      twitch: true
      vimeo: true
      nico: true
      # Direct stream URLs (internet radio, and anything a user pastes). Safe
      # here only because the network policy denies this pod the LAN and the
      # cluster: an http source is an SSRF primitive handed to whoever can talk
      # to the bot.
      http: true
      local: false
    bufferDurationMs: 400
    frameBufferDurationMs: 5000
    opusEncodingQuality: 10
    resamplingQuality: LOW
    trackStuckThresholdMs: 10000
    useSeekGhosting: true
    youtubePlaylistLoadLimit: 6
    playerUpdateInterval: 5
    youtubeSearchEnabled: true
    soundcloudSearchEnabled: true
    gc-warnings: true

metrics:
  prometheus:
    enabled: false

logging:
  file:
    # Under /tmp because the root filesystem is read-only. Left enabled rather
    # than turned off: Lavalink's logback config writes here regardless, and
    # pointing it at a path that cannot be created fails the boot.
    path: /tmp/logs/
  level:
    root: INFO
    lavalink: INFO
    # Prints the device code during the OAuth flow, and the refresh token when
    # it completes. Both are invisible at the default level.
    dev.lavalink.youtube.http.YoutubeOauth2Handler: INFO
  request:
    enabled: true
    includeClientInfo: true
