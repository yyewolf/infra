# Dawarich's own data — the location history itself — lives in the shared
# Postgres and is covered by barman's WAL archiving, not by this. What this
# protects is the claim beside it: the raw import files under ActiveStorage,
# which are the one thing on that volume that cannot be regenerated. The
# compiled assets are restored from the image on every boot and the exports are
# rebuilt on demand.
apiVersion: longhorn.io/v1beta2
kind: RecurringJob
metadata:
  name: dawarich-backup
  namespace: longhorn-system
spec:
  name: dawarich-backup
  cron: "0 4 * * *"
  task: backup
  groups:
  - dawarich-backup
  retain: 30
  concurrency: 1
---
# Vocard's MongoDB volume. Small, but it is the only copy of the per-guild
# settings and the users' saved playlists — everything else in that namespace
# is rebuilt from the image and the ConfigMaps on every start. Snapshot-based
# like the rest of these: mongod's on-disk state is crash-consistent, and a
# single-node deployment has nothing to quiesce.
apiVersion: longhorn.io/v1beta2
kind: RecurringJob
metadata:
  name: vocard-backup
  namespace: longhorn-system
spec:
  name: vocard-backup
  cron: "0 4 * * *"
  task: backup
  groups:
  - vocard-backup
  retain: 30
  concurrency: 1
---
# The servarr config claims — sonarr, radarr, prowlarr, bazarr, jellyseerr,
# jellyfin, qbittorrent, rustatio and jellystat. Not servarr-media: 2.9 TiB of
# re-downloadable files, and no bucket here would take it.
#
# Eight of the nine are on `big-pool`, i.e. a single replica on w-1, so unlike
# the groups above this is not a second line of defence — it is the only copy of
# those sqlite databases that does not live on w-1's raidz1.
#
# concurrency 2 rather than 1: jellyfin-config is ~16 GiB of metadata and image
# cache against ~3.6 GiB for the other eight combined, and at concurrency 1 it
# would sit in front of them for the whole of its first full upload. Two at a
# time lets the small ones finish while it runs, and both replicas being on the
# same node is not a reason to serialise — the upload is bounded by the uplink,
# not by w-1's disks.
apiVersion: longhorn.io/v1beta2
kind: RecurringJob
metadata:
  name: servarr-backup
  namespace: longhorn-system
spec:
  name: servarr-backup
  cron: "0 4 * * *"
  task: backup
  groups:
  - servarr-backup
  retain: 30
  concurrency: 2
