apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: keda
spec:
  interval: 30m
  chart:
    spec:
      chart: keda
      version: "2.20.1"
      sourceRef:
        kind: HelmRepository
        name: keda
      interval: 12h
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  values:
    # The metrics adapter registers as an APIService, so the apiserver has to
    # reach it. Nothing else here needs edge scheduling.
    resources:
      operator:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          memory: 512Mi
      metricServer:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          memory: 512Mi
      webhooks:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          memory: 128Mi
