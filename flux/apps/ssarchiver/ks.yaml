apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: ssarchiver
  namespace: flux-system
spec:
  # envoy-proxy for the Gateway the route attaches to, longhorn for the class
  # the claim names and for the RecurringJob its backup label refers to.
  dependsOn:
  - name: envoy-proxy
  - name: longhorn
  interval: 10m
  path: ./flux/apps/ssarchiver
  prune: true
  retryInterval: 1m
  sourceRef:
    kind: GitRepository
    name: flux-system
