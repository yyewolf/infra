apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: controller
spec:
  endpointSelector:
    matchLabels:
      control-plane: envoy-gateway
  egress:
  - toEntities:
    - kube-apiserver
    toPorts:
    - ports:
      - port: "6443"
        protocol: TCP
  - toEndpoints:
    - matchLabels:
        io.kubernetes.pod.namespace: kube-system
        k8s-app: kube-dns
    toPorts:
    - ports:
      - port: "53"
        protocol: UDP
      - port: "53"
        protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: proxy
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: envoy
  ingress:
  # Container ports, not the Service's: policy is enforced at the endpoint,
  # after Cilium has rewritten 80/443/22 to the proxy's own listeners. A
  # Gateway listener whose port is missing here is accepted, programmed, and
  # then silently black-holed — the client just hangs on SYN. Every listener
  # added to the Gateway (or to a ListenerSet attached to it) needs its
  # translated port added here too.
  - fromEntities:
    - world
    toPorts:
    - ports:
      - port: "10080"
        protocol: TCP
      - port: "10443"
        protocol: TCP
      - port: "10443"
        protocol: UDP
      # apps/portfoliosh's ListenerSet, public SSH on 22.
      - port: "10022"
        protocol: TCP
  egress:
  - toEntities:
    - kube-apiserver
    toPorts:
    - ports:
      - port: "6443"
        protocol: TCP
  - toEndpoints:
    - matchLabels:
        io.kubernetes.pod.namespace: kube-system
        k8s-app: kube-dns
    toPorts:
    - ports:
      - port: "53"
        protocol: UDP
      - port: "53"
        protocol: TCP
  - toEntities:
    - cluster
