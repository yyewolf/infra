apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: webmail
  namespace: flux-system
spec:
  dependsOn:
  - name: envoy-proxy
  # keda for the InterceptorRoute/ScaledObject CRDs and the ReferenceGrant
  # this route needs; booting-up for the placeholder the cold-start fallback
  # points at.
  - name: keda
  - name: booting-up
  - name: stalwart
  interval: 10m
  path: ./flux/apps/webmail
  prune: true
  retryInterval: 1m
  sourceRef:
    kind: GitRepository
    name: flux-system
