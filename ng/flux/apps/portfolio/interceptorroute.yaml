# Routing half of the scale-to-zero pair: it tells the interceptor which
# backend a request belongs to, and which metric to report for it. It carries
# no replica counts — that is the ScaledObject's job.
apiVersion: http.keda.sh/v1beta1
kind: InterceptorRoute
metadata:
  name: portfolio
spec:
  target:
    service: portfolio
    port: 80
  rules:
    - hosts:
        - yewolf.fr
        - portfolio.hackcorp.net
      paths:
        - value: /
  scalingMetric:
    concurrency:
      targetValue: 100
  coldStart:
    # While portfolio is still starting, serve the placeholder page instead of
    # holding the connection open. Its JS polls /is_still_booting_up — which
    # also lands here until the pod is ready — and reloads once the real app
    # answers.
    fallback:
      service:
        name: service-fallback
        port: 80
  timeouts:
    # Short on purpose: this is how long a request waits before it gives up and
    # gets the placeholder. Long enough to absorb a warm pod, short enough that
    # a genuine cold start shows the spinner instead of appearing to hang.
    readiness: 2s
