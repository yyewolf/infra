apiVersion: apps/v1
kind: Deployment
metadata:
  name: paperless
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: paperless
  template:
    metadata:
      labels:
        app: paperless
    spec:
      automountServiceAccountToken: false
      containers:
      - name: paperless
        image: ghcr.io/paperless-ngx/paperless-ngx:3.5.1@sha256:8508853b8a0f8394074260957d0be186c8c64f346973b24a7583de4580f306b9
        securityContext:
          allowPrivilegeEscalation: false
          seccompProfile:
            type: RuntimeDefault
        ports:
        - containerPort: 8000
        env:
        - name: PAPERLESS_REDIS
          value: redis://redis:6379
        - name: PAPERLESS_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: paperless-secret
              key: PAPERLESS_SECRET_KEY
        - name: PAPERLESS_URL
          value: https://paperless.yewolf.fr
        - name: PAPERLESS_APPS
          value: allauth.socialaccount.providers.openid_connect
        - name: PAPERLESS_SOCIAL_AUTO_SIGNUP
          value: "true"
        - name: PAPERLESS_SOCIALACCOUNT_ALLOW_SIGNUPS
          value: "true"
        - name: PAPERLESS_DISABLE_REGULAR_LOGIN
          value: "true"
        - name: PAPERLESS_REDIRECT_LOGIN_TO_SSO
          value: "true"
        - name: PAPERLESS_SOCIAL_ACCOUNT_SYNC_GROUPS
          value: "true"
        - name: PAPERLESS_SOCIALACCOUNT_PROVIDERS
          valueFrom:
            secretKeyRef:
              name: paperless-secret
              key: PAPERLESS_SOCIALACCOUNT_PROVIDERS
        - name: PAPERLESS_LOGOUT_REDIRECT_URL
          value: "https://auth.yewolf.fr/application/o/paperless-ngx/end-session/"
        - name: PAPERLESS_ACCOUNT_ALLOW_SIGNUPS
          value: "false"
        - name: PAPERLESS_TIME_ZONE
          value: Europe/Paris
        - name: PAPERLESS_OCR_LANGUAGE
          value: fra+eng
        - name: PAPERLESS_ADMIN_USER
          value: admin
        - name: PAPERLESS_PORT
          value: "8000"
        - name: PAPERLESS_ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: paperless-secret
              key: PAPERLESS_ADMIN_PASSWORD
        - name: USERMAP_UID
          value: "1000"
        - name: USERMAP_GID
          value: "1000"
        volumeMounts:
        - name: data
          mountPath: /usr/src/paperless/data
          subPath: data
        - name: data
          mountPath: /usr/src/paperless/media
          subPath: media
        - name: data
          mountPath: /usr/src/paperless/consume
          subPath: consume
        - name: data
          mountPath: /usr/src/paperless/export
          subPath: export
        # PAPERLESS_URL becomes Django's ALLOWED_HOSTS, and the kubelet probes
        # the pod IP, which is not in it: without this Host header every probe
        # is a 400 DisallowedHost and the pod is restarted forever.
        startupProbe:
          httpGet:
            path: /
            port: 8000
            httpHeaders:
            - name: Host
              value: paperless.yewolf.fr
          periodSeconds: 10
          failureThreshold: 30
        readinessProbe:
          httpGet:
            path: /
            port: 8000
            httpHeaders:
            - name: Host
              value: paperless.yewolf.fr
          periodSeconds: 10
        resources:
          requests:
            cpu: 200m
            memory: 512Mi
          limits:
            cpu: 2000m
            memory: 2Gi
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: paperless-storage
