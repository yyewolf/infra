# The backend is the KEDA interceptor, not portfolio's own Service — routing
# straight to the app would bypass the wake-up and serve nothing at zero
# replicas. The InterceptorRoute picks the real backend from the Host header.
#
# yewolf.fr is the apex, so external-dns will want to own the zone's A/AAAA
# record for it. It will not take one it did not create: without a `k8s-` TXT
# owned by `ng`, the existing record is left alone and this route only starts
# receiving traffic once DNS is pointed at this cluster by hand.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: portfolio
spec:
  parentRefs:
  - name: envoy-gateway
    namespace: envoy-gateway-system
    sectionName: https
  hostnames:
  - "yewolf.fr"
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - group: ""
      kind: Service
      name: keda-add-ons-http-interceptor-proxy
      namespace: keda
      port: 8080
