# GHCR-only, like cnmsql — there is no HTTP Helm repository for kagent, so this
# is an OCIRepository + chartRef rather than the HelmRepository + chart.spec
# form most of platform/ uses. Renovate's flux manager reads
# `OCIRepository.spec.ref.tag`, so it is still pinned and still bumped.
#
# The chart carries `kmcp-crds` as a vendored subchart (see charts/ inside the
# package), conditional on `kmcp.enabled`. Until 1.0.0-alpha13 it also carried
# `substrate-crds`; that is now its own release in platform/substrate/crds.
#
# Moves together with ../release.yaml's chart version, the Harness images in
# ../harness.yaml and ../harness-claude.yaml, and — because kagent pins one
# substrate version in its go.mod — with every substrate pin. renovate.json
# groups the kagent half and holds the substrate half back.
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: kagent-crds
spec:
  interval: 1h
  url: oci://ghcr.io/kagent-dev/kagent/helm/kagent-crds
  layerSelector:
    mediaType: "application/vnd.cncf.helm.chart.content.v1.tar+gzip"
    operation: copy
  ref:
    tag: 1.0.0-alpha13
    digest: sha256:dc9e500921b7fe206232e60998bebf746457047f6f83c5a016931e756c791edc
