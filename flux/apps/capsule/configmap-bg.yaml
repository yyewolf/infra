# Flux's source-controller applies a default ignore list to every checkout, and
# that list drops binaries by extension — *.jpg among them. The file can be
# committed and still be absent from the Kustomization's working copy, which
# fails as "no such file or directory" from configMapGenerator rather than as
# anything mentioning ignore rules. Encoding the image as base64 in a YAML
# ConfigMap sidesteps it entirely: this is text, so nothing filters it.
#
# Kept separate from the generated caddy-config because it never changes and
# would otherwise churn that ConfigMap's content hash. Regenerate with:
#
#     base64 -w0 bg.jpg
apiVersion: v1
kind: ConfigMap
metadata:
  name: caddy-bg
binaryData:
  bg.jpg: 
