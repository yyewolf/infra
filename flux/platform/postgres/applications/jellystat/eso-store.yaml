apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: jellystat
  namespace: postgres
spec:
  provider:
    kubernetes:
      remoteNamespace: servarr
      server:
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
      auth:
        # Must match the ServiceAccount in eso-writer.yaml. See the note there
        # about why this app does not reuse another directory's SA.
        serviceAccount:
          name: eso-push-writer-jellystat
