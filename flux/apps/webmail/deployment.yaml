apiVersion: apps/v1
kind: Deployment
metadata:
  name: webmail
  labels:
    app: webmail
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
  selector:
    matchLabels:
      app: webmail
  template:
    metadata:
      labels:
        app: webmail
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: webmail
        image: ghcr.io/bulwarkmail/webmail:1.19.1@sha256:dcb6ef96e3b020fa30d8a161b94ea39431f4a21a97a663cbc980b515e894879b
        securityContext:
          allowPrivilegeEscalation: false
          runAsNonRoot: true
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
          seccompProfile:
            type: RuntimeDefault
        env:
        - name: JMAP_SERVER_URL
          value: https://stalwart.yewolf.fr
        - name: HOSTNAME
          value: 0.0.0.0
        - name: PORT
          value: "3000"
        - name: STALWART_FEATURES
          value: "true"
        volumeMounts:
        - name: data
          mountPath: /app/data
        - name: tmp
          mountPath: /tmp
        # Tight period: this is the pod the interceptor waits on during a cold
        # start, so every second here is a second of placeholder.
        readinessProbe:
          httpGet:
            path: /api/health
            port: 3000
          periodSeconds: 2
        livenessProbe:
          httpGet:
            path: /api/health
            port: 3000
          periodSeconds: 30
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            memory: 1Gi
      volumes:
      - name: data
        emptyDir: {}
      - name: tmp
        emptyDir: {}
