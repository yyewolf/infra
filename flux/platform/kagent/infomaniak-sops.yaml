# The Infomaniak API key, for the OpenAI-compatible endpoint configured in
# `providers.openAI` in release.yaml.
#
# The name and key are not free choices — they must match `apiKeySecretRef` and
# `apiKeySecretKey` in release.yaml, which are what the generated ModelConfig
# references. `OPENAI_API_KEY` is the chart's own convention for an
# OpenAI-provider secret and is kept even though the provider is Infomaniak.
#
# HOW THE KEY REACHES THE MODEL. It does not enter the agent's process. The
# agent runs in a Substrate sandbox holding an inert placeholder; substrate's
# egress gateway fetches this Secret and rewrites the outgoing
# `authorization: Bearer <key>` header on the way out. That is what the
# `credentialProvider.namespacePolicies` grant in
# platform/substrate/release.yaml is for, and why the grant names this
# namespace. It also means the destination is matched on EXACT DNS HOSTNAME,
# without path or port — so `api.infomaniak.com` has to be the host in the
# ModelConfig's baseUrl, in that grant's reach, and in the `toFQDNs` rule in
# platform/substrate/network-policy.yaml. All three, or the call fails at
# whichever one disagrees.
#
# Rotating it: replace the value, `sops -e -i` this file, and let Flux
# reconcile. Nothing restarts — the gateway re-reads the Secret, and its
# credential cache can take up to five minutes to pick up the new value.
