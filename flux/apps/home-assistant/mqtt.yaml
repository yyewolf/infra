# Mosquitto MQTT broker for the Home Assistant ecosystem.
#
# Pinned to w-1 for the same reason the rest of the HA stack is: the Zigbee USB
# dongle and the LAN-side mDNS/OTA surface both need hostNetwork on the one
# machine that has the radio.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: mosquitto-config
data:
  mosquitto.conf: |
    listener 1883
    allow_anonymous false
    password_file /mosquitto/config/passwords
    persistence true
    persistence_location /mosquitto/data/
    log_dest stdout

  aclfile: |
    user homeassistant
    topic readwrite #

    user zigbee2mqtt
    topic readwrite zigbee2mqtt/#
    topic readwrite homeassistant/device_automation/#
    topic readwrite homeassistant/sensor/#
    topic readwrite homeassistant/light/#
    topic readwrite homeassistant/switch/#
    topic readwrite homeassistant/cover/#
    topic readwrite homeassistant/binary_sensor/#
    topic readwrite homeassistant/button/#

    user frigate
    topic readwrite frigate/#
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mqtt
  labels: { app: mqtt }
spec:
  serviceName: mqtt
  replicas: 1
  podManagementPolicy: OrderedReady
  updateStrategy: { type: RollingUpdate }
  selector:
    matchLabels: { app: mqtt }
  template:
    metadata:
      labels: { app: mqtt }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1883
        runAsGroup: 1883
        fsGroup: 1883
        seccompProfile:
          type: RuntimeDefault
      nodeSelector:
        kubernetes.io/hostname: w-1
      containers:
      - name: mosquitto
        image: eclipse-mosquitto:2.0@sha256:212f89e1eaeb2c322d6441b64396e3346026674db8fa9c27beac293405c32b3c
        securityContext:
          runAsUser: 1883
          runAsGroup: 1883
          allowPrivilegeEscalation: false
          capabilities: { drop: [ ALL ], add: [ CAP_CHOWN ] }
          seccompProfile: { type: RuntimeDefault }
        ports:
        - { containerPort: 1883, name: mqtt }
        volumeMounts:
        - { name: config, mountPath: /mosquitto/config/mosquitto.conf, subPath: mosquitto.conf }
        - { name: acl, mountPath: /mosquitto/config/aclfile, subPath: aclfile }
        - { name: passwords, mountPath: /mosquitto/config/passwords, subPath: passwords }
        - { name: data, mountPath: /mosquitto/data }
        resources:
          requests: { memory: "64Mi", cpu: "50m" }
          limits: { memory: "128Mi" }
      volumes:
      - name: config
        configMap:
          name: mosquitto-config
          items:
          - { key: mosquitto.conf, path: mosquitto.conf }
      - name: acl
        configMap:
          name: mosquitto-config
          items:
          - { key: aclfile, path: aclfile }
      - name: passwords
        secret:
          secretName: mosquitto-passwords
          items:
          - { key: passwords, path: passwords }
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes: [ ReadWriteOnce ]
      storageClassName: big-pool
      resources:
        requests:
          storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: mosquitto
spec:
  type: NodePort
  selector: { app: mqtt }
  ports:
  - { name: mqtt, port: 1883, targetPort: 1883, nodePort: 31883 }
