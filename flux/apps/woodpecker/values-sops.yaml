# Moved from the root cluster untouched, not regenerated: WOODPECKER_GITHUB_*
# is one OAuth app registered on GitHub against woodpecker.yewolf.fr, and that
# hostname follows the deployment here. Rotating it would mean editing the app
# on GitHub in the same breath as the move.
#
# The OAuth pair is all that is left here. The root cluster's file also carried
# WOODPECKER_DATABASE_DATASOURCE; that key is gone, because the server takes its
# DSN from the `woodpecker-db` Secret that ESO pushes instead (see helm.yaml's
# valuesFrom and platform/postgres/applications/woodpecker).
