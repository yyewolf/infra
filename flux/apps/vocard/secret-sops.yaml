# Everything credential-shaped in this app, in one Secret because every key has
# exactly one or two consumers in the same namespace and the workloads pick
# their keys by name.
#
# TOKEN is the Discord bot token from the developer portal. Rotating it there
# invalidates whatever is here, so the two move together:
#
#   sops set flux/apps/vocard/secret-sops.yaml '["stringData"]["TOKEN"]' '"<new token>"'
#
# DISCORD_CLIENT_SECRET is the OAuth2 client secret of the same application —
# a different credential from the token, found under OAuth2 rather than Bot,
# and only the dashboard uses it. It ships as a placeholder because it was not
# available when this was written; the dashboard boots without it and fails at
# the moment someone tries to log in. Same command, key DISCORD_CLIENT_SECRET.
#
# MONGO_USERNAME / MONGO_PASSWORD are what mongod's entrypoint creates as the
# root account, and only on a first start against an empty volume — changing
# them later does not rename the account, it just stops matching it. MONGODB_URL
# is the same pair spelled as a connection string for the bot; the two must be
# edited together.
#
# LAVALINK_PASSWORD is shared between the Lavalink server (as
# LAVALINK_SERVER_PASSWORD) and the bot, whose init container splices it into
# settings.json. A mismatch shows up as "The password for node 'DEFAULT' is
# invalid" in the bot log and nothing at all in Lavalink's.
#
# IPC_PASSWORD is the same arrangement one layer over: the dashboard checks it
# on the /ws_bot websocket, the bot sends it as the Authorization header. A
# mismatch closes the socket with "Incorrect password!".
#
# SECRET_KEY signs the dashboard's session cookies. Rotating it logs every
# browser session out and costs nothing else.
