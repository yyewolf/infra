# A fine-grained GitHub token for yyewolf/windmill only, for the
# windmill-maintainer agent in windmill-agent.yaml. Its grants on that one
# repository: Contents, Pull requests, Issues, Merge queues and Workflows
# read/write (Workflows because rebasing `primary` rewrites the commit that
# adds .github/workflows/fork-docker-image.yml, and GitHub refuses a push that
# touches workflow files without it); Actions, Commit statuses and Metadata
# read-only. Nothing else on the account.
#
# The same token three times, because each consumer wants a different header
# value and the gateway can only prepend a literal prefix:
#
#   git-basic           base64("x-access-token:<token>"), for git over HTTPS to
#                       github.com. Git's smart-HTTP endpoints take Basic auth;
#                       the EgressPolicy adds the "Basic " prefix.
#   token               the bare token, for api.github.com with "Bearer ".
#   mcp-authorization   "Bearer <token>", whole. RemoteMCPServer.headersFrom has
#                       no prefix field, so the value carries it.
#
# None of these reach the sandbox. The gateway swaps them in for a placeholder
# on the way out, exactly as for the model key (see infomaniak-sops.yaml).
#
# To rotate: regenerate the token on GitHub, then re-derive all three values.
# The gateway picks a new value up within five minutes, without a restart.
apiVersion: v1
kind: Secret
metadata:
    name: windmill-github
    namespace: kagent
type: Opaque
