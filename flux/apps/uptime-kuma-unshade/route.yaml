# A new hostname, so unlike apps/uptime-kuma there is no root-cluster record to
# delete first: external-dns creates it with its own `k8s-` TXT beside it.
# Covered by the `*.yewolf.fr` wildcard in platform/certificates.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: uptime-kuma
spec:
  parentRefs:
  - name: envoy-gateway
    namespace: envoy-gateway-system
    sectionName: yewolf.fr-tls
  hostnames:
  - "uptime-unshade.yewolf.fr"
  rules:
  - backendRefs:
    - group: ""
      kind: Service
      name: uptime-kuma
      port: 3001
      weight: 1
    matches:
    - path:
        type: PathPrefix
        value: /
