# Hardware facts for cp-0. Addressing is not here — talos.sh derives that from
# cluster.yaml.
#
# The install disk must be named explicitly. A size-based selector is tempting
# but the USB installer is also a disk, and picking wrong means Talos wipes the
# wrong device. Find the real one with:
#
#     ./talos.sh disks <maintenance-mode-ip>
#
# then replace the placeholder below. talos.sh refuses to render while it is
# still set to REPLACE_ME.
machine:
  install:
    # 256 GB KIOXIA KBG40ZNS256G. Named rather than selected by size because it
    # is not the only 256 GB disk in the box — the Netac SATA SSD Longhorn owns
    # is the same size — and the 31 GB USB installer also shows up while it is
    # plugged in. The Longhorn disk is selected by model instead, in
    # patches/longhorn.yaml; this one is the system disk and must be exact.
    disk: /dev/nvme0n1
