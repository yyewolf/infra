# S3 credentials for the Swiss Backup tenant that holds this cluster's base
# backups and archived WAL.
#
# A different Infomaniak account from the one MySQL uses (sb_project_SBI-TS165990
# here, sb_project_SBI-TS538856 there) — not just a different prefix in a shared
# bucket. The two databases cannot read or delete each other's archives even if
# one set of credentials leaks.
#
# REGION is in here rather than inline in the ObjectStore because the plugin
# takes the region as a Secret key reference, not as a plain string.
#
# Encrypted with SOPS under the repo's two PGP keys. `.sops.yaml` matches this
# file by its `-sops.yaml` suffix and encrypts `stringData` only, so the shape
# of the Secret stays readable in git and only the values are opaque.
apiVersion: v1
kind: Secret
metadata:
    name: postgres-backup-s3
type: Opaque
stringData:
    ACCESS_KEY_ID: ENC[AES256_GCM,data:HOk7YNfB3f0gzkVkag6wXTdMAXV9I6Bk7p5w0XzFGic=,iv:l/bNbOgulsHHzWhjDwu0d5YxHW8qgWZlnlNLjgMX07w=,tag:VWf0EggpaC9JkZK5D4WySg==,type:str]
