apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: tailscale-operator
spec:
  endpointSelector:
    matchLabels:
      app: operator
  egress:
  # Reconciles Services/Ingresses and creates the proxy StatefulSets.
  - toEntities:
    - kube-apiserver
    toPorts:
    - ports:
      - port: "6443"
        protocol: TCP
  - toEndpoints:
    - matchLabels:
        io.kubernetes.pod.namespace: kube-system
        k8s-app: kube-dns
    toPorts:
    - ports:
      - port: "53"
        protocol: UDP
      - port: "53"
        protocol: TCP
      rules:
        dns:
        - matchPattern: "*"
  # The operator is a tailnet node in its own right (ng-tailscale-operator),
  # not just an API client, so it probes and holds open a DERP home relay like
  # any other node. See the note on the proxy policy below for why this cannot
  # be a toFQDNs rule.
  - toEntities:
    - world
    toPorts:
    - ports:
      - port: "443"
        protocol: TCP
  - toEntities:
    - world
    toPorts:
    - ports:
      - port: "1"
        endPort: 65535
        protocol: UDP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: tailscale-proxies
spec:
  # Every proxy the operator creates carries this label; the rest of a proxy's
  # labels (tailscale.com/parent-resource and friends) name the Service it was
  # created for, so they cannot be enumerated ahead of time.
  endpointSelector:
    matchLabels:
      tailscale.com/managed: "true"
  ingress:
  # Egress proxies are reached by ClusterIP from the app that wants a tailnet
  # host; ingress proxies hand traffic to Services. Both are in-cluster peers
  # whose namespace depends on which Services exist, hence the entity match.
  - fromEntities:
    - cluster
  # A hole-punched peer sends UDP straight to the proxy's endpoint. Most of
  # that is reply-direction and conntrack would allow it anyway, but without
  # this the failure mode is a silent fall back to relaying every byte through
  # DERP — slow, and hard to attribute to a network policy.
  - fromEntities:
    - world
    toPorts:
    - ports:
      - port: "1"
        endPort: 65535
        protocol: UDP
  egress:
  # tailscaled stores its node state in a Secret rather than on disk, so a
  # proxy talks to the apiserver for its own state, not just at startup.
  - toEntities:
    - kube-apiserver
    toPorts:
    - ports:
      - port: "6443"
        protocol: TCP
  - toEndpoints:
    - matchLabels:
        io.kubernetes.pod.namespace: kube-system
        k8s-app: kube-dns
    toPorts:
    - ports:
      - port: "53"
        protocol: UDP
      - port: "53"
        protocol: TCP
      rules:
        dns:
        - matchPattern: "*"
  # Coordination plus DERP, and this cannot be narrowed to FQDNs. Cilium
  # populates a toFQDNs entry by inspecting DNS answers, but tailscaled gets
  # the relay list as a derpmap over the control plane connection and dials
  # those nodes by literal IP — no lookup ever happens for Cilium to see, so a
  # `*.tailscale.com` rule matches nothing and every relay is dropped. The
  # relay set also rotates, which rules out pinning a toCIDRSet.
  - toEntities:
    - world
    toPorts:
    - ports:
      - port: "443"
        protocol: TCP
  # NAT traversal: STUN to the DERP servers, then WireGuard direct to whatever
  # ip:port the peer turns out to be behind. Neither the address nor the port
  # is knowable in advance.
  - toEntities:
    - world
    toPorts:
    - ports:
      - port: "1"
        endPort: 65535
        protocol: UDP
  # An ingress proxy forwards to the Service it was created for, in that
  # Service's own namespace. Same reason KEDA's interceptor rule is loose.
  - toEntities:
    - cluster
