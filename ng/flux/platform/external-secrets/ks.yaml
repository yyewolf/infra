apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: external-secrets
  namespace: flux-system
spec:
  dependsOn:
  - name: cilium
  interval: 10m
  path: ./ng/flux/platform/external-secrets
  prune: false
  retryInterval: 1m
  sourceRef:
    kind: GitRepository
    name: flux-system
