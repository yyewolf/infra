apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cloudnative-pg
spec:
  interval: 30m
  chart:
    spec:
      chart: cloudnative-pg
      version: "0.29.0"
      sourceRef:
        kind: HelmRepository
        name: cloudnative-pg
      interval: 12h
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  values:
    # Cluster-wide: the operator reconciles Clusters in every namespace, so an
    # app keeps its database in its own namespace instead of here.
    config:
      clusterWide: true

    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        memory: 512Mi

    # The operator issues and rotates its own webhook certificate — it does not
    # go through cert-manager, unlike cnmsql.
    monitoring:
      # No prometheus-operator in this cluster yet; the CRD would not resolve.
      podMonitorEnabled: false
