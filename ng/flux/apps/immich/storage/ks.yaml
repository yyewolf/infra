apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: immich-storage
  namespace: flux-system
spec:
  dependsOn:
  - name: longhorn
  interval: 10m
  path: ./ng/flux/apps/immich/storage
  prune: true
  wait: true
  retryInterval: 1m
  sourceRef:
    kind: GitRepository
    name: flux-system
