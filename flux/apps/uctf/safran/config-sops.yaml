# safran's bucket config, supplied as the Secret the chart would otherwise
# build itself from `config.buckets`.
#
# `config.existingSecret` rather than values, because the R2 access key and
# secret live in here: routed through the HelmRelease they would have to be two
# more `valuesFrom` entries indexing into a list (`config.buckets[0]...`),
# which works but puts credentials in a path that silently retargets if the
# list is ever reordered. The chart mounts this Secret at
# `app.configMountPath`, and the key name must match `config.secretKey`.
