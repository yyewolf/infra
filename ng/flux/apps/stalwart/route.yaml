# Backend is plain HTTP on the management port — the edge terminates TLS with
# the *.yewolf.fr certificate, so Stalwart's own TLS is not in this path.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: stalwart
spec:
  parentRefs:
  - name: envoy-gateway
    namespace: envoy-gateway-system
    sectionName: https
  hostnames:
  - "mail.yewolf.fr"
  rules:
  - backendRefs:
    - group: ""
      kind: Service
      name: stalwart
      port: 8080
      weight: 1
    matches:
    - path:
        type: PathPrefix
        value: /
