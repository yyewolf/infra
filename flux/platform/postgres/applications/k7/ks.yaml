apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: k7-db
  namespace: flux-system
spec:
  decryption:
    provider: sops
    secretRef:
      name: sops-gpg
  dependsOn:
  - name: external-secrets
  - name: postgres
  # The Role and RoleBinding in eso-writer.yaml are created in the servarr
  # namespace, which servarr-storage owns. Without this the first reconcile
  # after a rebuild races the namespace into existence.
  - name: servarr-storage
  interval: 10m
  path: ./flux/platform/postgres/applications/k7
  prune: true
  retryInterval: 1m
  sourceRef:
    kind: GitRepository
    name: flux-system
