# Two keys rather than a DSN — Uptime Kuma reads separate `UPTIME_KUMA_DB_*`
# variables. See applications/uptime-kuma.
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: uptime-kuma-unshade-db
  namespace: mysql
spec:
  refreshInterval: 1h
  deletionPolicy: None
  secretStoreRefs:
  - name: uptime-kuma-unshade
    kind: SecretStore
  selector:
    secret:
      name: uptime-kuma-unshade-db-credentials
  template:
    engineVersion: v2
    data:
      UPTIME_KUMA_DB_USERNAME: "{{ .username }}"
      UPTIME_KUMA_DB_PASSWORD: "{{ .password }}"
  data:
  - match:
      secretKey: UPTIME_KUMA_DB_USERNAME
      remoteRef:
        remoteKey: uptime-kuma-db
        property: UPTIME_KUMA_DB_USERNAME
  - match:
      secretKey: UPTIME_KUMA_DB_PASSWORD
      remoteRef:
        remoteKey: uptime-kuma-db
        property: UPTIME_KUMA_DB_PASSWORD
