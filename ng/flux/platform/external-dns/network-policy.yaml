apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: external-dns
spec:
  # The Infomaniak webhook is a sidecar, so it shares this endpoint.
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: external-dns
  egress:
  - toEntities:
    - kube-apiserver
    toPorts:
    - ports:
      - port: "6443"
        protocol: TCP
  - toEndpoints:
    - matchLabels:
        io.kubernetes.pod.namespace: kube-system
        k8s-app: kube-dns
    toPorts:
    - ports:
      - port: "53"
        protocol: UDP
      - port: "53"
        protocol: TCP
      rules:
        dns:
        - matchPattern: "*"
  - toFQDNs:
    - matchName: api.infomaniak.com
    - matchName: haproxy-api.infomaniak.ch
    toPorts:
    - ports:
      - port: "443"
        protocol: TCP
