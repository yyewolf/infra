apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: dawarich-db
  namespace: flux-system
spec:
  decryption:
    provider: sops
    secretRef:
      name: sops-gpg
  dependsOn:
  - name: external-secrets
  - name: postgres
  # The Role and RoleBinding in eso-writer.yaml are created in the dawarich
  # namespace, which the `dawarich` Kustomization owns. Not a cycle: dawarich
  # deliberately does not wait on this one — its pod blocks on the missing
  # secret and then on the missing database, both of which this supplies.
  - name: dawarich
  interval: 10m
  path: ./flux/platform/postgres/applications/dawarich
  prune: true
  retryInterval: 1m
  sourceRef:
    kind: GitRepository
    name: flux-system
