# Everything SSArchiver keeps is under /data: the sqlite database and the replay
# files beside it. Replays are a few hundred KiB each, so even a backfill of
# thousands of scores is a few GiB; the class expands if that turns out wrong.
#
# `longhorn-yolo`, one replica, and the nightly Longhorn backup is the second
# copy. That is the right way round for this volume specifically: ScoreSaber
# prunes replays, so once one has been archived this claim may be the only
# place it still exists — but a lost node is a restore from last night's
# backup rather than an outage worth three replicas of disk. Not `big-pool`:
# nothing here is bulk, and that class would pin the pod to w-1.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ssarchiver-data
  labels:
    recurring-job-group.longhorn.io/ssarchiver-backup: enabled
spec:
  accessModes:
  - ReadWriteOnce
  storageClassName: longhorn-yolo
  resources:
    requests:
      storage: 10Gi
