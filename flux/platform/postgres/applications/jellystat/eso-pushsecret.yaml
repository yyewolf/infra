# Pushes the username and password as two discrete keys rather than a rendered
# DSN, the same shape as ../k7 and for the same reason: Jellystat takes its
# connection details as five separate env vars (POSTGRES_USER, POSTGRES_PASSWORD,
# POSTGRES_IP, POSTGRES_PORT, POSTGRES_DB) and has no URL form at all. The three
# that are not secret are plain values in the StatefulSet.
#
# The key names are POSTGRES_USER / POSTGRES_PASSWORD so the pod can consume the
# secret with envFrom-style secretKeyRefs that read exactly like the upstream
# compose file.
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: jellystat-db
  namespace: postgres
spec:
  refreshInterval: 1h
  deletionPolicy: None
  secretStoreRefs:
  - name: jellystat
    kind: SecretStore
  selector:
    secret:
      name: jellystat-db-credentials
  data:
  - match:
      secretKey: username
      remoteRef:
        remoteKey: jellystat-db
        property: POSTGRES_USER
  - match:
      secretKey: password
      remoteRef:
        remoteKey: jellystat-db
        property: POSTGRES_PASSWORD
