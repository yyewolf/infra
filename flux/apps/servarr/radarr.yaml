# Same pattern as sonarr.yaml — see it for why this is a StatefulSet, why the
# S6_* variables are required under runAsNonRoot, and why fsGroup is safe here.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: radarr
spec:
  replicas: 1
  serviceName: radarr
  selector:
    matchLabels:
      app: radarr
  template:
    metadata:
      labels:
        app: radarr
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/hostname: w-1
      containers:
      - name: radarr
        image: mirror.gcr.io/linuxserver/radarr:6.3.0@sha256:e35056574cdc695a9ee745aa1ecda9eab3842450bf4b7b8471b023790fa3861d
        securityContext:
          seccompProfile:
            type: RuntimeDefault
        ports:
        - containerPort: 7878
        env:
        - name: PUID
          value: "1000"
        - name: PGID
          value: "1000"
        - name: TZ
          value: "Europe/Paris"
        - name: S6_YES_I_WANT_A_WORLD_WRITABLE_RUN_BECAUSE_KUBERNETES
          value: "1"
        - name: S6_READ_ONLY_ROOT
          value: "1"
        - name: S6_VERBOSITY
          value: "2"
        volumeMounts:
        - name: config
          mountPath: /config
        - name: data
          mountPath: /data
        - name: run
          mountPath: /run
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
      volumes:
      - name: config
        persistentVolumeClaim:
          claimName: radarr-config
      - name: data
        persistentVolumeClaim:
          claimName: servarr-media
      - name: run
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: radarr
spec:
  ports:
  - port: 80
    targetPort: 7878
  selector:
    app: radarr
