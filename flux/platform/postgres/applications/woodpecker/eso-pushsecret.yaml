apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: woodpecker-db
  namespace: postgres
spec:
  refreshInterval: 1h
  deletionPolicy: None
  secretStoreRefs:
  - name: woodpecker
    kind: SecretStore
  selector:
    secret:
      name: woodpecker-db-credentials
  template:
    engineVersion: v2
    data:
      # `postgres://` and not `postgresql://` — woodpecker hands the string to
      # lib/pq, which accepts both, but this is the spelling its own docs use.
      # sslmode is stated rather than left to the driver default: CNPG serves
      # TLS with its own CA, so `require` encrypts without asking the client to
      # verify a certificate it has no root for.
      uri: postgres://{{ .username | urlquery }}:{{ .password | urlquery }}@postgres-rw.postgres.svc.cluster.local:5432/woodpecker?sslmode=require
  data:
  - match:
      secretKey: uri
      remoteRef:
        remoteKey: woodpecker-db
        property: DATABASE_URL
