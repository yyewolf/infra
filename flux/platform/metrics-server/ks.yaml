apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: metrics-server
  namespace: flux-system
spec:
  dependsOn:
  - name: cilium
  interval: 10m
  path: ./flux/platform/metrics-server
  prune: false
  retryInterval: 1m
  sourceRef:
    kind: GitRepository
    name: flux-system
