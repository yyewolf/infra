# Harbor needs ingress from the entire cluster (every service pushes or pulls)
# and egress to the internet for trivy vulnerability DB updates and registry
# mirroring. Inter-component traffic within the namespace is automatically
# covered by endpointSelector: {}.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: registry
spec:
  endpointSelector: {}
  ingress:
  - fromEntities:
    - cluster
  egress:
  - toEndpoints:
    - matchLabels:
        io.kubernetes.pod.namespace: kube-system
        k8s-app: kube-dns
    toPorts:
    - ports:
      - port: "53"
        protocol: UDP
      - port: "53"
        protocol: TCP
  - toEndpoints:
    - matchLabels:
        io.kubernetes.pod.namespace: registry
  - toCIDRSet:
    - cidr: 0.0.0.0/0
      except:
      - 10.0.0.0/8
      - 192.168.0.0/16
