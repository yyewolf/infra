apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: substrate
  namespace: ate-system
spec:
  # The release name decides the resource names, and the reference install
  # hardcodes the short forms. `substrate.fullname` returns a bare name only
  # when `.Release.Name` is exactly "substrate" and otherwise prefixes it — so
  # renaming this release turns `api.ate-system.svc:443` into
  # `<name>-api.ate-system.svc:443` and quietly breaks every endpoint that
  # platform/kagent/release.yaml, the egress gateway's own agentgateway config
  # and the atenet router all name as a literal string. Do not rename it.
  releaseName: substrate
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: substrate
  install:
    crds: Skip
    # The CA and JWT pools are minted out of band (see the long note at the
    # bottom of this file), so on a cold cluster every workload here sits
    # Pending on a missing Secret volume until they exist. Without a timeout
    # longer than the default 5m the install is declared failed and retried
    # from scratch on a loop while somebody runs kubectl-ate.
    timeout: 15m
    remediation:
      retries: -1
  upgrade:
    crds: Skip
    timeout: 15m
    remediation:
      retries: 3
  values:
    # platform/substrate/namespace.yaml owns it, because it carries a
    # PodSecurity label the chart cannot express.
    createNamespace: false

    # ---------------------------------------------------------------------
    # Postgres: the shared cluster, not the bundled one
    # ---------------------------------------------------------------------
    # Same rule as everything else here — there is one Postgres for the whole
    # cluster (platform/postgres) and an app gets a database on it, not an
    # instance of its own. Since 0.4 the chart has no bundled Postgres at all.
    #
    # The contract changed in 0.4 and is easy to half-satisfy. Substrate opens
    # two pools, and runs `SET ROLE <role>` on every new connection: the OWNER
    # pool (migrations) as `substrate_owner`, the READ/WRITE pool (everything
    # else) as `substrate_readwrite`. Both are NOLOGIN group roles; a login
    # without membership in the role it is asked to assume is rejected at
    # connect time. Tables live in the `substrate` schema, owned by
    # `substrate_owner`, and `substrate_readwrite` gets DML on them through
    # default privileges. All of that is declared in
    # platform/postgres/applications/kagent except the default privileges, which
    # CNPG cannot express — see the SQL in databaserole.yaml there.
    #
    # One login (`substrate`) is a member of both roles, so both secret refs
    # name the same pushed Secret. Upstream recommends a login per role; the
    # SET ROLE is what actually separates the two privilege sets, so two logins
    # would buy a second password to rotate and nothing else here.
    #
    # The old 0.3 tables are still in `public` and nothing reads them. Dropping
    # them is a separate, later decision.
    postgres:
      readWriteConnectionStringSecretRef:
        name: substrate-db
        key: connection-string
      ownerConnectionStringSecretRef:
        name: substrate-db
        key: connection-string
      readWriteRole: substrate_readwrite
      ownerRole: substrate_owner
      schema: substrate

    # ---------------------------------------------------------------------
    # Snapshots: the existing rustfs, not the bundled one
    # ---------------------------------------------------------------------
    # Turning this off removes three things, and only the first is obvious:
    # the rustfs Deployment and its PVC, the bucket-init Job (replaced by
    # bucket-init.yaml here), and — the one that bites — the whole S3 env block
    # on BOTH ate-api-server and atelet. Those five variables are inside
    # `{{- if .Values.rustfs.enabled }}` in each of those two templates, so with
    # it off the two components that read and write snapshots have no endpoint,
    # no region and no credentials at all. They are put back below.
    #
    # Leaving it on was not an option regardless of the duplicate storage:
    # the chart takes `rustfs.accessKey`/`secretKey` as plain Helm values and
    # interpolates them straight into a Deployment's env, i.e. into git.
    rustfs:
      enabled: false

    atelet:
      storageBackend: s3
      # atelet's half of the S3 configuration. It has an `extraEnv` hook, which
      # ate-api-server does not — that asymmetry is why one of these two lives
      # in values and the other in the postRenderer at the bottom of this file.
      # THE TWO LISTS MUST STAY IN STEP. If they drift, the component that kept
      # the right endpoint works and the other one fails on snapshot IO only,
      # which presents as agents that start and then cannot be suspended.
      extraEnv:
        - name: AWS_REGION
          value: us-east-1
        - name: AWS_ENDPOINT_URL
          value: http://rustfs.rustfs.svc.cluster.local:9000
        - name: AWS_S3_USE_PATH_STYLE
          value: "true"
        - name: AWS_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: substrate-s3
              key: access_key_id
        - name: AWS_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: substrate-s3
              key: secret_access_key

    ateApi:
      extraArgs:
        # The minimum supported interval for discovering and reconciling actor
        # templates. The chart's own comment calls it the minimum; the upstream
        # install and CI both set it, and leaving it at the default made
        # template preparation lag visibly behind an AgentTemplate edit.
        - --template-resync-interval=250ms

    # ---------------------------------------------------------------------
    # Credential injection
    # ---------------------------------------------------------------------
    # This is what lets an agent use the Infomaniak API key without the key
    # entering the agent's process. Substrate's egress gateway fetches the
    # referenced Secret and rewrites the outgoing header; the SDK inside the
    # sandbox holds an inert placeholder. kagent compiles same-namespace
    # references of the form ate-secret://k8s.io/default/kagent/<secret>/<key>
    # (the authority was `kubernetes.io` before substrate 0.3.0-alpha1; the
    # egress gateway config and the kagent compiler moved together).
    #
    # An empty list — the chart default — denies every credential fetch, so
    # without this entry the model call fails with no credential and nothing
    # in the agent's log to say a grant is missing.
    #
    # One atespace, one namespace: agents live in `kagent` and their Secrets
    # live in `kagent`. Adding a namespace here lets agents read Secrets there.
    credentialProvider:
      namespacePolicies:
        - atespace: kagent
          allowedNamespaces: [kagent]

    # No collector on this cluster. Left explicitly off rather than at the
    # chart defaults, which are `enabled: true` with an empty endpoint — the
    # chart's own README notes the Go components do not honour the disable flag,
    # so they fall back to the SDK default of localhost:4317 and retry against
    # nothing forever.
    otel:
      endpoint: ""
      traces:
        enabled: false
      metrics:
        enabled: false
      logs:
        enabled: false

  # -----------------------------------------------------------------------
  # ate-api-server's S3 configuration, and why it is a patch
  # -----------------------------------------------------------------------
  # These five variables are ate-api-server's half of the S3 configuration —
  # the half with no `extraEnv` hook (see `rustfs.enabled` above). Keep them
  # identical to `atelet.extraEnv`.
  #
  # Until 0.4 this patch also carried the Postgres DSN, because the chart put
  # it in a ConfigMap. The chart now reads both connection strings from Secret
  # refs itself, so that half is gone.
  postRenderers:
  - kustomize:
      patches:
      - target:
          kind: Deployment
          name: ate-api-server
        patch: |
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: ate-api-server
          spec:
            template:
              spec:
                containers:
                - name: ate-api-server
                  env:
                  - name: AWS_REGION
                    value: us-east-1
                  - name: AWS_ENDPOINT_URL
                    value: http://rustfs.rustfs.svc.cluster.local:9000
                  - name: AWS_S3_USE_PATH_STYLE
                    value: "true"
                  - name: AWS_ACCESS_KEY_ID
                    valueFrom:
                      secretKeyRef:
                        name: substrate-s3
                        key: access_key_id
                  - name: AWS_SECRET_ACCESS_KEY
                    valueFrom:
                      secretKeyRef:
                        name: substrate-s3
                        key: secret_access_key
