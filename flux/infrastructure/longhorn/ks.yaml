apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: longhorn
  namespace: flux-system
spec:
  dependsOn:
  - name: cilium
  interval: 10m
  path: ./flux/infrastructure/longhorn
  prune: true
  retryInterval: 1m
  # A StorageClass is immutable in every field that matters — `parameters`,
  # `provisioner`, `reclaimPolicy`, `volumeBindingMode` — so any edit to
  # storageclasses.yaml fails to apply with `field is immutable` and wedges this
  # whole Kustomization until someone deletes the object by hand. `force` makes
  # Flux delete and recreate on exactly that error, which is safe for a
  # StorageClass: a PV records its own parameters at provisioning time and holds
  # only the class *name*, so recreating the class is invisible to every volume
  # that already exists. It steers new claims only, which is the same thing
  # editing it was going to do.
  #
  # The one hazard is the gap: a PVC created in the second where the default
  # class does not exist gets no class at all and stays Pending. Nothing here
  # creates PVCs on a schedule; woodpecker does, per pipeline, and would fail
  # that build rather than anything worse.
  force: true
  sourceRef:
    kind: GitRepository
    name: flux-system
