apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: certificates
  namespace: flux-system
spec:
  decryption:
    provider: sops
    secretRef:
      name: sops-gpg
  dependsOn:
  - name: cert-manager
  interval: 10m
  path: ./flux/platform/certificates
  prune: true
  retryInterval: 1m
  sourceRef:
    kind: GitRepository
    name: flux-system
