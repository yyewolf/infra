apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: ssarchiver
spec:
  endpointSelector:
    matchLabels:
      app: ssarchiver
  ingress:
  - fromEndpoints:
    - matchLabels:
        io.kubernetes.pod.namespace: envoy-gateway-system
    toPorts:
    - ports:
      - port: "8080"
        protocol: TCP
  # The kubelet's probes originate from the node, not from a pod identity.
  - fromEntities:
    - host
    - remote-node
    - health
  egress:
  # DNS, with L7 visibility so the toFQDNs rule below can learn what
  # scoresaber.com resolves to. This must stay the only DNS rule: a second,
  # plain allow to kube-dns lets lookups bypass inspection and the FQDN entry
  # never populates.
  - toEndpoints:
    - matchLabels:
        io.kubernetes.pod.namespace: kube-system
        k8s-app: kube-dns
    toPorts:
    - ports:
      - port: "53"
        protocol: UDP
      - port: "53"
        protocol: TCP
      rules:
        dns:
        - matchPattern: "*"
  # The ScoreSaber and BeatLeader APIs, and the replays: ScoreSaber streams
  # them directly rather than redirecting to a CDN, BeatLeader serves its score
  # replays from api.beatleader.com/replays-storage and cdn.replays.beatleader.com.
  # The only other things the server fetches: the avatars and covers on
  # cdn.scoresaber.com, the ArcViewer map downloads and the API docs assets are
  # all loaded by the browser, and the ArcViewer build is embedded in the binary.
  - toFQDNs:
    - matchName: scoresaber.com
    - matchName: beatleader.com
    - matchName: api.beatleader.com
    - matchName: cdn.replays.beatleader.com
    toPorts:
    - ports:
      - port: "443"
        protocol: TCP
