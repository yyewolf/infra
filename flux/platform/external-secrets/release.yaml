apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: external-secrets
spec:
  interval: 30m
  chart:
    spec:
      chart: external-secrets
      version: "2.9.0"
      sourceRef:
        kind: HelmRepository
        name: external-secrets
      interval: 12h
  values:
    # The chart installs its CRDs by default; keep it explicit so a future
    # values override cannot silently drop them.
    installCRDs: true
