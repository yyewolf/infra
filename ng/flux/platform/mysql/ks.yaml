apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: mysql
  namespace: flux-system
spec:
  dependsOn:
    # cnmsql itself dependsOn cert-manager — its webhook is certless until
    # cainjector has run, and a certless webhook rejects every Cluster apply.
    # Waiting on the operator's own KS inherits that ordering.
    - name: cnmsql
    - name: longhorn
  interval: 10m
  path: ./ng/flux/platform/mysql
  prune: true
  retryInterval: 1m
  sourceRef:
    kind: GitRepository
    name: flux-system
