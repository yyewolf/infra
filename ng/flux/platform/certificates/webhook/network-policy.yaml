apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: infomaniak-webhook
spec:
  endpointSelector:
    matchLabels:
      app: infomaniak-webhook
  ingress:
  - fromEndpoints:
    - matchLabels:
        io.kubernetes.pod.namespace: cert-manager
        app: cert-manager
    toPorts:
    - ports:
      # The pod's listener, moved off 443 so the webhook can run unprivileged
      # (release.yaml). The Service still publishes 443 and resolves this by
      # name, so cert-manager's side of the connection is unchanged.
      - port: "8443"
        protocol: TCP
  egress:
  - toEntities:
    - kube-apiserver
    toPorts:
    - ports:
      - port: "6443"
        protocol: TCP
  - toEndpoints:
    - matchLabels:
        io.kubernetes.pod.namespace: kube-system
        k8s-app: kube-dns
    toPorts:
    - ports:
      - port: "53"
        protocol: UDP
      - port: "53"
        protocol: TCP
      rules:
        dns:
        - matchPattern: "*"
  - toFQDNs:
    - matchName: api.infomaniak.com
    - matchName: haproxy-api.infomaniak.ch
    toPorts:
    - ports:
      - port: "443"
        protocol: TCP
